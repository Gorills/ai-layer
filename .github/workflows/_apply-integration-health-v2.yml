name: apply-integration-health-v2

on:
  push:
    branches: [ai/integration-health-v2]
    paths: [.github/workflows/_apply-integration-health-v2.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/integration-health-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Apply bounded integration-health patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one fragment, found {count}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          status = 'src/ai_layer/integrations/status.py'
          replace_once(status, 'import json\nimport os\nimport shutil\n', 'import json\nimport os\nimport shutil\nimport tomllib\n')
          replace_once(
              status,
              '_PROVIDER_HEALTH_NOT_INSTALLED = "not_installed"\n',
              '''_PROVIDER_HEALTH_NOT_INSTALLED = "not_installed"\nSTATUS_CONTRACT_VERSION = 2\n_RUNTIME_VERIFIED = "verified"\n_RUNTIME_UNVERIFIED = "unverified"\n_RUNTIME_BLOCKED = "blocked"\n_RUNTIME_NOT_REQUIRED = "not_required"\n_OPERATIONAL_CONFIGURED_UNVERIFIED = "configured_unverified"\n''',
          )
          replace_once(
              status,
              '''def _apply_provider_health(state: dict) -> dict:\n    health = provider_install_status(\n        state.get("bootstrap"),\n        state.get("mcp"),\n        state.get("native_skills"),\n    )\n    state["status"] = health\n    state["ready"] = health == _PROVIDER_HEALTH_READY\n    return state\n\n\ndef _host_mcp_skills_state(\n    *,\n    path: Path,\n    mcp_ready: bool,\n    native_skills: dict,\n    extra: dict | None = None,\n) -> dict:\n    health = provider_install_status(mcp_ready, native_skills)\n    payload = {\n        "path": str(path),\n        "mcp_ready": mcp_ready,\n        "native_skills": native_skills,\n        "status": health,\n        "ready": health == _PROVIDER_HEALTH_READY,\n    }\n    if extra:\n        payload.update(extra)\n    return payload\n''',
              '''def _runtime_assurance(state: str, evidence: str, reason: str | None = None) -> dict:\n    return {"state": state, "evidence": evidence, "reason": reason}\n\n\ndef _operational_status(health: str, assurance: dict) -> str:\n    if health == _PROVIDER_HEALTH_NOT_INSTALLED:\n        return _PROVIDER_HEALTH_NOT_INSTALLED\n    if health != _PROVIDER_HEALTH_READY or assurance.get("state") == _RUNTIME_BLOCKED:\n        return _PROVIDER_HEALTH_DEGRADED\n    if assurance.get("state") == _RUNTIME_UNVERIFIED:\n        return _OPERATIONAL_CONFIGURED_UNVERIFIED\n    return _PROVIDER_HEALTH_READY\n\n\ndef _apply_status_contract(state: dict, *, health: str, runtime_assurance: dict) -> dict:\n    configuration_ready = health == _PROVIDER_HEALTH_READY\n    state["status_contract_version"] = STATUS_CONTRACT_VERSION\n    state["status"] = health\n    state["configuration_ready"] = configuration_ready\n    state["ready"] = configuration_ready\n    state["ready_semantics"] = "configuration"\n    state["runtime_assurance"] = runtime_assurance\n    state["operational_status"] = _operational_status(health, runtime_assurance)\n    return state\n\n\ndef _apply_provider_health(state: dict) -> dict:\n    health = provider_install_status(\n        state.get("bootstrap"),\n        state.get("mcp"),\n        state.get("native_skills"),\n    )\n    assurance = state.get("runtime_assurance") or _runtime_assurance(\n        _RUNTIME_UNVERIFIED, "filesystem", "host_runtime_not_observed"\n    )\n    return _apply_status_contract(state, health=health, runtime_assurance=assurance)\n\n\ndef _host_mcp_skills_state(\n    *,\n    path: Path,\n    mcp_ready: bool,\n    native_skills: dict,\n    runtime_assurance: dict | None = None,\n    extra: dict | None = None,\n    optional: bool = False,\n) -> dict:\n    health = provider_install_status(mcp_ready, native_skills)\n    payload = {\n        "path": str(path),\n        "mcp_ready": mcp_ready,\n        "native_skills": native_skills,\n    }\n    if extra:\n        payload.update(extra)\n    if optional:\n        payload["optional"] = True\n    assurance = runtime_assurance or _runtime_assurance(\n        _RUNTIME_UNVERIFIED, "filesystem", "host_runtime_not_observed"\n    )\n    return _apply_status_contract(payload, health=health, runtime_assurance=assurance)\n''',
          )
          replace_once(
              status,
              '''def global_bootstrap_status(deps: IntegrationStatusDependencies) -> dict:\n    home = Path.home()\n    plugin = home / ".cursor" / "plugins" / "local" / "ai-layer-bootstrap"\n    cursor_manifest = plugin / ".cursor-plugin" / "plugin.json"\n    cursor_rule = plugin / "rules" / "ai-layer.mdc"\n    return {\n        "codex": {\n            "path": str(home / ".codex" / "AGENTS.md"),\n            "ready": _bootstrap_file_status(home / ".codex" / "AGENTS.md", deps),\n            "verified_by": "documented user-level AGENTS.md",\n        },\n        "claude-code": {\n            "path": str(home / ".claude" / "CLAUDE.md"),\n            "ready": _bootstrap_file_status(home / ".claude" / "CLAUDE.md", deps),\n            "verified_by": "documented user memory file",\n        },\n        "antigravity-gemini": {\n            "path": str(home / ".gemini" / "GEMINI.md"),\n            "ready": _bootstrap_file_status(home / ".gemini" / "GEMINI.md", deps),\n            "verified_by": "documented global context file",\n        },\n        "cursor": {\n            "path": str(plugin),\n            "ready": deps.cursor_plugin_owned(plugin)\n            and cursor_manifest.exists()\n            and _bootstrap_version_current(cursor_rule, deps),\n            "verified_by": "owned local plugin files present; runtime black-box acceptance required",\n            "runtime_acceptance_required": True,\n        },\n    }\n''',
              '''def _active_codex_home(home: Path) -> Path:\n    configured = str(os.environ.get("CODEX_HOME") or "").strip()\n    return Path(configured).expanduser().resolve() if configured else home / ".codex"\n\n\ndef _nonempty_file(path: Path) -> bool:\n    if not path.is_file() or path.is_symlink():\n        return False\n    try:\n        return bool(path.read_text(encoding="utf-8").strip())\n    except (OSError, UnicodeDecodeError):\n        return False\n\n\ndef _bootstrap_payload(\n    *,\n    path: Path,\n    ready: bool,\n    verified_by: str,\n    runtime_assurance: dict,\n    extra: dict | None = None,\n) -> dict:\n    payload = {"path": str(path), "verified_by": verified_by}\n    if extra:\n        payload.update(extra)\n    health = _PROVIDER_HEALTH_READY if ready else _PROVIDER_HEALTH_NOT_INSTALLED\n    return _apply_status_contract(payload, health=health, runtime_assurance=runtime_assurance)\n\n\ndef global_bootstrap_status(deps: IntegrationStatusDependencies) -> dict:\n    home = Path.home()\n    codex_home = _active_codex_home(home)\n    codex_bootstrap = codex_home / "AGENTS.md"\n    codex_override = codex_home / "AGENTS.override.md"\n    codex_ready = _bootstrap_file_status(codex_bootstrap, deps)\n    codex_shadowed = codex_ready and _nonempty_file(codex_override)\n    plugin = home / ".cursor" / "plugins" / "local" / "ai-layer-bootstrap"\n    cursor_manifest = plugin / ".cursor-plugin" / "plugin.json"\n    cursor_rule = plugin / "rules" / "ai-layer.mdc"\n    cursor_ready = (\n        deps.cursor_plugin_owned(plugin)\n        and cursor_manifest.exists()\n        and _bootstrap_version_current(cursor_rule, deps)\n    )\n    return {\n        "codex": _bootstrap_payload(\n            path=codex_bootstrap,\n            ready=codex_ready,\n            verified_by="documented user-level AGENTS.md",\n            runtime_assurance=_runtime_assurance(\n                _RUNTIME_BLOCKED if codex_shadowed else _RUNTIME_UNVERIFIED,\n                "filesystem+host_contract",\n                "agents_override_shadows_global_bootstrap"\n                if codex_shadowed\n                else "host_runtime_not_observed",\n            ),\n            extra={\n                "codex_home": str(codex_home),\n                "override_path": str(codex_override),\n                "override_shadowing": codex_shadowed,\n            },\n        ),\n        "claude-code": _bootstrap_payload(\n            path=home / ".claude" / "CLAUDE.md",\n            ready=_bootstrap_file_status(home / ".claude" / "CLAUDE.md", deps),\n            verified_by="documented user memory file",\n            runtime_assurance=_runtime_assurance(\n                _RUNTIME_UNVERIFIED, "host_contract", "host_runtime_not_observed"\n            ),\n        ),\n        "antigravity-gemini": _bootstrap_payload(\n            path=home / ".gemini" / "GEMINI.md",\n            ready=_bootstrap_file_status(home / ".gemini" / "GEMINI.md", deps),\n            verified_by="documented global context file",\n            runtime_assurance=_runtime_assurance(\n                _RUNTIME_UNVERIFIED, "host_contract", "host_runtime_not_observed"\n            ),\n        ),\n        "cursor": _bootstrap_payload(\n            path=plugin,\n            ready=cursor_ready,\n            verified_by="owned local plugin files present; runtime black-box acceptance required",\n            runtime_assurance=_runtime_assurance(\n                _RUNTIME_UNVERIFIED, "filesystem", "cursor_runtime_not_observed"\n            ),\n            extra={"runtime_acceptance_required": True},\n        ),\n    }\n''',
          )
          replace_once(
              status,
              '''def _codex_has_ai_layer(path: Path, deps: IntegrationStatusDependencies) -> bool:\n    if not path.exists():\n        return False\n    try:\n        text = path.read_text(encoding="utf-8")\n    except (OSError, UnicodeDecodeError):\n        return False\n    return (\n        deps.toml_start in text\n        and deps.toml_end in text\n        and "[mcp_servers.ai-layer]" in text\n        and "command = " in text\n    )\n''',
              '''def _codex_mcp_status(path: Path, deps: IntegrationStatusDependencies) -> dict:\n    if not path.exists():\n        return {"present": False, "ready": False, "reason": "missing"}\n    try:\n        text = path.read_text(encoding="utf-8")\n        data = tomllib.loads(text)\n    except (OSError, UnicodeDecodeError, tomllib.TOMLDecodeError):\n        return {"present": True, "ready": False, "reason": "invalid_or_unreadable"}\n    servers = data.get("mcp_servers")\n    server = servers.get("ai-layer") if isinstance(servers, dict) else None\n    if not isinstance(server, dict):\n        return {"present": False, "ready": False, "reason": "missing"}\n    managed = deps.toml_start in text and deps.toml_end in text\n    if not managed:\n        return {"present": True, "ready": False, "reason": "ownership_conflict"}\n    if not server.get("command"):\n        return {"present": True, "ready": False, "reason": "missing_command"}\n    if server.get("enabled") is False:\n        return {"present": True, "ready": False, "reason": "mcp_disabled"}\n    return {"present": True, "ready": True, "reason": None}\n\n\ndef _codex_has_ai_layer(path: Path, deps: IntegrationStatusDependencies) -> bool:\n    return bool(_codex_mcp_status(path, deps).get("ready"))\n''',
          )
          old_global = '''def global_integration_status(deps: IntegrationStatusDependencies) -> dict:\n    home = Path.home()\n    targets = {\n        "cursor": home / ".cursor" / "mcp.json",\n        "antigravity": home / ".gemini" / "config" / "mcp_config.json",\n        "codex": home / ".codex" / "config.toml",\n        "claude-code": home / ".claude",\n    }\n    shared_native = _native_skill_catalog_status(home / ".agents" / "skills")\n    antigravity_native = _native_skill_catalog_status(home / ".gemini" / "config" / "skills")\n    claude_native = _native_skill_catalog_status(home / ".claude" / "skills")\n    cursor_mcp = _json_has_ai_layer(targets["cursor"], deps)\n    antigravity_mcp = _json_has_ai_layer(targets["antigravity"], deps)\n    codex_mcp = _codex_has_ai_layer(targets["codex"], deps)\n    claude_mcp = deps.claude_user_mcp_status()\n    claude_mcp_ready = bool(claude_mcp.get("owned"))\n    claude_cli_available = bool(claude_mcp.get("cli_available"))\n    claude_extra = {\n        "cli_available": claude_cli_available,\n        "mcp_reason": claude_mcp.get("reason"),\n    }\n    if not claude_cli_available:\n        claude_extra["note"] = (\n            "optional Claude CLI is not installed; Claude MCP is degraded, not a global install failure"\n        )\n    return {\n        "cursor": _host_mcp_skills_state(\n            path=targets["cursor"], mcp_ready=cursor_mcp, native_skills=shared_native\n        ),\n        "antigravity": _host_mcp_skills_state(\n            path=targets["antigravity"],\n            mcp_ready=antigravity_mcp,\n            native_skills=antigravity_native,\n        ),\n        "codex": _host_mcp_skills_state(\n            path=targets["codex"], mcp_ready=codex_mcp, native_skills=shared_native\n        ),\n        "claude-code": _host_mcp_skills_state(\n            path=targets["claude-code"],\n            mcp_ready=claude_mcp_ready,\n            native_skills=claude_native,\n            extra=claude_extra,\n        ),\n    }\n'''
          new_global = '''def _claude_runtime_assurance(claude_state: dict) -> dict:\n    if not claude_state.get("cli_available"):\n        return _runtime_assurance(\n            _RUNTIME_UNVERIFIED, "filesystem", "claude_cli_unavailable"\n        )\n    if claude_state.get("mcp_ready"):\n        return _runtime_assurance(\n            _RUNTIME_UNVERIFIED,\n            "host_cli+host_contract",\n            "bootstrap_and_skills_runtime_not_observed",\n        )\n    return _runtime_assurance(\n        _RUNTIME_UNVERIFIED, "host_cli", str(claude_state.get("mcp_reason") or "mcp_unverified")\n    )\n\n\ndef global_integration_status(deps: IntegrationStatusDependencies) -> dict:\n    home = Path.home()\n    codex_home = _active_codex_home(home)\n    targets = {\n        "cursor": home / ".cursor" / "mcp.json",\n        "antigravity": home / ".gemini" / "config" / "mcp_config.json",\n        "codex": codex_home / "config.toml",\n        "claude-code": home / ".claude",\n    }\n    shared_native = _native_skill_catalog_status(home / ".agents" / "skills")\n    antigravity_native = _native_skill_catalog_status(home / ".gemini" / "config" / "skills")\n    claude_native = _native_skill_catalog_status(home / ".claude" / "skills")\n    cursor_mcp = _json_has_ai_layer(targets["cursor"], deps)\n    antigravity_mcp = _json_has_ai_layer(targets["antigravity"], deps)\n    codex_mcp_state = _codex_mcp_status(targets["codex"], deps)\n    claude_mcp = deps.claude_user_mcp_status()\n    claude_mcp_ready = bool(claude_mcp.get("owned"))\n    claude_cli_available = bool(claude_mcp.get("cli_available"))\n    claude_extra = {\n        "cli_available": claude_cli_available,\n        "mcp_reason": claude_mcp.get("reason"),\n    }\n    if not claude_cli_available:\n        claude_extra["note"] = (\n            "optional Claude CLI is not installed; Claude MCP is degraded, not a global install failure"\n        )\n    codex_runtime = (\n        _runtime_assurance(_RUNTIME_BLOCKED, "host_config", "mcp_disabled")\n        if codex_mcp_state.get("reason") == "mcp_disabled"\n        else _runtime_assurance(_RUNTIME_UNVERIFIED, "host_contract", "host_runtime_not_observed")\n    )\n    return {\n        "cursor": _host_mcp_skills_state(\n            path=targets["cursor"],\n            mcp_ready=cursor_mcp,\n            native_skills=shared_native,\n            runtime_assurance=_runtime_assurance(\n                _RUNTIME_UNVERIFIED, "filesystem", "cursor_runtime_not_observed"\n            ),\n        ),\n        "antigravity": _host_mcp_skills_state(\n            path=targets["antigravity"],\n            mcp_ready=antigravity_mcp,\n            native_skills=antigravity_native,\n            runtime_assurance=_runtime_assurance(\n                _RUNTIME_UNVERIFIED, "host_contract", "host_runtime_not_observed"\n            ),\n        ),\n        "codex": _host_mcp_skills_state(\n            path=targets["codex"],\n            mcp_ready=bool(codex_mcp_state.get("ready")),\n            native_skills=shared_native,\n            runtime_assurance=codex_runtime,\n            extra={\n                "mcp_reason": codex_mcp_state.get("reason"),\n                "codex_home": str(codex_home),\n            },\n        ),\n        "claude-code": _host_mcp_skills_state(\n            path=targets["claude-code"],\n            mcp_ready=claude_mcp_ready,\n            native_skills=claude_native,\n            runtime_assurance=_claude_runtime_assurance(\n                {**claude_extra, "mcp_ready": claude_mcp_ready}\n            ),\n            extra=claude_extra,\n            optional=True,\n        ),\n    }\n'''
          replace_once(status, old_global, new_global)
          replace_once(
              status,
              '''def _core_hosts_ready(providers: dict, *, executable_ready: bool) -> bool:\n    return executable_ready and all(providers[name]["ready"] for name in _CORE_PROVIDERS)\n''',
              '''def _core_hosts_configured(providers: dict, *, executable_ready: bool) -> bool:\n    return executable_ready and all(\n        providers.get(name, {}).get("configuration_ready", providers.get(name, {}).get("ready", False))\n        for name in _CORE_PROVIDERS\n    )\n\n\ndef _aggregate_runtime_assurance(providers: dict) -> dict:\n    states = {\n        name: (providers.get(name, {}).get("runtime_assurance") or {}).get("state")\n        for name in _CORE_PROVIDERS\n    }\n    blocked = sorted(name for name, state in states.items() if state == _RUNTIME_BLOCKED)\n    if blocked:\n        return _runtime_assurance(\n            _RUNTIME_BLOCKED, "provider_aggregate", "blocked providers: " + ", ".join(blocked)\n        )\n    unverified = sorted(name for name, state in states.items() if state == _RUNTIME_UNVERIFIED)\n    if unverified:\n        return _runtime_assurance(\n            _RUNTIME_UNVERIFIED,\n            "provider_aggregate",\n            "runtime acceptance not verified: " + ", ".join(unverified),\n        )\n    return _runtime_assurance(_RUNTIME_VERIFIED, "provider_aggregate", None)\n\n\ndef _finish_integration_status(\n    payload: dict, *, providers: dict, executable_ready: bool\n) -> dict:\n    configuration_ready = _core_hosts_configured(providers, executable_ready=executable_ready)\n    assurance = _aggregate_runtime_assurance(providers)\n    health = _PROVIDER_HEALTH_READY if configuration_ready else _PROVIDER_HEALTH_DEGRADED\n    payload["status_contract_version"] = STATUS_CONTRACT_VERSION\n    payload["configuration_ready"] = configuration_ready\n    payload["ready"] = configuration_ready\n    payload["ready_semantics"] = "configuration"\n    payload["runtime_assurance"] = assurance\n    payload["operational_status"] = _operational_status(health, assurance)\n    return payload\n''',
          )
          start = Path(status).read_text(encoding='utf-8')
          external_start = start.index('def _external_status(')
          integration_start = start.index('\ndef integration_status(', external_start)
          before_external = start[:external_start]
          old_external = start[external_start:integration_start]
          new_external = '''def _external_status(\n    root: Path,\n    deps: IntegrationStatusDependencies,\n    *,\n    mode: str,\n    executable: str,\n    executable_ready: bool,\n    global_state: dict,\n) -> dict:\n    bootstrap = global_bootstrap_status(deps)\n    claude_state = global_state["claude-code"]\n    providers = {\n        "cursor": {\n            "bootstrap": bootstrap["cursor"]["ready"],\n            "mcp": global_state["cursor"]["mcp_ready"],\n            "native_skills": global_state["cursor"]["native_skills"]["ready"],\n            "runtime_acceptance_required": True,\n            "runtime_assurance": bootstrap["cursor"]["runtime_assurance"],\n        },\n        "codex": {\n            "bootstrap": bootstrap["codex"]["ready"],\n            "mcp": global_state["codex"]["mcp_ready"],\n            "mcp_reason": global_state["codex"].get("mcp_reason"),\n            "native_skills": global_state["codex"]["native_skills"]["ready"],\n            "runtime_assurance": bootstrap["codex"]["runtime_assurance"],\n        },\n        "antigravity": {\n            "bootstrap": bootstrap["antigravity-gemini"]["ready"],\n            "mcp": global_state["antigravity"]["mcp_ready"],\n            "native_skills": global_state["antigravity"]["native_skills"]["ready"],\n            "runtime_assurance": bootstrap["antigravity-gemini"]["runtime_assurance"],\n        },\n        "claude-code": {\n            "bootstrap": bootstrap["claude-code"]["ready"],\n            "mcp": bool(claude_state.get("mcp_ready")),\n            "native_skills": claude_state["native_skills"]["ready"],\n            "cli_available": bool(claude_state.get("cli_available")),\n            "runtime_assurance": _claude_runtime_assurance(claude_state),\n            "optional": True,\n        },\n    }\n    if claude_state.get("note"):\n        providers["claude-code"]["note"] = claude_state["note"]\n    if global_state["codex"].get("mcp_reason") == "mcp_disabled":\n        providers["codex"]["runtime_assurance"] = _runtime_assurance(\n            _RUNTIME_BLOCKED, "host_config", "mcp_disabled"\n        )\n    for state in providers.values():\n        _apply_provider_health(state)\n    payload = {\n        "project_root": str(root),\n        "mode": mode,\n        "repository_writes": False,\n        "mcp_executable": executable,\n        "mcp_executable_ready": executable_ready,\n        "template_version": deps.integration_template_version,\n        "global": global_state,\n        "bootstrap": bootstrap,\n        "providers": providers,\n        "cursor_runtime_acceptance_required": True,\n    }\n    return _finish_integration_status(\n        payload, providers=providers, executable_ready=executable_ready\n    )\n\n'''
          Path(status).write_text(before_external + new_external + start[integration_start:], encoding='utf-8')

          text = Path(status).read_text(encoding='utf-8')
          integration_start = text.index('def integration_status(')
          new_integration = '''def integration_status(deps: IntegrationStatusDependencies, project_root: str | Path) -> dict:\n    root = Path(project_root).expanduser().resolve()\n    global_state = global_integration_status(deps)\n    executable = deps.mcp_command()\n    executable_ready = _command_ready(executable)\n    mode = deps.project_mode(root)\n    if mode in {"external", "strict-private"}:\n        return _external_status(\n            root,\n            deps,\n            mode=mode,\n            executable=executable,\n            executable_ready=executable_ready,\n            global_state=global_state,\n        )\n    try:\n        targets = {\n            relative: deps.project_local_path(root, relative)\n            for relative in deps.project_integration_paths\n        }\n    except RuntimeError as exc:\n        return {\n            "project_root": str(root),\n            "mcp_executable": executable,\n            "mcp_executable_ready": executable_ready,\n            "template_version": deps.integration_template_version,\n            "global": global_state,\n            "providers": {},\n            "status_contract_version": STATUS_CONTRACT_VERSION,\n            "configuration_ready": False,\n            "ready": False,\n            "ready_semantics": "configuration",\n            "runtime_assurance": _runtime_assurance(\n                _RUNTIME_UNVERIFIED, "none", "unsafe_project_integration_path"\n            ),\n            "operational_status": _PROVIDER_HEALTH_DEGRADED,\n            "unsafe_path": str(exc),\n        }\n\n    bootstrap = global_bootstrap_status(deps)\n    claude_state = global_state["claude-code"]\n    project_codex = _codex_mcp_status(targets[".codex/config.toml"], deps)\n    if project_codex.get("present"):\n        codex_mcp = bool(project_codex.get("ready"))\n        codex_mcp_reason = project_codex.get("reason")\n    else:\n        codex_mcp = bool(global_state["codex"]["mcp_ready"])\n        codex_mcp_reason = global_state["codex"].get("mcp_reason")\n    codex_runtime = bootstrap["codex"]["runtime_assurance"]\n    if codex_mcp_reason == "mcp_disabled":\n        codex_runtime = _runtime_assurance(_RUNTIME_BLOCKED, "host_config", "mcp_disabled")\n    providers = {\n        "cursor": {\n            "bootstrap": bootstrap["cursor"]["ready"],\n            "mcp": _json_has_ai_layer(targets[".cursor/mcp.json"], deps)\n            or global_state["cursor"]["mcp_ready"],\n            "native_skills": global_state["cursor"]["native_skills"]["ready"],\n            "runtime_acceptance_required": True,\n            "runtime_assurance": bootstrap["cursor"]["runtime_assurance"],\n        },\n        "claude-code": {\n            "bootstrap": bootstrap["claude-code"]["ready"],\n            "mcp": _json_has_ai_layer(targets[".mcp.json"], deps)\n            or bool(claude_state.get("mcp_ready")),\n            "native_skills": claude_state["native_skills"]["ready"],\n            "cli_available": bool(claude_state.get("cli_available")),\n            "runtime_assurance": _claude_runtime_assurance(claude_state),\n            "optional": True,\n        },\n        "codex": {\n            "bootstrap": bootstrap["codex"]["ready"],\n            "mcp": codex_mcp,\n            "mcp_reason": codex_mcp_reason,\n            "native_skills": global_state["codex"]["native_skills"]["ready"],\n            "runtime_assurance": codex_runtime,\n        },\n        "antigravity": {\n            "bootstrap": bootstrap["antigravity-gemini"]["ready"],\n            "mcp": _json_has_ai_layer(targets[".agents/mcp_config.json"], deps)\n            or global_state["antigravity"]["mcp_ready"],\n            "native_skills": global_state["antigravity"]["native_skills"]["ready"],\n            "runtime_assurance": bootstrap["antigravity-gemini"]["runtime_assurance"],\n        },\n    }\n    if claude_state.get("note"):\n        providers["claude-code"]["note"] = claude_state["note"]\n    for state in providers.values():\n        _apply_provider_health(state)\n    payload = {\n        "project_root": str(root),\n        "mcp_executable": executable,\n        "mcp_executable_ready": executable_ready,\n        "template_version": deps.integration_template_version,\n        "global": global_state,\n        "bootstrap": bootstrap,\n        "providers": providers,\n        "cursor_runtime_acceptance_required": True,\n    }\n    return _finish_integration_status(\n        payload, providers=providers, executable_ready=executable_ready\n    )\n'''
          Path(status).write_text(text[:integration_start] + new_integration, encoding='utf-8')

          doctor = 'src/ai_layer/cli/doctor.py'
          replace_once(
              doctor,
              'import yaml\n\n\n@dataclass',
              'import yaml\n\n\n_CORE_INTEGRATION_PROVIDERS = frozenset({"cursor", "codex", "antigravity"})\n\n\ndef _canonical_provider(name: str) -> str:\n    return "antigravity" if name == "antigravity-gemini" else name\n\n\n@dataclass',
          )
          doctor_text = Path(doctor).read_text(encoding='utf-8')
          machine_start = doctor_text.index('def _machine_issues(')
          service_start = doctor_text.index('\ndef _service_issues(', machine_start)
          new_machine = '''def _machine_issues(\n    deps: DoctorDependencies, machine: dict, *, runtime_ready: bool, db_ready: bool\n) -> list[dict]:\n    issues: list[dict] = []\n    if not runtime_ready:\n        issues.append(\n            {\n                "severity": "error",\n                "problem": "stable runtime launcher is missing",\n                "action": "re-run ./install.sh from the release archive",\n            }\n        )\n    if not machine["docker_compose"]["available"]:\n        issues.append(\n            {\n                "severity": "error",\n                "problem": "Docker Compose is unavailable",\n                "action": "install Docker + compose plugin, then run ai-layer upgrade",\n            }\n        )\n    if not db_ready:\n        issues.append(\n            {\n                "severity": "error",\n                "problem": "PostgreSQL/pgvector is not ready",\n                "action": "ai-layer upgrade",\n            }\n        )\n    for provider, state in machine["global_integrations"].items():\n        if state.get("ready"):\n            continue\n        optional = bool(state.get("optional")) or provider == "claude-code"\n        issues.append(\n            {\n                "severity": "warning" if optional else "error",\n                "problem": (\n                    f"optional global {provider} MCP integration is unavailable"\n                    if optional\n                    else f"global {provider} MCP integration is missing"\n                ),\n                "action": "ai-layer upgrade",\n            }\n        )\n    runtime_unverified: list[str] = []\n    for provider, state in machine["global_bootstrap"].items():\n        if not state.get("ready"):\n            issues.append(\n                {\n                    "severity": "warning",\n                    "problem": f"global {provider} bootstrap instruction is missing",\n                    "action": "ai-layer upgrade",\n                }\n            )\n            continue\n        runtime = state.get("runtime_assurance") or {}\n        canonical = _canonical_provider(provider)\n        if runtime.get("state") == "blocked" and canonical in _CORE_INTEGRATION_PROVIDERS:\n            issues.append(\n                {\n                    "severity": "error",\n                    "problem": f"global {provider} runtime acceptance is blocked",\n                    "details": {"reason": runtime.get("reason")},\n                    "action": "resolve the reported host-side blocker, then run ai-layer doctor again",\n                }\n            )\n        elif runtime.get("state") == "unverified" and canonical in _CORE_INTEGRATION_PROVIDERS:\n            runtime_unverified.append(canonical)\n    if runtime_unverified:\n        issues.append(\n            {\n                "severity": "warning",\n                "problem": "configured host runtime acceptance is unverified: "\n                + ", ".join(sorted(set(runtime_unverified))),\n                "action": "run the supported-host black-box acceptance for the installed release when practical",\n            }\n        )\n    for process in machine["mcp_processes"]:\n        if not process.get("version_match", True):\n            issues.append(\n                {\n                    "severity": "warning",\n                    "problem": f"stale MCP process {process.get('pid')} is version {process.get('version')} while installed runtime is {deps.version}",\n                    "action": "reconnect/restart the IDE MCP host when convenient",\n                }\n            )\n    issues.extend(_service_issues(machine.get("service") or {}))\n    return issues\n\n'''
          Path(doctor).write_text(doctor_text[:machine_start] + new_machine + doctor_text[service_start:], encoding='utf-8')

          doctor_text = Path(doctor).read_text(encoding='utf-8')
          project_start = doctor_text.index('def _project_issues(')
          report_start = doctor_text.index('\ndef doctor_report(', project_start)
          new_project = '''def _project_issues(projects: list[dict]) -> list[dict]:\n    issues: list[dict] = []\n    for item in projects:\n        if not item.get("exists"):\n            issues.append(\n                {\n                    "severity": "warning",\n                    "problem": f"registered project path no longer exists: {item['root']}",\n                    "action": "ai-layer projects prune",\n                }\n            )\n            continue\n        if item.get("unsafe_path"):\n            issues.append(\n                {\n                    "severity": "error",\n                    "problem": f"unsafe project metadata path: {item['root']}",\n                    "action": "replace project-local AI Layer symlinks with real files/directories, then run ai-layer sync",\n                }\n            )\n            continue\n        if item.get("mode") == "strict-private" and not item.get("strict_private_ready", False):\n            issues.append(_strict_private_issue(item))\n            continue\n        if item.get("drift") or not item.get("ready"):\n            issues.append(\n                {\n                    "severity": "error",\n                    "problem": f"project integration drift: {item['root']}",\n                    "action": f"ai-layer repair --path {item['root']}",\n                }\n            )\n            continue\n        runtime = (item.get("integrations") or {}).get("runtime_assurance") or {}\n        if runtime.get("state") == "blocked":\n            issues.append(\n                {\n                    "severity": "error",\n                    "problem": f"project host runtime acceptance is blocked: {item['root']}",\n                    "details": {"reason": runtime.get("reason")},\n                    "action": "resolve the reported host-side blocker, then run ai-layer doctor again",\n                }\n            )\n        elif runtime.get("state") == "unverified":\n            issues.append(\n                {\n                    "severity": "warning",\n                    "problem": f"project integrations are configured but runtime acceptance is unverified: {item['root']}",\n                    "action": "run supported-host black-box acceptance when practical",\n                }\n            )\n    return issues\n\n'''
          Path(doctor).write_text(doctor_text[:project_start] + new_project + doctor_text[report_start:], encoding='utf-8')
          replace_once(
              doctor,
              '    global_ready = all(item["ready"] for item in machine["global_integrations"].values())\n',
              '''    global_ready = all(\n        (machine["global_integrations"].get(provider) or {}).get("ready", False)\n        for provider in _CORE_INTEGRATION_PROVIDERS\n    )\n''',
          )

          tests = 'tests/test_integrations.py'
          replace_once(
              tests,
              '''    state = integration_status(project)\n    assert state["template_version"] == INTEGRATION_TEMPLATE_VERSION\n    assert all(provider["ready"] for provider in state["providers"].values())\n    get_settings.cache_clear()\n''',
              '''    state = integration_status(project)\n    assert state["template_version"] == INTEGRATION_TEMPLATE_VERSION\n    assert all(provider["ready"] for provider in state["providers"].values())\n    assert state["ready"] is True\n    assert state["configuration_ready"] is True\n    assert state["ready_semantics"] == "configuration"\n    assert state["operational_status"] == "configured_unverified"\n    cursor_state = state["providers"]["cursor"]\n    assert cursor_state["ready"] is True\n    assert cursor_state["configuration_ready"] is True\n    assert cursor_state["runtime_assurance"]["state"] == "unverified"\n    assert cursor_state["operational_status"] == "configured_unverified"\n    get_settings.cache_clear()\n''',
          )
          insertion = '''\n\ndef _installed_health_fixture(tmp_path: Path, monkeypatch):\n    home = tmp_path / "home"\n    project = tmp_path / "project"\n    home.mkdir()\n    project.mkdir()\n    executable = home / "bin" / "ai-layer-mcp"\n    executable.parent.mkdir()\n    executable.write_text("#!/bin/sh\\n", encoding="utf-8")\n    executable.chmod(0o755)\n    monkeypatch.setenv("HOME", str(home))\n    monkeypatch.setenv("AI_LAYER_HOME", str(home / ".ai-layer"))\n    monkeypatch.setenv("AI_LAYER_MCP_EXECUTABLE", str(executable))\n    monkeypatch.delenv("CODEX_HOME", raising=False)\n    get_settings.cache_clear()\n    install_global_integrations()\n    install_project_integrations(project)\n    return home, project\n\n\ndef test_codex_override_blocks_runtime_without_reclassifying_configuration(tmp_path: Path, monkeypatch):\n    home, project = _installed_health_fixture(tmp_path, monkeypatch)\n    override = home / ".codex" / "AGENTS.override.md"\n    override.write_text("# temporary override\\n", encoding="utf-8")\n\n    state = integration_status(project)\n    codex = state["providers"]["codex"]\n    assert codex["ready"] is True\n    assert codex["configuration_ready"] is True\n    assert codex["runtime_assurance"]["state"] == "blocked"\n    assert codex["runtime_assurance"]["reason"] == "agents_override_shadows_global_bootstrap"\n    assert codex["operational_status"] == "degraded"\n    assert state["ready"] is True\n    assert state["operational_status"] == "degraded"\n\n    override.write_text("   \\n", encoding="utf-8")\n    recovered = integration_status(project)["providers"]["codex"]\n    assert recovered["runtime_assurance"]["state"] == "unverified"\n    get_settings.cache_clear()\n\n\ndef test_codex_project_disabled_mcp_is_not_masked_by_global_config(tmp_path: Path, monkeypatch):\n    _home, project = _installed_health_fixture(tmp_path, monkeypatch)\n    config = project / ".codex" / "config.toml"\n    text = config.read_text(encoding="utf-8")\n    config.write_text(text.replace("args = []\\n", "enabled = false\\nargs = []\\n", 1), encoding="utf-8")\n\n    state = integration_status(project)\n    codex = state["providers"]["codex"]\n    assert codex["ready"] is False\n    assert codex["configuration_ready"] is False\n    assert codex["mcp_reason"] == "mcp_disabled"\n    assert codex["runtime_assurance"]["state"] == "blocked"\n    assert state["ready"] is False\n    get_settings.cache_clear()\n\n\ndef test_codex_status_reads_active_codex_home(tmp_path: Path, monkeypatch):\n    home, project = _installed_health_fixture(tmp_path, monkeypatch)\n    active = home / "custom-codex-home"\n    active.mkdir()\n    monkeypatch.setenv("CODEX_HOME", str(active))\n\n    state = integration_status(project)\n    codex = state["providers"]["codex"]\n    assert state["bootstrap"]["codex"]["path"] == str(active / "AGENTS.md")\n    assert codex["bootstrap"] is False\n    assert codex["configuration_ready"] is False\n    get_settings.cache_clear()\n'''
          anchor = '\n\ndef test_global_merge_preserves_unrelated_servers_and_creates_backup'
          text = Path(tests).read_text(encoding='utf-8')
          if anchor not in text:
              raise RuntimeError('tests/test_integrations.py insertion anchor missing')
          Path(tests).write_text(text.replace(anchor, insertion + anchor, 1), encoding='utf-8')

          cli_tests = 'tests/test_cli.py'
          replace_once(
              cli_tests,
              '''        lambda: {\n            "cursor": {"ready": True},\n            "antigravity": {"ready": True},\n            "codex": {"ready": True},\n        },\n''',
              '''        lambda: {\n            "cursor": {"ready": True},\n            "antigravity": {"ready": True},\n            "codex": {"ready": True},\n            "claude-code": {"ready": False, "optional": True},\n        },\n''',
          )
          anchor = '\n\ndef test_audit_check_cli_treats_duplicate_context_as_tool_economy_warning'
          addition = '''\n\ndef test_doctor_runtime_assurance_warns_when_unverified_and_errors_when_blocked():\n    from types import SimpleNamespace\n\n    from ai_layer.cli.doctor import _machine_issues\n\n    machine = {\n        "docker_compose": {"available": True},\n        "global_integrations": {\n            "cursor": {"ready": True},\n            "codex": {"ready": True},\n            "antigravity": {"ready": True},\n            "claude-code": {"ready": False, "optional": True},\n        },\n        "global_bootstrap": {\n            "cursor": {\n                "ready": True,\n                "runtime_assurance": {"state": "unverified", "reason": "cursor_runtime_not_observed"},\n            },\n            "codex": {\n                "ready": True,\n                "runtime_assurance": {"state": "unverified", "reason": "host_runtime_not_observed"},\n            },\n            "antigravity-gemini": {\n                "ready": True,\n                "runtime_assurance": {"state": "unverified", "reason": "host_runtime_not_observed"},\n            },\n        },\n        "mcp_processes": [],\n        "service": {},\n    }\n    issues = _machine_issues(\n        SimpleNamespace(version="test"), machine, runtime_ready=True, db_ready=True\n    )\n    assert not [item for item in issues if item["severity"] == "error"]\n    assert any("runtime acceptance is unverified" in item["problem"] for item in issues)\n\n    machine["global_bootstrap"]["codex"]["runtime_assurance"] = {\n        "state": "blocked",\n        "reason": "agents_override_shadows_global_bootstrap",\n    }\n    blocked = _machine_issues(\n        SimpleNamespace(version="test"), machine, runtime_ready=True, db_ready=True\n    )\n    assert any(\n        item["severity"] == "error"\n        and "codex runtime acceptance is blocked" in item["problem"]\n        for item in blocked\n    )\n'''
          text = Path(cli_tests).read_text(encoding='utf-8')
          if anchor not in text:
              raise RuntimeError('tests/test_cli.py insertion anchor missing')
          Path(cli_tests).write_text(text.replace(anchor, addition + anchor, 1), encoding='utf-8')
          PY
      - name: Format and static checks
        run: |
          ruff check --fix src/ai_layer/integrations/status.py src/ai_layer/cli/doctor.py tests/test_integrations.py tests/test_cli.py
          ruff format src/ai_layer/integrations/status.py src/ai_layer/cli/doctor.py tests/test_integrations.py tests/test_cli.py
          ruff check src/ai_layer/integrations/status.py src/ai_layer/cli/doctor.py tests/test_integrations.py tests/test_cli.py
          mypy src/ai_layer
      - name: Targeted regressions
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest tests/test_integrations.py tests/test_cli.py
      - name: Refresh deterministic wheel and manifest
        shell: bash
        run: |
          python scripts/build_release_wheel.py
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest_path = Path('release/release-manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          wheel = Path(manifest['application_wheel'])
          manifest['application_wheel_sha256'] = hashlib.sha256(wheel.read_bytes()).hexdigest()
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=False) + '\n', encoding='utf-8')
          print(manifest['application_wheel_sha256'])
          PY
      - name: Commit clean change-set
        shell: bash
        run: |
          rm .github/workflows/_apply-integration-health-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ai_layer/integrations/status.py src/ai_layer/cli/doctor.py tests/test_integrations.py tests/test_cli.py dist/local_ai_development_layer-0.14.0-py3-none-any.whl release/release-manifest.json .github/workflows/_apply-integration-health-v2.yml
          git commit -m 'Add truthful integration health v2 contract'
          git push origin HEAD:ai/integration-health-v2
