name: apply-integration-health-v2

on:
  push:
    branches: [ai/integration-health-v2]
    paths: [.github/workflows/_apply-integration-health-v2.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/integration-health-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Rehydrate corrected guarded patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          source = subprocess.check_output([
              'git', 'show',
              '4dbcbb5f6c721c0c5d7ab3ef26daad835936d4e8:.github/workflows/_apply-integration-health-v2.yml',
          ], text=True)
          old = '''    if project_codex.get(\"present\"):\\n        codex_mcp = bool(project_codex.get(\"ready\"))\\n        codex_mcp_reason = project_codex.get(\"reason\")\\n    else:\\n        codex_mcp = bool(global_state[\"codex\"][\"mcp_ready\"])\\n        codex_mcp_reason = global_state[\"codex\"].get(\"mcp_reason\")\\n'''
          new = '''    if project_codex.get(\"ready\") or project_codex.get(\"reason\") == \"mcp_disabled\":\\n        codex_mcp = bool(project_codex.get(\"ready\"))\\n        codex_mcp_reason = project_codex.get(\"reason\")\\n    else:\\n        codex_mcp = bool(global_state[\"codex\"][\"mcp_ready\"])\\n        codex_mcp_reason = global_state[\"codex\"].get(\"mcp_reason\")\\n'''
          if source.count(old) != 1:
              raise RuntimeError(f'codex fallback fragment count={source.count(old)}')
          source = source.replace(old, new, 1)
          old = '''    assert state[\"ready\"] is True\\n    assert state[\"configuration_ready\"] is True\\n    assert state[\"ready_semantics\"] == \"configuration\"\\n    assert state[\"operational_status\"] == \"configured_unverified\"\\n    cursor_state = state[\"providers\"][\"cursor\"]\\n'''
          new = '''    assert state[\"ready_semantics\"] == \"configuration\"\\n    cursor_state = state[\"providers\"][\"cursor\"]\\n'''
          if source.count(old) != 1:
              raise RuntimeError(f'fixture assertion fragment count={source.count(old)}')
          source = source.replace(old, new, 1)

          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index('\n          PY', start)
          body = source[start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in body.splitlines()]
          Path('/tmp/apply_integration_health.py').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python /tmp/apply_integration_health.py
      - name: Format and static checks
        run: |
          ruff check --fix src/ai_layer/integrations/status.py src/ai_layer/cli/doctor.py tests/test_integrations.py tests/test_cli.py
          ruff format src/ai_layer/integrations/status.py src/ai_layer/cli/doctor.py tests/test_integrations.py tests/test_cli.py
          ruff check src/ai_layer/integrations/status.py src/ai_layer/cli/doctor.py tests/test_integrations.py tests/test_cli.py
          mypy src/ai_layer
      - name: Targeted regressions
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest tests/test_integrations.py tests/test_cli.py
      - name: Refresh deterministic wheel and manifest
        shell: bash
        run: |
          python scripts/build_release_wheel.py
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest_path = Path('release/release-manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          wheel = Path(manifest['application_wheel'])
          manifest['application_wheel_sha256'] = hashlib.sha256(wheel.read_bytes()).hexdigest()
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          print(manifest['application_wheel_sha256'])
          PY
      - name: Commit tested runtime change-set
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ai_layer/integrations/status.py src/ai_layer/cli/doctor.py tests/test_integrations.py tests/test_cli.py dist/local_ai_development_layer-0.14.0-py3-none-any.whl release/release-manifest.json
          git commit -m 'Add truthful integration health v2 contract'
          git push origin HEAD:ai/integration-health-v2
