name: apply-natural-managed-task-routing
on:
  push:
    branches: [ai/natural-managed-task-routing]
    paths: [.github/workflows/_apply-natural-managed-task-routing.yml]
permissions:
  contents: write
jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16@sha256:a132765ec351c65111b5b675928a3a0515a466a40f97277329db8b8209ad8bc9
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_layer_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AI_LAYER_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/ai_layer_gate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/natural-managed-task-routing
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Apply bounded routing and backend Work linkage patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one fragment, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Product principle: architecture guidance, not agent bootstrap bloat.
          replace_once(
              'PRODUCT_GOAL.md',
              '## Required agent experience\n\n### Cheap startup and continuation\n',
              '''## Required agent experience\n\n### Agent-effort design principle\n\nAgents report user intent and genuinely new facts. AI Layer derives mechanics, identifiers, links and state that the control plane already owns. One user intent should map to one obvious primary tool; agents should not mirror backend state or perform bookkeeping that AI Layer can safely infer or repair.\n\nFor a new request, existing durable focus resumes first. With no active focus, an explicit user request for a managed Task or the standard Task protocol enters `task_create` directly; ordinary substantive work defaults to `work_begin`; tiny one-shot Q&A may stay unmaterialized. If a managed Task needs a backing WorkItem for portfolio history, AI Layer creates or links it automatically. Add agent ceremony only when the backend cannot safely resolve the ambiguity itself.\n\n### Cheap startup and continuation\n''',
          )

          # Runtime contract + machine-readable idle route.
          replace_once('src/ai_layer/domain/agent_contract.py', 'AGENT_RUNTIME_CONTRACT_VERSION = 3', 'AGENT_RUNTIME_CONTRACT_VERSION = 4')
          replace_once(
              'src/ai_layer/domain/agent_contract.py',
              '''            "idle_next": "work_begin",\n            "kinds": list(WORK_ITEM_KINDS),\n''',
              '''            "idle_next": "work_begin",\n            "new_request_routing": {\n                "explicit_managed_task": {\n                    "when": "user explicitly requests a managed Task or standard Task protocol",\n                    "tool": "task_create",\n                    "backing_work": "automatic",\n                },\n                "default_substantive": {"tool": "work_begin"},\n                "tiny_q_and_a": {"tool": None},\n            },\n            "kinds": list(WORK_ITEM_KINDS),\n''',
          )
          replace_once(
              'src/ai_layer/domain/agent_contract.py',
              '''    return {\n        "action": "begin_ordinary_work",\n        "tool": "work_begin",\n        "required": ["goal"],\n        "kind": list(WORK_ITEM_KINDS),\n        "skip_when": WORK_UNMATERIALIZED,\n    }\n''',
              '''    return {\n        "action": "route_new_request",\n        "tool": "work_begin",\n        "required": ["goal"],\n        "kind": list(WORK_ITEM_KINDS),\n        "managed_task_route": {\n            "when": "user explicitly requests a managed Task or standard Task protocol",\n            "tool": "task_create",\n            "required": ["goal"],\n            "backing_work": "automatic",\n        },\n        "skip_when": WORK_UNMATERIALIZED,\n    }\n''',
          )
          replace_once(
              'src/ai_layer/domain/agent_contract.py',
              '''        "registered-project state call and apply its `project_policy`. When continuation.kind is none, "\n        "call `work_begin` before other tools for substantive ordinary work and close with one terminal "\n        "Work call; use `work_checkpoint` only for meaningful milestones or "\n        "blockers. A managed Task is optional assurance, not the ordinary-work record. If code location is "\n''',
              '''        "registered-project state call and apply its `project_policy`. When continuation.kind is none, "\n        "explicit user Task/standard-Task-protocol intent goes directly to `task_create`; otherwise substantive "\n        "ordinary work goes to `work_begin` and closes with one terminal Work call. AI Layer creates/links backing "\n        "Work for managed Tasks automatically; use `work_checkpoint` only for meaningful milestones or blockers. "\n        "If code location is "\n''',
          )

          # Project status idle instruction remains backward-compatible via tool=work_begin but exposes explicit route.
          replace_once(
              'src/ai_layer/application/project_intelligence.py',
              '''        "instruction": (\n            "No live Work. For a new substantive request — including diagnose, review, "\n            "research, and multi-step investigation — call work_begin before other tools, "\n            "then execute host-natively. Tiny one-shot Q&A may stay unmaterialized."\n        ),\n''',
              '''        "instruction": (\n            "No live Work. If the user explicitly asks for a managed Task or the standard Task protocol, "\n            "call task_create directly; AI Layer handles backing Work automatically. Otherwise start substantive "\n            "ordinary work with work_begin. Tiny one-shot Q&A may stay unmaterialized."\n        ),\n''',
          )

          # Always-on bootstrap: one compact routing rule, no new checklist.
          replace_once(
              'src/ai_layer/domain/orchestrator.py',
              '''        "work_rule": (\n            "When project_status continuation.kind is none, call work_begin before other tools for "\n            "substantive work. Short work normally needs only work_begin plus one terminal call; "\n            "managed Tasks remain optional assurance."\n        ),\n''',
              '''        "work_rule": (\n            "When project_status continuation.kind is none, explicit user Task/standard-Task-protocol intent "\n            "goes directly to task_create; otherwise substantive work starts with work_begin. Backing Work for "\n            "managed Tasks is automatic."\n        ),\n''',
          )
          replace_once(
              'src/ai_layer/domain/orchestrator.py',
              '''- After `project_status`, if `work.continuation.kind` is `none` and the request is substantive (implement, diagnose, review, research, multi-step investigation, live checks), call `work_begin` before other tools and pick `kind` accordingly. Tiny one-shot Q&A with no durable value may stay unmaterialized. Close with one of `work_complete`, `work_fail`, `work_interrupt`, or `work_abandon`. Use `work_checkpoint` only for a meaningful milestone or blocker. Managed Task is optional assurance, not ordinary-work identity.\n''',
              '''- After `project_status`, if `work.continuation.kind` is `none`, route by user intent: an explicit managed Task / standard Task protocol request calls `task_create` directly; otherwise substantive work (implement, diagnose, review, research, multi-step investigation, live checks) starts with `work_begin`. AI Layer creates or links backing Work for managed Tasks automatically. Tiny one-shot Q&A with no durable value may stay unmaterialized. Ordinary Work closes with one terminal Work call; use `work_checkpoint` only for a meaningful milestone or blocker.\n''',
          )
          replace_once(
              'src/ai_layer/domain/orchestrator.py',
              '''- Existing managed Tasks and Epics remain durable strict workflows. When status reports one as the current managed focus, or the user explicitly chooses managed execution, use `task_next` / `epic_next`.\n''',
              '''- Existing managed Tasks and Epics remain durable strict workflows. Resume an active managed focus with `task_next` / `epic_next`; for a new explicit managed Task request, start with `task_create` and follow its returned live next action.\n''',
          )

          # Managed Task idle/tool descriptions make direct intent routing obvious.
          replace_once(
              'src/ai_layer/application/tasks.py',
              '''                "No managed Task is active. Continue ordinary work through the host-native agent runtime; "\n                "a managed Task is not required. Create one only when the user or task needs durable/strict "\n                "managed execution."\n''',
              '''                "No managed Task is active. Ordinary work remains host-native. If the user explicitly "\n                "asked for a managed Task or standard Task protocol, call task_create directly; AI Layer creates "\n                "or links the backing Work automatically."\n''',
          )
          replace_once(
              'src/ai_layer/mcp/tools/tasks.py',
              '''    """WHEN: no managed Task is active and the user/agent explicitly chooses durable or strict managed execution. This tool is NOT required before ordinary host-native edits. INPUT: goal plus compact acceptance_criteria/constraints; normally keep workflow/risk/complexity/uncertainty/cost_policy=auto. Dirty worktrees are valid: AI Layer captures the exact current repository state as the immutable Task baseline and preserves pre-existing changes separately from the later managed delta. AI Layer classifies MICRO/STANDARD/DISCOVERY_FIRST/ANALYSIS_ONLY and returns the live managed next action."""\n''',
              '''    """WHEN: no managed Task is active and the user explicitly asks for a managed Task / standard Task protocol, or strict managed assurance is otherwise explicitly chosen. Call task_create directly; AI Layer creates or links the backing Work automatically, so no prior work_begin plumbing is needed. INPUT: goal plus compact acceptance_criteria/constraints; normally keep workflow/risk/complexity/uncertainty/cost_policy=auto. Dirty worktrees are valid: AI Layer captures the exact current repository state as the immutable Task baseline and preserves pre-existing changes separately from the later managed delta. AI Layer classifies MICRO/STANDARD/DISCOVERY_FIRST/ANALYSIS_ONLY and returns the live managed next action."""\n''',
          )
          replace_once(
              'src/ai_layer/mcp/tools/work.py',
              '''    """WHEN: begin one substantive user request (change, diagnose, review, research, planning, or ops), including investigation that should fill Project Map. Call after project_status when continuation.next_action.tool is work_begin. One WorkItem records what happened; a managed Task remains optional assurance. For short work pair this with work_complete and skip checkpoints. Reuse idempotency_key when retrying the same host event."""\n''',
              '''    """WHEN: begin one substantive ordinary user request (change, diagnose, review, research, planning, or ops), including investigation that should fill Project Map. Call after project_status on the default substantive route; an explicit managed Task / standard Task protocol request routes directly to task_create instead. For short work pair this with work_complete and skip checkpoints. Reuse idempotency_key when retrying the same host event."""\n''',
          )

          # Managed workflow skill mirrors the same two-way idle routing, without a second procedure engine.
          p = Path('src/ai_layer/builtin_skills/ai-layer-workflow.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'If `continuation.kind` is `none`, call `work_begin` before other tools unless the request is tiny one-shot Q&A. Do not invent a Task or Epic from old prose.',
              'If `continuation.kind` is `none`, an explicit managed Task / standard Task protocol request goes directly to `task_create`; otherwise substantive work starts with `work_begin`. Tiny one-shot Q&A may stay unmaterialized. Do not invent a Task or Epic from old prose.',
          )
          text = text.replace(
              '3. If `work.continuation.kind` is `none`, call `work_begin` before other tools unless the request is tiny one-shot Q&A. Short work should normally use only `work_begin` plus one terminal Work call (`work_complete`, `work_fail`, `work_interrupt`, or `work_abandon`). Use `work_checkpoint` only at a meaningful milestone or blocker.',
              '3. If `work.continuation.kind` is `none`, route explicit managed Task / standard Task protocol intent directly to `task_create`; otherwise substantive work starts with `work_begin`. AI Layer handles backing Work for managed Tasks automatically. Tiny one-shot Q&A may stay unmaterialized. Short ordinary work should normally use only `work_begin` plus one terminal Work call.',
          )
          text = text.replace(
              'If `continuation.kind` is `none`, call `work_begin` before other tools unless the request is tiny one-shot Q&A.',
              'If `continuation.kind` is `none`, explicit managed Task / standard Task protocol intent goes to `task_create`; otherwise substantive work goes to `work_begin`.',
          )
          p.write_text(text, encoding='utf-8')

          # Bootstrap text changed, so installed host bootstrap version must advance.
          replace_once(
              'src/ai_layer/integrations/versioning.py',
              'GLOBAL_BOOTSTRAP_VERSION = 15',
              'GLOBAL_BOOTSTRAP_VERSION = 16',
          )

          # Backend-owned Task <-> Work lifecycle seam.
          Path('src/ai_layer/application/managed_work.py').write_text('''from __future__ import annotations\n\nfrom datetime import datetime\nfrom uuid import UUID\n\nfrom sqlalchemy import func, select\nfrom sqlalchemy.orm import Session\n\nfrom ai_layer.db.models import Project, Task, utcnow\nfrom ai_layer.db.work_models import RuntimeEventContext, WorkItem\nfrom ai_layer.observability.work_events import append_contextual_event\nfrom ai_layer.work.service import finish_work, work_to_dict\n\n\ndef _task_row(db: Session, project: Project, payload: dict) -> Task:\n    raw_id = str(payload.get("id") or "").strip()\n    if not raw_id:\n        raise RuntimeError("managed Task result is missing id")\n    task = db.scalar(select(Task).where(Task.id == UUID(raw_id), Task.project_id == project.id))\n    if task is None:\n        raise RuntimeError("managed Task no longer exists in this project")\n    return task\n\n\ndef _linked_work(db: Session, task: Task) -> WorkItem | None:\n    return db.scalar(\n        select(WorkItem)\n        .where(WorkItem.project_id == task.project_id, WorkItem.linked_task_id == task.id)\n        .order_by(WorkItem.updated_at.desc(), WorkItem.sequence.desc())\n        .limit(1)\n    )\n\n\ndef _matching_unlinked_work(db: Session, task: Task) -> WorkItem | None:\n    rows = list(\n        db.scalars(\n            select(WorkItem)\n            .where(\n                WorkItem.project_id == task.project_id,\n                WorkItem.linked_task_id.is_(None),\n                WorkItem.status.in_(("active", "blocked")),\n                WorkItem.goal == task.goal,\n            )\n            .order_by(WorkItem.updated_at.desc(), WorkItem.sequence.desc())\n            .limit(2)\n        ).all()\n    )\n    return rows[0] if len(rows) == 1 else None\n\n\ndef _new_control_plane_work(db: Session, project: Project, task: Task) -> WorkItem:\n    locked = db.scalar(select(Project).where(Project.id == project.id).with_for_update())\n    if locked is None:\n        raise RuntimeError("project no longer exists")\n    sequence = int(\n        db.scalar(\n            select(func.coalesce(func.max(WorkItem.sequence), 0)).where(\n                WorkItem.project_id == project.id\n            )\n        )\n        or 0\n    ) + 1\n    now = utcnow()\n    work = WorkItem(\n        project_id=project.id,\n        sequence=sequence,\n        goal=task.goal,\n        kind="research" if task.workflow_profile == "analysis_only" else "change",\n        status="active",\n        map_disposition={"status": "pending"},\n        observability_coverage="control_plane_only",\n        assurance="agent_reported",\n        linked_task_id=task.id,\n        started_at=now,\n        updated_at=now,\n        last_milestone_at=now,\n    )\n    db.add(work)\n    db.flush()\n    append_contextual_event(\n        db,\n        event_type="WorkStarted",\n        project=project,\n        aggregate_type="work",\n        aggregate_id=str(work.id),\n        work=work,\n        task_id=task.id,\n        payload={"goal": work.goal, "kind": work.kind, "status": work.status},\n        importance="high",\n    )\n    return work\n\n\ndef _backfill_task_context(db: Session, task: Task, work: WorkItem) -> None:\n    for row in db.scalars(\n        select(RuntimeEventContext).where(\n            RuntimeEventContext.task_id == task.id, RuntimeEventContext.work_id.is_(None)\n        )\n    ).all():\n        row.work_id = work.id\n\n\ndef _changed_paths(task: Task) -> list[str]:\n    changes = dict(task.final_changes or {})\n    paths: list[str] = []\n    for field in ("added", "modified", "deleted", "renamed", "untracked"):\n        value = changes.get(field)\n        if isinstance(value, list):\n            paths.extend(str(item) for item in value if isinstance(item, str) and item)\n    return list(dict.fromkeys(paths))\n\n\ndef _terminal_summary(task: Task) -> str:\n    return str(task.completion_summary or task.blocked_reason or f"Managed Task T-{task.sequence:04d} finished.")\n\n\ndef sync_task_backing_work(\n    db: Session,\n    project: Project,\n    task_result: dict,\n    *,\n    create_if_missing: bool = False,\n) -> dict | None:\n    """Derive backing Work from managed Task state; callers never ask the agent to maintain the link."""\n    task = _task_row(db, project, task_result)\n    work = _linked_work(db, task)\n    if work is None and create_if_missing:\n        work = _matching_unlinked_work(db, task)\n        if work is not None:\n            work.linked_task_id = task.id\n            work.updated_at = utcnow()\n            work.last_milestone_at = work.updated_at\n        else:\n            work = _new_control_plane_work(db, project, task)\n    if work is None:\n        return None\n\n    _backfill_task_context(db, task, work)\n    transitioned_terminal = False\n    if task.status == "blocked" and work.status in {"active", "blocked"}:\n        work.status = "blocked"\n        work.result_summary = str(task.blocked_reason or "Managed Task is blocked.")[:4000]\n        work.updated_at = utcnow()\n        work.last_milestone_at = work.updated_at\n    elif task.status == "active" and work.status == "blocked":\n        work.status = "active"\n        work.updated_at = utcnow()\n        work.last_milestone_at = work.updated_at\n    elif task.status in {"completed", "cancelled"} and work.status in {"active", "blocked"}:\n        terminal = "completed" if task.status == "completed" else "abandoned"\n        work, _runs = finish_work(\n            db,\n            project,\n            work_key_value=f"W-{work.sequence:04d}",\n            status=terminal,\n            summary=_terminal_summary(task),\n            changed_paths=_changed_paths(task),\n        )\n        transitioned_terminal = True\n\n    if transitioned_terminal:\n        event_type = "WorkCompleted" if work.status == "completed" else "WorkAbandoned"\n        append_contextual_event(\n            db,\n            event_type=event_type,\n            project=project,\n            aggregate_type="work",\n            aggregate_id=str(work.id),\n            work=work,\n            task_id=task.id,\n            payload={\n                "status": work.status,\n                "summary": work.result_summary,\n                "map_status": (work.map_disposition or {}).get("status", "pending"),\n            },\n            importance="high",\n        )\n    db.commit()\n    return work_to_dict(db, work, include_runs=False)\n''', encoding='utf-8')

          # Application Task facade owns the cross-capability orchestration.
          replace_once(
              'src/ai_layer/application/tasks.py',
              'from ai_layer.core.paths import project_state_path\n',
              'from ai_layer.application.managed_work import sync_task_backing_work\nfrom ai_layer.core.paths import project_state_path\n',
          )
          replace_once(
              'src/ai_layer/application/tasks.py',
              '''def _project(db, project_root: str | Path):\n    return get_project(db, project_root)\n\n\n''',
              '''def _project(db, project_root: str | Path):\n    return get_project(db, project_root)\n\n\ndef _with_task_work(db, project, result: dict, *, create_if_missing: bool = False) -> dict:\n    payload = dict(result)\n    work = sync_task_backing_work(\n        db, project, payload, create_if_missing=create_if_missing\n    )\n    if work is not None:\n        payload["work"] = work\n    return payload\n\n\n''',
          )
          replace_once(
              'src/ai_layer/application/tasks.py',
              '''def cancel(project_root: str | Path, *, reason: str) -> dict:\n    with session_scope() as db:\n        return cancel_task(db, _project(db, project_root), reason=reason)\n''',
              '''def cancel(project_root: str | Path, *, reason: str) -> dict:\n    with session_scope() as db:\n        project = _project(db, project_root)\n        result = cancel_task(db, project, reason=reason)\n        return _with_task_work(db, project, result)\n''',
          )
          replace_once(
              'src/ai_layer/application/tasks.py',
              '''def worker_disconnected(project_root: str | Path, *, reason: str) -> dict:\n    with session_scope() as db:\n        return recover_disconnected_worker(db, _project(db, project_root), reason=reason)\n''',
              '''def worker_disconnected(project_root: str | Path, *, reason: str) -> dict:\n    with session_scope() as db:\n        project = _project(db, project_root)\n        result = recover_disconnected_worker(db, project, reason=reason)\n        return _with_task_work(db, project, result)\n''',
          )
          replace_once(
              'src/ai_layer/application/tasks.py',
              '''def resume(project_root: str | Path) -> dict:\n    with session_scope() as db:\n        return resume_task(db, _project(db, project_root))\n\n\ndef create(project_root: str | Path, **kwargs: Any) -> dict:\n    with session_scope() as db:\n        return create_task(db, _project(db, project_root), **kwargs)\n\n\ndef adopt(project_root: str | Path, **kwargs: Any) -> dict:\n    with session_scope() as db:\n        return adopt_task(db, _project(db, project_root), **kwargs)\n''',
              '''def resume(project_root: str | Path) -> dict:\n    with session_scope() as db:\n        project = _project(db, project_root)\n        result = resume_task(db, project)\n        return _with_task_work(db, project, result)\n\n\ndef create(project_root: str | Path, **kwargs: Any) -> dict:\n    with session_scope() as db:\n        project = _project(db, project_root)\n        result = create_task(db, project, **kwargs)\n        return _with_task_work(db, project, result, create_if_missing=True)\n\n\ndef adopt(project_root: str | Path, **kwargs: Any) -> dict:\n    with session_scope() as db:\n        project = _project(db, project_root)\n        result = adopt_task(db, project, **kwargs)\n        return _with_task_work(db, project, result, create_if_missing=True)\n''',
          )
          replace_once(
              'src/ai_layer/application/tasks.py',
              '''def complete_current(project_root: str | Path, **kwargs: Any) -> dict:\n    with session_scope() as db:\n        result = complete_current_stage(db, _project(db, project_root), **kwargs)\n        return _with_project_map_hint(result)\n\n\ndef complete_legacy(project_root: str | Path, **kwargs: Any) -> dict:\n    with session_scope() as db:\n        result = complete_stage(db, _project(db, project_root), **kwargs)\n        return _with_project_map_hint(result)\n''',
              '''def complete_current(project_root: str | Path, **kwargs: Any) -> dict:\n    with session_scope() as db:\n        project = _project(db, project_root)\n        result = complete_current_stage(db, project, **kwargs)\n        return _with_project_map_hint(_with_task_work(db, project, result))\n\n\ndef complete_legacy(project_root: str | Path, **kwargs: Any) -> dict:\n    with session_scope() as db:\n        project = _project(db, project_root)\n        result = complete_stage(db, project, **kwargs)\n        return _with_project_map_hint(_with_task_work(db, project, result))\n''',
          )

          # Contract regressions.
          p = Path('tests/test_agent_facing_contracts.py')
          text = p.read_text(encoding='utf-8').replace('AGENT_RUNTIME_CONTRACT_VERSION == 3', 'AGENT_RUNTIME_CONTRACT_VERSION == 4')
          text = text.replace('result["runtime_contract_version"] == 3', 'result["runtime_contract_version"] == 4')
          text = text.replace(
              '    assert contract_line["work"]["idle_next"] == "work_begin"\n    assert "`work.continuation.kind` is `none`" in bootstrap\n    assert "call `work_begin` before other tools" in bootstrap\n',
              '    assert contract_line["work"]["idle_next"] == "work_begin"\n    route = contract_line["work"]["new_request_routing"]["explicit_managed_task"]\n    assert route["tool"] == "task_create"\n    assert route["backing_work"] == "automatic"\n    assert "`work.continuation.kind` is `none`" in bootstrap\n    assert "`task_create` directly" in bootstrap\n',
          )
          p.write_text(text, encoding='utf-8')

          p = Path('tests/test_work_spine.py')
          text = p.read_text(encoding='utf-8').replace('assert contract["version"] == 3', 'assert contract["version"] == 4')
          text = text.replace(
              '    assert contract["work"]["idle_next"] == "work_begin"\n',
              '    assert contract["work"]["idle_next"] == "work_begin"\n    assert contract["work"]["new_request_routing"]["explicit_managed_task"]["tool"] == "task_create"\n',
              1,
          )
          text = text.replace('    assert "call `work_begin` before other tools" in bootstrap\n', '    assert "`task_create` directly" in bootstrap\n', 1)
          p.write_text(text, encoding='utf-8')

          Path('tests/test_managed_task_work.py').write_text('''from __future__ import annotations\n\nfrom pathlib import Path\nfrom uuid import UUID\n\nfrom sqlalchemy import create_engine, func, select\nfrom sqlalchemy.orm import Session\n\nfrom ai_layer.application.managed_work import sync_task_backing_work\nfrom ai_layer.db.base import Base\nfrom ai_layer.db.models import Project, Task, utcnow\nfrom ai_layer.db.work_models import AgentRun, RuntimeEventContext, WorkItem\nfrom ai_layer.tasks import service as tasks\nfrom ai_layer.work.service import begin_work\n\n\ndef _project(tmp_path: Path):\n    engine = create_engine("sqlite:///:memory:")\n    Base.metadata.create_all(engine)\n    db = Session(engine, expire_on_commit=False)\n    root = tmp_path / "project"\n    root.mkdir()\n    (root / "app.py").write_text("VALUE = 1\\n", encoding="utf-8")\n    project = Project(\n        name="managed-work",\n        root_path=str(root),\n        languages={"python": 1},\n        dependencies={},\n        architecture_summary="",\n    )\n    db.add(project)\n    db.commit()\n    return db, project, root\n\n\ndef test_managed_task_gets_backing_work_without_fake_agent_run(tmp_path: Path):\n    db, project, _root = _project(tmp_path)\n    try:\n        created = tasks.create_task(\n            db, project, goal="Run this through the standard Task protocol", acceptance_criteria=[], constraints=[]\n        )\n        work = sync_task_backing_work(db, project, created, create_if_missing=True)\n        assert work is not None\n        assert work["key"] == "W-0001"\n        assert work["linked_task_id"] == created["id"]\n        assert work["observability_coverage"] == "control_plane_only"\n        assert work["live"] is False\n        assert db.scalar(select(func.count()).select_from(WorkItem)) == 1\n        assert db.scalar(select(func.count()).select_from(AgentRun)) == 0\n\n        contexts = list(\n            db.scalars(\n                select(RuntimeEventContext).where(\n                    RuntimeEventContext.task_id == UUID(created["id"])\n                )\n            ).all()\n        )\n        assert contexts\n        assert all(item.work_id == UUID(work["id"]) for item in contexts)\n    finally:\n        db.close()\n\n\ndef test_task_create_repairs_matching_prior_work_and_terminal_state_closes_it(tmp_path: Path):\n    db, project, root = _project(tmp_path)\n    try:\n        original, _run = begin_work(\n            db, project, goal="Run this through the standard Task protocol"\n        )\n        db.commit()\n        created = tasks.create_task(\n            db, project, goal="Run this through the standard Task protocol", acceptance_criteria=[], constraints=[]\n        )\n        linked = sync_task_backing_work(db, project, created, create_if_missing=True)\n        assert linked is not None\n        assert linked["key"] == f"W-{original.sequence:04d}"\n        assert db.scalar(select(func.count()).select_from(WorkItem)) == 1\n\n        task = db.scalar(select(Task).where(Task.id == UUID(created["id"])))\n        assert task is not None\n        task.status = "completed"\n        task.completion_summary = "Managed protocol completed."\n        task.final_changes = {"modified": ["app.py"]}\n        task.completed_at = utcnow()\n        db.commit()\n\n        completed = sync_task_backing_work(db, project, {"id": created["id"]})\n        assert completed is not None\n        assert completed["status"] == "completed"\n        assert completed["changed_paths"] == ["app.py"]\n        assert completed["map_disposition"]["status"] == "deferred"\n        assert (root / "app.py").exists()\n    finally:\n        db.close()\n''', encoding='utf-8')
