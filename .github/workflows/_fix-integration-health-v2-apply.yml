name: fix-integration-health-v2-apply

on:
  push:
    branches: [ai/integration-health-v2]
    paths: [.github/workflows/_fix-integration-health-v2-apply.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/integration-health-v2
          fetch-depth: 0
      - name: Correct guarded apply semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/_apply-integration-health-v2.yml')
          text = path.read_text(encoding='utf-8')

          old = '''    if project_codex.get(\"present\"):\\n        codex_mcp = bool(project_codex.get(\"ready\"))\\n        codex_mcp_reason = project_codex.get(\"reason\")\\n    else:\\n        codex_mcp = bool(global_state[\"codex\"][\"mcp_ready\"])\\n        codex_mcp_reason = global_state[\"codex\"].get(\"mcp_reason\")\\n'''
          new = '''    if project_codex.get(\"ready\") or project_codex.get(\"reason\") == \"mcp_disabled\":\\n        codex_mcp = bool(project_codex.get(\"ready\"))\\n        codex_mcp_reason = project_codex.get(\"reason\")\\n    else:\\n        codex_mcp = bool(global_state[\"codex\"][\"mcp_ready\"])\\n        codex_mcp_reason = global_state[\"codex\"].get(\"mcp_reason\")\\n'''
          if text.count(old) != 1:
              raise RuntimeError(f'codex fallback fragment count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''    assert state[\"ready\"] is True\\n    assert state[\"configuration_ready\"] is True\\n    assert state[\"ready_semantics\"] == \"configuration\"\\n    assert state[\"operational_status\"] == \"configured_unverified\"\\n    cursor_state = state[\"providers\"][\"cursor\"]\\n'''
          new = '''    assert state[\"ready_semantics\"] == \"configuration\"\\n    cursor_state = state[\"providers\"][\"cursor\"]\\n'''
          if text.count(old) != 1:
              raise RuntimeError(f'top-level fixture assertion fragment count={text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit corrected apply workflow
        run: |
          rm .github/workflows/_fix-integration-health-v2-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/_apply-integration-health-v2.yml .github/workflows/_fix-integration-health-v2-apply.yml
          git commit -m 'Correct integration health guarded apply semantics'
          git push origin HEAD:ai/integration-health-v2
