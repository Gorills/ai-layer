name: prepare-integration-health-v2

on:
  push:
    branches: [ai/integration-health-v2]
    paths: [.github/workflows/_prepare-integration-health-v2.yml]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/integration-health-v2
          fetch-depth: 0
      - name: Disambiguate machine-only doctor fixture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_cli.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('def test_doctor_machine_only_ignores_registered_project_health')
          end = text.index('\ndef test_doctor_machine_only_rejects_project_scope_options', start)
          block = text[start:end]
          old = '''        lambda: {\n            "cursor": {"ready": True},\n            "antigravity": {"ready": True},\n            "codex": {"ready": True},\n        },\n'''
          new = '''        lambda: {\n            "cursor": {"ready": True},\n            "antigravity": {"ready": True},\n            "codex": {"ready": True},\n            "claude-code": {"ready": True, "optional": True},\n        },\n'''
          if block.count(old) != 1:
              raise RuntimeError(f'expected one machine-only fixture, found {block.count(old)}')
          path.write_text(text[:start] + block.replace(old, new, 1) + text[end:], encoding='utf-8')
          PY
      - name: Commit preparation
        run: |
          rm .github/workflows/_prepare-integration-health-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_cli.py .github/workflows/_prepare-integration-health-v2.yml
          git commit -m 'Test optional Claude independently of core readiness'
          git push origin HEAD:ai/integration-health-v2
