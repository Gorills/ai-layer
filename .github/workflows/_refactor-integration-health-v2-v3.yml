name: refactor-integration-health-v2-v3

on:
  push:
    branches: [ai/integration-health-v2]
    paths: [.github/workflows/_refactor-integration-health-v2-v3.yml]

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/integration-health-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Apply corrected extraction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          data = yaml.safe_load(Path('.github/workflows/_refactor-integration-health-v2-v2.yml').read_text(encoding='utf-8'))
          steps = data['jobs']['refactor']['steps']
          script = next(step['run'] for step in steps if step.get('name') == 'Extract cohesive health seams')
          old = '''class CodexStatusPolicy(Protocol):
    toml_start: str
    toml_end: str
'''
          new = '''class CodexStatusPolicy(Protocol):
    @property
    def toml_start(self) -> str: ...

    @property
    def toml_end(self) -> str: ...
'''
          if script.count(old) != 1:
              raise RuntimeError(f'protocol fragment count={script.count(old)}')
          Path('/tmp/extract-health.sh').write_text(script.replace(old, new, 1), encoding='utf-8')
          PY
          bash /tmp/extract-health.sh
      - name: Validate extracted seams
        shell: bash
        run: |
          ruff check --fix src/ai_layer/integrations/status.py src/ai_layer/integrations/health_contract.py src/ai_layer/integrations/codex_status.py
          ruff format src/ai_layer/integrations/status.py src/ai_layer/integrations/health_contract.py src/ai_layer/integrations/codex_status.py
          ruff check src/ai_layer/integrations/status.py src/ai_layer/integrations/health_contract.py src/ai_layer/integrations/codex_status.py
          mypy src/ai_layer
          python scripts/architecture_gate.py --json
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest tests/test_integrations.py tests/test_cli.py
      - name: Refresh deterministic wheel and manifest
        shell: bash
        run: |
          python scripts/build_release_wheel.py
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest_path = Path('release/release-manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          wheel = Path(manifest['application_wheel'])
          manifest['application_wheel_sha256'] = hashlib.sha256(wheel.read_bytes()).hexdigest()
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          print(manifest['application_wheel_sha256'])
          PY
      - name: Commit architecture refactor
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ai_layer/integrations/status.py src/ai_layer/integrations/health_contract.py src/ai_layer/integrations/codex_status.py dist/local_ai_development_layer-0.14.0-py3-none-any.whl release/release-manifest.json
          git commit -m 'Extract integration health status seams'
          git push origin HEAD:ai/integration-health-v2
