name: temporary Cursor field-acceptance repair

on:
  push:
    branches: [fix/cursor-natural-work-closure]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cursor-natural-work-closure
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Apply guarded field-acceptance patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one guarded fragment, found {count}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'src/ai_layer/mcp/tool_schema.py',
              'from pydantic import BaseModel, ConfigDict, Field\n',
              'from pydantic import BaseModel, ConfigDict, Field, model_validator\n',
          )
          replace_once(
              'src/ai_layer/mcp/tool_schema.py',
              'WorkCheckStatus = Literal["passed", "failed", "skipped", "blocked", "not_run"]\n',
              'WorkCheckStatus = Literal["passed", "failed", "skipped", "blocked", "not_run", "reported"]\n',
          )
          replace_once(
              'src/ai_layer/mcp/tool_schema.py',
              '''class WorkCheckInput(BaseModel):\n    model_config = ConfigDict(extra="forbid")\n\n    name: Annotated[str, Field(min_length=1, max_length=240)]\n    status: WorkCheckStatus\n    summary: Annotated[str, Field(max_length=500)] = ""\n''',
              '''def _natural_check_status(\n    value: object, *, result: object, summary: str, command: str | None\n) -> WorkCheckStatus:\n    rendered = str(value or "").strip().casefold().replace("-", "_").replace(" ", "_")\n    aliases: dict[str, WorkCheckStatus] = {\n        "pass": "passed",\n        "passed": "passed",\n        "success": "passed",\n        "succeeded": "passed",\n        "ok": "passed",\n        "fail": "failed",\n        "failed": "failed",\n        "failure": "failed",\n        "error": "failed",\n        "skipped": "skipped",\n        "skip": "skipped",\n        "blocked": "blocked",\n        "not_run": "not_run",\n        "reported": "reported",\n    }\n    if rendered:\n        return aliases.get(rendered, "reported")\n    if isinstance(result, bool):\n        return "passed" if result else "failed"\n    if isinstance(result, int):\n        return "passed" if result == 0 else "failed"\n    evidence = " ".join(str(result if result is not None else summary).strip().casefold().split())\n    if not evidence:\n        return "reported" if command else "not_run"\n    if any(marker in evidence for marker in ("not run", "not executed", "not checked")):\n        return "not_run"\n    if "blocked" in evidence:\n        return "blocked"\n    if "skipped" in evidence:\n        return "skipped"\n    if any(\n        marker in evidence\n        for marker in ("no errors", "no error", "no failures", "passed", "success", "succeeded")\n    ):\n        return "passed"\n    if any(marker in evidence for marker in ("failed", "failure", " error", "errors")):\n        return "failed"\n    return "reported"\n\n\nclass WorkCheckInput(BaseModel):\n    model_config = ConfigDict(extra="forbid")\n\n    name: Annotated[str, Field(max_length=240)] | None = None\n    status: Annotated[str, Field(max_length=32)] | None = None\n    summary: Annotated[str, Field(max_length=500)] = ""\n    command: Annotated[str | None, Field(max_length=2000, exclude=True)] = None\n    result: Annotated[str | bool | int | None, Field(exclude=True)] = None\n\n    @model_validator(mode="after")\n    def normalize_natural_report(self) -> "WorkCheckInput":\n        self.name = str(self.name or "").strip() or "reported check"\n        if not self.summary and self.result is not None:\n            self.summary = str(self.result).strip()[:500]\n        self.status = _natural_check_status(\n            self.status, result=self.result, summary=self.summary, command=self.command\n        )\n        return self\n''',
          )

          replace_once(
              'src/ai_layer/work/evidence.py',
              'WORK_CHECK_STATUSES = frozenset({"passed", "failed", "skipped", "blocked", "not_run"})\n',
              'WORK_CHECK_STATUSES = frozenset({"passed", "failed", "skipped", "blocked", "not_run", "reported"})\n',
          )

          replace_once(
              'src/ai_layer/mcp/tools/work.py',
              '    WorkSummaryOptional,\n    WorkSummaryText,\n',
              '    WorkSummaryOptional,\n',
          )
          replace_once(
              'src/ai_layer/mcp/tools/work.py',
              '    summary = _text(summary, tool=operation, field="summary")\n',
              '    summary = (summary or "").strip()\n',
          )
          text_path = Path('src/ai_layer/mcp/tools/work.py')
          text = text_path.read_text(encoding='utf-8')
          old = '    summary: WorkSummaryText,\n'
          count = text.count(old)
          if count != 4:
              raise SystemExit(f'src/ai_layer/mcp/tools/work.py: expected four terminal summary annotations, found {count}')
          text = text.replace(old, '    summary: WorkSummaryOptional = "",\n')
          text_path.write_text(text, encoding='utf-8')
          replace_once(
              'src/ai_layer/mcp/tools/work.py',
              '''    """WHEN: substantive work reached a terminal successful result. Report only observed paths and bounded check/delta metadata; never raw commands, output, or source. A work-linked project_map_reconcile already persists reconciled map_disposition; omit it here to keep that value. Do not synthesize reconciliation event IDs. If no reconciliation was recorded and map state is still pending, terminal closure records a truthful deferred disposition automatically instead of requiring ceremony from the agent."""\n''',
              '''    """WHEN: substantive work reached a terminal successful result. summary is optional: when omitted AI Layer reuses an existing Work summary or derives a truthful terminal summary from the known goal. checks may use canonical name/status/summary or a natural command/result report; raw command/result fields are normalized and are not persisted. A work-linked project_map_reconcile already persists reconciled map_disposition; omit it here to keep that value. If no reconciliation was recorded and map state is still pending, terminal closure records a truthful deferred disposition automatically."""\n''',
          )

          replace_once(
              'src/ai_layer/work/service.py',
              '''    normalized_summary = safe_metadata_text(\n        summary, field="summary", max_chars=WORK_SUMMARY_MAX_CHARS, required=True\n    )\n''',
              '''    reported_summary = str(summary or "").strip() or str(work.result_summary or "").strip()\n    if not reported_summary:\n        reported_summary = f"{terminal.capitalize()} work: {work.goal}"\n    normalized_summary = safe_metadata_text(\n        reported_summary, field="summary", max_chars=WORK_SUMMARY_MAX_CHARS, required=True\n    )\n''',
          )

          replace_once(
              'src/ai_layer/memory/project_map_semantics.py',
              '''def _persist_work_map_disposition(\n    work: WorkItem, *, event_id: str, scope: list[str], reason: str\n) -> dict:\n''',
              '''def _work_for_task(\n    db: Session, project: Project, task: Task, *, lock: bool = False\n) -> WorkItem | None:\n    stmt = (\n        select(WorkItem)\n        .where(WorkItem.project_id == project.id, WorkItem.linked_task_id == task.id)\n        .order_by(WorkItem.updated_at.desc(), WorkItem.sequence.desc())\n        .limit(1)\n    )\n    if lock:\n        stmt = stmt.with_for_update()\n    return db.scalar(stmt)\n\n\ndef _task_changed_paths(task: Task) -> list[str]:\n    changes = dict(task.final_changes or {})\n    paths: list[str] = []\n    for field in ("added", "modified", "deleted", "renamed", "untracked"):\n        value = changes.get(field)\n        if isinstance(value, list):\n            paths.extend(str(item) for item in value if isinstance(item, str) and item)\n    return list(dict.fromkeys(paths))\n\n\ndef _persist_work_map_disposition(\n    work: WorkItem, *, event_id: str, scope: list[str], reason: str\n) -> dict:\n''',
          )
          replace_once(
              'src/ai_layer/memory/project_map_semantics.py',
              '''    task, task_source_ref = _task_for_key(db, project, source_task_key)\n    work = _work_for_key(db, project, source_work_key, lock=True)\n    if not scope and work is not None:\n        scope = list(\n            dict.fromkeys(\n                [\n                    *list(work.reviewed_paths or []),\n                    *list(work.changed_paths or []),\n                ]\n            )\n        )\n''',
              '''    task, task_source_ref = _task_for_key(db, project, source_task_key)\n    work = _work_for_key(db, project, source_work_key, lock=True)\n    if task is not None and work is None:\n        work = _work_for_task(db, project, task, lock=True)\n    if not scope and work is not None:\n        scope = list(\n            dict.fromkeys(\n                [\n                    *list(work.reviewed_paths or []),\n                    *list(work.changed_paths or []),\n                ]\n            )\n        )\n    if not scope and task is not None:\n        scope = _task_changed_paths(task)\n''',
          )

          replace_once(
              'src/ai_layer/mcp/tools/project_context.py',
              '''Pass source_work_key for ordinary Work closure or source_task_key for managed/Epic closure, never both. For source_work_key, scope_paths may be omitted when Work already records reviewed/changed paths; AI Layer derives that checked scope.''',
              '''Pass source_work_key for ordinary Work closure or source_task_key for managed/Epic closure, never both. scope_paths may be omitted when linked Work already records reviewed/changed paths; for a completed Task AI Layer can also derive scope from its backing Work or final changes.''',
          )

          Path('tests/test_cursor_field_acceptance.py').write_text('''from __future__ import annotations\n\nfrom sqlalchemy import create_engine\nfrom sqlalchemy.orm import Session\n\nfrom ai_layer.core.jsonutil import wire_value\nfrom ai_layer.db.base import Base\nfrom ai_layer.db.models import Project, Task\nfrom ai_layer.mcp.tool_schema import WorkCheckInput\nfrom ai_layer.memory.project_map_semantics import reconcile_project_map\nfrom ai_layer.work.service import begin_work, finish_work\n\n\ndef _project(db: Session, root: str = "/tmp/cursor-field-acceptance") -> Project:\n    project = Project(\n        name="cursor-field-acceptance",\n        root_path=root,\n        languages={"typescript": 1},\n        dependencies={},\n        architecture_summary="",\n    )\n    db.add(project)\n    db.flush()\n    return project\n\n\ndef test_natural_cursor_check_report_normalizes_before_durable_work_evidence() -> None:\n    schema = WorkCheckInput.model_json_schema()\n    assert {"command", "result"} <= set(schema["properties"])\n    assert "name" not in schema.get("required", [])\n    assert "status" not in schema.get("required", [])\n\n    check = WorkCheckInput(\n        command="npx tsc --noEmit (mobile)",\n        result="pre-existing errors elsewhere, no errors in changed files",\n    )\n    assert wire_value([check]) == [\n        {\n            "name": "reported check",\n            "status": "passed",\n            "summary": "pre-existing errors elsewhere, no errors in changed files",\n        }\n    ]\n\n\ndef test_terminal_work_derives_summary_when_cursor_omits_it() -> None:\n    engine = create_engine("sqlite:///:memory:")\n    Base.metadata.create_all(engine)\n    with Session(engine, expire_on_commit=False) as db:\n        project = _project(db)\n        _work, _run = begin_work(db, project, goal="Fix mobile TypeScript errors")\n        completed, _runs = finish_work(\n            db,\n            project,\n            work_key_value="W-0001",\n            status="completed",\n            summary="",\n            changed_paths=["mobile/src/app.ts"],\n        )\n        assert completed.status == "completed"\n        assert completed.result_summary == "Completed work: Fix mobile TypeScript errors"\n\n\ndef test_task_linked_reconcile_derives_scope_from_backing_work() -> None:\n    engine = create_engine("sqlite:///:memory:")\n    Base.metadata.create_all(engine)\n    with Session(engine, expire_on_commit=False) as db:\n        project = _project(db, "/tmp/cursor-task-map")\n        task = Task(\n            project_id=project.id,\n            sequence=1,\n            goal="Fix mobile TypeScript errors",\n            acceptance_criteria=[],\n            constraints=[],\n            status="completed",\n            final_changes={"modified": ["mobile/src/app.ts"]},\n        )\n        db.add(task)\n        db.flush()\n        work, _run = begin_work(\n            db,\n            project,\n            goal=task.goal,\n            linked_task_key="T-0001",\n        )\n        work.reviewed_paths = ["mobile/src/app.ts"]\n        work.changed_paths = ["mobile/src/app.ts"]\n        db.flush()\n\n        result = reconcile_project_map(\n            db,\n            project,\n            entries=None,\n            remove_paths=None,\n            scope_paths=None,\n            source_task_key="T-0001",\n            source_work_key=None,\n            no_changes_reason="Existing navigation facts remain accurate.",\n        )\n        assert result["source_ref"] == "T-0001"\n        assert result["scope_paths"] == ["mobile/src/app.ts"]\n        assert result["map_disposition"]["status"] == "reconciled"\n        assert work.map_disposition["scope"] == ["mobile/src/app.ts"]\n\n\ndef test_task_linked_reconcile_falls_back_to_known_final_changes_without_work() -> None:\n    engine = create_engine("sqlite:///:memory:")\n    Base.metadata.create_all(engine)\n    with Session(engine, expire_on_commit=False) as db:\n        project = _project(db, "/tmp/cursor-task-map-fallback")\n        db.add(\n            Task(\n                project_id=project.id,\n                sequence=1,\n                goal="Fix mobile TypeScript errors",\n                acceptance_criteria=[],\n                constraints=[],\n                status="completed",\n                final_changes={"modified": ["mobile/src/app.ts"]},\n            )\n        )\n        db.flush()\n\n        result = reconcile_project_map(\n            db,\n            project,\n            entries=None,\n            remove_paths=None,\n            scope_paths=None,\n            source_task_key="T-0001",\n            source_work_key=None,\n            no_changes_reason="Existing navigation facts remain accurate.",\n        )\n        assert result["scope_paths"] == ["mobile/src/app.ts"]\n''', encoding='utf-8')
          PY
      - name: Format touched Python files
        run: |
          ruff format src/ai_layer/mcp/tool_schema.py src/ai_layer/mcp/tools/work.py src/ai_layer/work/evidence.py src/ai_layer/work/service.py src/ai_layer/memory/project_map_semantics.py src/ai_layer/mcp/tools/project_context.py tests/test_cursor_field_acceptance.py
          ruff check --fix src/ai_layer/mcp/tool_schema.py src/ai_layer/mcp/tools/work.py src/ai_layer/work/evidence.py src/ai_layer/work/service.py src/ai_layer/memory/project_map_semantics.py src/ai_layer/mcp/tools/project_context.py tests/test_cursor_field_acceptance.py
      - name: Validate focused semantics
        run: |
          mypy src/ai_layer
          python scripts/architecture_gate.py
          python -m pytest tests/test_cursor_field_acceptance.py tests/test_work_spine.py tests/test_project_map_semantics.py
      - name: Rebuild deterministic wheel and manifest
        run: |
          python scripts/build_release_wheel.py
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest_path = Path('release/release-manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          wheel = Path(manifest['application_wheel'])
          manifest['application_wheel_sha256'] = hashlib.sha256(wheel.read_bytes()).hexdigest()
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python scripts/build_release_archive.py --output dist/ai-layer-release.zip
      - name: Full quality gate
        run: make quality
      - name: Commit validated result
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ai_layer/mcp/tool_schema.py src/ai_layer/mcp/tools/work.py src/ai_layer/work/evidence.py src/ai_layer/work/service.py src/ai_layer/memory/project_map_semantics.py src/ai_layer/mcp/tools/project_context.py tests/test_cursor_field_acceptance.py release/release-manifest.json dist/local_ai_development_layer-0.14.0-py3-none-any.whl dist/ai-layer-release.zip
          git commit -m 'Make Work closure natural for weak hosts'
          git push origin HEAD:fix/cursor-natural-work-closure
