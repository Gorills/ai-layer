name: temporary Cursor field-acceptance repair v4

on:
  push:
    branches: [fix/cursor-natural-work-closure]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cursor-natural-work-closure
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Apply guarded self-review refinements
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one guarded fragment, found {count}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'src/ai_layer/mcp/tool_schema.py',
              '''def _natural_check_status(\n    value: object, *, result: object, summary: str, command: str | None\n) -> WorkCheckStatus:\n    rendered = str(value or "").strip().casefold().replace("-", "_").replace(" ", "_")\n    aliases: dict[str, WorkCheckStatus] = {\n        "pass": "passed",\n        "passed": "passed",\n        "success": "passed",\n        "succeeded": "passed",\n        "ok": "passed",\n        "fail": "failed",\n        "failed": "failed",\n        "failure": "failed",\n        "error": "failed",\n        "skipped": "skipped",\n        "skip": "skipped",\n        "blocked": "blocked",\n        "not_run": "not_run",\n        "reported": "reported",\n    }\n    if rendered:\n        return aliases.get(rendered, "reported")\n    if isinstance(result, bool):\n        return "passed" if result else "failed"\n    if isinstance(result, int):\n        return "passed" if result == 0 else "failed"\n    evidence = " ".join(str(result if result is not None else summary).strip().casefold().split())\n    if not evidence:\n        return "reported" if command else "not_run"\n    if any(marker in evidence for marker in ("not run", "not executed", "not checked")):\n        return "not_run"\n    if "blocked" in evidence:\n        return "blocked"\n    if "skipped" in evidence:\n        return "skipped"\n    if any(\n        marker in evidence\n        for marker in ("no errors", "no error", "no failures", "passed", "success", "succeeded")\n    ):\n        return "passed"\n    if any(marker in evidence for marker in ("failed", "failure", " error", "errors")):\n        return "failed"\n    return "reported"\n''',
              '''def _natural_check_status(\n    value: WorkCheckStatus | None, *, result: object, summary: str, command: str | None\n) -> WorkCheckStatus:\n    if value is not None:\n        return value\n    if isinstance(result, bool):\n        return "passed" if result else "failed"\n    if isinstance(result, int):\n        return "passed" if result == 0 else "failed"\n    if result is not None or summary.strip() or command:\n        return "reported"\n    return "not_run"\n''',
          )
          replace_once(
              'src/ai_layer/mcp/tool_schema.py',
              '    result: Annotated[str | bool | int | None, Field(exclude=True)] = None\n',
              '''    result: Annotated[\n        Annotated[str, Field(max_length=4000)] | bool | int | None,\n        Field(exclude=True),\n    ] = None\n''',
          )

          work_path = Path('src/ai_layer/mcp/tools/work.py')
          work = work_path.read_text(encoding='utf-8')
          import_old = '    WorkSummaryOptional,\n)\n'
          import_new = '    WorkSummaryOptional,\n    WorkSummaryText,\n)\n'
          if work.count(import_old) != 1:
              raise SystemExit(f'work.py: expected one WorkSummaryOptional import tail, found {work.count(import_old)}')
          work = work.replace(import_old, import_new)
          for func in ('work_fail', 'work_interrupt', 'work_abandon'):
              old = f'def {func}(\n    work_key: WorkKeyText,\n    summary: WorkSummaryOptional = "",\n'
              new = f'def {func}(\n    work_key: WorkKeyText,\n    summary: WorkSummaryText,\n'
              if work.count(old) != 1:
                  raise SystemExit(f'work.py: expected one {func} optional-summary signature, found {work.count(old)}')
              work = work.replace(old, new)
          work_path.write_text(work, encoding='utf-8')

          test_path = Path('tests/test_cursor_field_acceptance.py')
          test = test_path.read_text(encoding='utf-8')
          old_assert = '''    assert "status" not in schema.get("required", [])\n\n    check = WorkCheckInput(\n'''
          new_assert = '''    assert "status" not in schema.get("required", [])\n    result_schema = schema["properties"]["result"]\n    assert any(item.get("maxLength") == 4000 for item in result_schema.get("anyOf", []))\n\n    check = WorkCheckInput(\n'''
          if test.count(old_assert) != 1:
              raise SystemExit('test: expected one schema assertion insertion point')
          test = test.replace(old_assert, new_assert)
          old_status = '            "status": "passed",\n            "summary": "pre-existing errors elsewhere, no errors in changed files",\n'
          new_status = '            "status": "reported",\n            "summary": "pre-existing errors elsewhere, no errors in changed files",\n'
          if test.count(old_status) != 1:
              raise SystemExit('test: expected one natural-result passed assertion')
          test = test.replace(old_status, new_status)
          test += '''\n\ndef test_natural_check_uses_explicit_machine_status_when_available() -> None:\n    assert WorkCheckInput(command="npx tsc --noEmit", result=0).status == "passed"\n    assert WorkCheckInput(command="npx tsc --noEmit", result=2).status == "failed"\n    assert WorkCheckInput(name="lint", status="failed", summary="lint failed").status == "failed"\n'''
          test_path.write_text(test, encoding='utf-8')
          PY
      - name: Format touched Python files
        run: |
          ruff format src/ai_layer/mcp/tool_schema.py src/ai_layer/mcp/tools/work.py tests/test_cursor_field_acceptance.py
          ruff check --fix src/ai_layer/mcp/tool_schema.py src/ai_layer/mcp/tools/work.py tests/test_cursor_field_acceptance.py
      - name: Validate focused semantics and schema hygiene
        run: |
          mypy src/ai_layer
          python scripts/architecture_gate.py
          python -m pytest tests/test_cursor_field_acceptance.py tests/test_work_spine.py tests/test_project_map_semantics.py tests/test_schema_hygiene.py
      - name: Rebuild deterministic 0.14.0 artifacts
        run: |
          python scripts/build_release_wheel.py
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest_path = Path('release/release-manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          wheel = Path(manifest['application_wheel'])
          manifest['application_wheel_sha256'] = hashlib.sha256(wheel.read_bytes()).hexdigest()
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python scripts/build_release_archive.py --output dist/ai-layer-release.zip
      - name: Full quality gate
        run: make quality
      - name: Commit validated refinement
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ai_layer/mcp/tool_schema.py src/ai_layer/mcp/tools/work.py tests/test_cursor_field_acceptance.py release/release-manifest.json dist/local_ai_development_layer-0.14.0-py3-none-any.whl dist/ai-layer-release.zip
          git commit -m 'Keep natural Work closure evidence truthful'
          git push origin HEAD:fix/cursor-natural-work-closure
