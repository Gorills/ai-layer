name: temporary Cursor field-acceptance repair v5

on:
  push:
    branches: [fix/cursor-natural-work-closure]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cursor-natural-work-closure
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Apply guarded terminal-summary refinement
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one guarded fragment, found {count}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'src/ai_layer/work/service.py',
              '''    reported_summary = str(summary or "").strip() or str(work.result_summary or "").strip()\n    if not reported_summary:\n        reported_summary = f"{terminal.capitalize()} work: {work.goal}"\n''',
              '''    reported_summary = str(summary or "").strip()\n    if terminal == "completed" and not reported_summary:\n        reported_summary = (\n            str(work.result_summary or "").strip() or f"Completed work: {work.goal}"\n        )\n''',
          )

          test_path = Path('tests/test_cursor_field_acceptance.py')
          test = test_path.read_text(encoding='utf-8')
          if 'import pytest\n' not in test:
              test = test.replace('from __future__ import annotations\n\n', 'from __future__ import annotations\n\nimport pytest\n\n', 1)
          test += '''\n\ndef test_non_success_terminal_reason_remains_new_agent_fact() -> None:\n    engine = create_engine("sqlite:///:memory:")\n    Base.metadata.create_all(engine)\n    with Session(engine, expire_on_commit=False) as db:\n        project = _project(db, "/tmp/cursor-terminal-reason")\n        begin_work(db, project, goal="Investigate mobile TypeScript errors")\n        with pytest.raises(ValueError, match="summary"):\n            finish_work(\n                db,\n                project,\n                work_key_value="W-0001",\n                status="failed",\n                summary="",\n            )\n'''
          test_path.write_text(test, encoding='utf-8')
          PY
      - name: Format touched files
        run: |
          ruff format src/ai_layer/work/service.py tests/test_cursor_field_acceptance.py
          ruff check --fix src/ai_layer/work/service.py tests/test_cursor_field_acceptance.py
      - name: Validate focused semantics
        run: |
          mypy src/ai_layer
          python scripts/architecture_gate.py
          python -m pytest tests/test_cursor_field_acceptance.py tests/test_work_spine.py tests/test_project_map_semantics.py tests/test_schema_hygiene.py
      - name: Rebuild deterministic 0.14.0 artifacts
        run: |
          python scripts/build_release_wheel.py
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest_path = Path('release/release-manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          wheel = Path(manifest['application_wheel'])
          manifest['application_wheel_sha256'] = hashlib.sha256(wheel.read_bytes()).hexdigest()
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python scripts/build_release_archive.py --output dist/ai-layer-release.zip
      - name: Full quality gate
        run: make quality
      - name: Commit validated refinement
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ai_layer/work/service.py tests/test_cursor_field_acceptance.py release/release-manifest.json dist/local_ai_development_layer-0.14.0-py3-none-any.whl dist/ai-layer-release.zip
          git commit -m 'Require explicit non-success Work reasons'
          git push origin HEAD:fix/cursor-natural-work-closure
