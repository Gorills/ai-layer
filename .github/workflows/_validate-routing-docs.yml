name: validate-routing-docs
on:
  push:
    branches: [docs/align-managed-task-routing]
    paths: [.github/workflows/_validate-routing-docs.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16@sha256:a132765ec351c65111b5b675928a3a0515a466a40f97277329db8b8209ad8bc9
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_layer_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AI_LAYER_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/ai_layer_gate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/align-managed-task-routing
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Align active routing docs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one fragment, found {count}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'README.md',
              '''1. call `project_status(project_root=<workspace root>)` and apply its bounded `project_policy`;\n2. use `work.current_focus` / `work.continuation` to resume observed ordinary Work or managed Task/Epic state;\n3. for a new substantive ordinary request call `work_begin`; short work normally needs only one terminal Work call after execution;\n4. if a precise file or symbol is already known, inspect current source directly with host-native tools;\n5. if code location is unknown, use `project_search` with a concise English code-centric primary query for non-English intent, preserving exact repository identifiers and optionally one original/mixed widening variant;\n6. use `knowledge_search` and `decision_search` only when durable facts or prior decisions materially help the task;\n7. execute normally through the host runtime;\n8. use `task_next` / `epic_next` only when resuming or explicitly choosing a managed assurance workflow;\n9. reconcile Project Map only for navigation facts actually established from inspected/affected scope.\n''',
              '''1. call `project_status(project_root=<workspace root>)` and apply its bounded `project_policy`;\n2. use `work.current_focus` / `work.continuation` to resume existing ordinary Work or managed Task/Epic state before creating anything new;\n3. with no durable focus, if the user explicitly asks for a managed Task or the standard Task protocol, call `task_create` directly; AI Layer creates or links the backing Work automatically;\n4. otherwise, for a new substantive ordinary request call `work_begin`; short work normally needs only one terminal Work call after execution;\n5. if a precise file or symbol is already known, inspect current source directly with host-native tools;\n6. if code location is unknown, use `project_search` with a concise English code-centric primary query for non-English intent, preserving exact repository identifiers and optionally one original/mixed widening variant;\n7. use `knowledge_search` and `decision_search` only when durable facts or prior decisions materially help the task;\n8. execute normally through the host runtime;\n9. inside an existing managed Task/Epic, follow `task_next` / `epic_next`; a new explicit managed Task starts with `task_create`, not a preliminary `work_begin`;\n10. reconcile Project Map only for navigation facts actually established from inspected/affected scope.\n''',
          )
          replace_once(
              'README.md',
              '''Inside an active managed Task, `task_next` remains the authoritative navigator. Existing provenance, worker leases, read-only review/discovery, adoption, review sandboxes, findings, remediation caps and verification mechanisms are preserved.\n''',
              '''A new explicit managed Task starts with `task_create` directly. The application layer creates, reuses or links its backing Work automatically and can repair a missing Task↔Work link on subsequent managed Task operations; the agent does not perform that bookkeeping. Inside an active managed Task, `task_next` remains the authoritative navigator. Existing provenance, worker leases, read-only review/discovery, adoption, review sandboxes, findings, remediation caps and verification mechanisms are preserved.\n''',
          )
          replace_once(
              'CURRENT_STATE.md',
              '''- idle ordinary continuation names `work_begin` as `next_action.tool` (with kinds and a tiny-Q&A `skip_when`) without reprinting the runtime procedure;\n''',
              '''- idle ordinary continuation keeps `work_begin` as the compatibility `next_action.tool`, but also carries an explicit managed-Task route to `task_create` when the user asked for a managed Task or standard Task protocol;\n''',
          )
          replace_once(
              'CURRENT_STATE.md',
              '''It does not re-send the runtime procedure, Project Map capability essay, idle `latest_task`, or open Epic lists. Native bootstrap owns ordinary procedure; MCP initialize instructions are the compact fallback when that bootstrap is missing. MCP payloads declare `envelope` `ordinary` | `managed_next` | `worker` and do not reprint that procedure. Short ordinary work should normally use `work_begin` plus exactly one terminal Work call. `work_checkpoint` is reserved for meaningful milestones or blockers, not every file/tool action. Existing managed Task/Epic flows remain available when strict assurance is explicitly useful. Idle `task_next`/`task_current` return compact `host_native` next_action without a full `agent_contract` or latest-Task dump. `task_next`/`epic_next` attach live `next_action` as managed_next; the Project Map capability contract is attached only when reconciling.\n''',
              '''It does not re-send the runtime procedure, Project Map capability essay, idle `latest_task`, or open Epic lists. Native bootstrap owns ordinary procedure; MCP initialize instructions are the compact fallback when that bootstrap is missing. MCP payloads declare `envelope` `ordinary` | `managed_next` | `worker` and do not reprint that procedure. With no durable focus, explicit managed Task / standard Task protocol intent goes directly to `task_create`; AI Layer creates or links backing Work automatically, so no preliminary `work_begin` bookkeeping is required. Other substantive work uses `work_begin` plus exactly one terminal Work call. `work_checkpoint` is reserved for meaningful milestones or blockers, not every file/tool action. Idle `task_next`/`task_current` return compact `host_native` next_action without a full `agent_contract` or latest-Task dump. Active managed Task/Epic flows resume through `task_next` / `epic_next`; those navigators attach live `next_action` as managed_next. The Project Map capability contract is attached only when reconciling.\n''',
          )
          replace_once(
              'CURRENT_STATE.md',
              '''Agent-facing semantics remain governed by the versioned live runtime contract rather than stale historical workflow prose. MCP envelope delivery (runtime contract v3) is implemented in this checkout and does not constitute a separate 0.15 product release.\n''',
              '''Agent-facing semantics remain governed by the versioned live runtime contract rather than stale historical workflow prose. MCP envelope delivery and explicit managed-Task idle routing (runtime contract v4) are implemented in this checkout and do not constitute a separate 0.15 product release.\n''',
          )
          PY
          git diff --check
          git diff -- README.md CURRENT_STATE.md
      - name: Full repository gates
        shell: bash
        run: |
          make quality
          make postgres-gate
      - name: Commit validated docs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CURRENT_STATE.md
          git commit -m 'Align active docs with managed Task routing'
          git push origin HEAD:docs/align-managed-task-routing