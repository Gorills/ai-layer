name: agent-contract-audit-edit

on:
  push:
    branches:
      - audit/agent-facing-contracts
    paths:
      - .github/workflows/agent-contract-audit-edit.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/agent-facing-contracts
      - name: Apply agent-facing contract fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"missing expected fragment in {path}: {old[:120]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace(
              "src/ai_layer/mcp/tools/tasks.py",
              '"""WHEN: recover/inspect the durable task position after restart, context loss, or before delegation. INPUT: optional project_root. RETURNS the one open task and exact next sequential stage, or create_task guidance. Does not mutate repository or task state."""',
              '"""WHEN: project_status shows an active managed Task, or explicit managed Task state inspection is needed. INPUT: optional project_root. RETURNS the one open managed Task and exact next stage; if none is active, returns host-native idle guidance plus task_create as an optional managed-work choice. Does not mutate repository or task state."""',
          )
          replace(
              "src/ai_layer/mcp/tools/tasks.py",
              '"""PRIMARY WORKFLOW NAVIGATOR. WHEN: after memory_context, after every task transition, after a worker returns, or after context loss. RETURNS exactly one next allowed action, forbidden actions, and the stage-specific tool/schema when applicable. Do not infer the next step from chat history."""',
              '"""PRIMARY MANAGED TASK NAVIGATOR. WHEN: project_status reports an active/selected managed Task, after each managed Task transition, after its worker returns, or after context loss inside that Task. RETURNS the exact managed next action and stage contract. If no managed Task is active, ordinary host-native work remains allowed and task_create is optional; do not create a Task merely to authorize edits."""',
          )
          replace(
              "src/ai_layer/mcp/tools/tasks.py",
              '"""WHEN: no active task exists. INPUT: goal plus compact acceptance_criteria/constraints; normally keep workflow=auto, risk=auto, complexity=auto, uncertainty=auto, cost_policy=auto so machine policy decides the tier budget. Dirty worktrees are valid: AI Layer captures the exact current repository state as the immutable task baseline and preserves pre-existing changes separately from the later managed delta. AI Layer classifies MICRO/STANDARD/DISCOVERY_FIRST/ANALYSIS_ONLY and returns one next action plus requested subagent tier/profile. MICRO auto-escalates when its actual diff cannot remain inside the proven low-risk envelope."""',
              '"""WHEN: no managed Task is active and the user/agent explicitly chooses durable or strict managed execution. This tool is NOT required before ordinary host-native edits. INPUT: goal plus compact acceptance_criteria/constraints; normally keep workflow/risk/complexity/uncertainty/cost_policy=auto. Dirty worktrees are valid: AI Layer captures the exact current repository state as the immutable Task baseline and preserves pre-existing changes separately from the later managed delta. AI Layer classifies MICRO/STANDARD/DISCOVERY_FIRST/ANALYSIS_ONLY and returns the live managed next action."""',
          )

          replace(
              "src/ai_layer/mcp/tools/skills.py",
              '"""WHEN: diagnostics or explicit manual skill discovery only. INPUT: optional project_root. Normal Cursor/Codex/Antigravity tasks rely on host-native Agent Skills discovery, not memory_context routing."""',
              '"""WHEN: diagnostics or explicit manual skill discovery only. INPUT: optional project_root. Normal Cursor/Codex/Claude Code/Antigravity tasks rely on host-native Agent Skills discovery; AI Layer does not route skills through memory_context."""',
          )
          replace(
              "src/ai_layer/mcp/tools/skills.py",
              '"""WHEN: explicit/manual selective reread, mandatory workflow core, package/diagnostic retrieval, or when a named skill cannot be consumed through native activation. INPUT: slug required; section optional (`core`, exact `##` heading, or `full`). Native activation already carries the complete professional skill; prefer one exact section for focused rereads."""',
              '"""WHEN: explicit/manual reread, package/diagnostic retrieval, or when a named skill cannot be consumed through host-native activation. INPUT: slug required; section optional (`core`, exact `##` heading, or `full`). Normal relevance selection belongs to the host-native skill system; do not use skill_get to preload unrelated skills."""',
          )

          replace(
              "src/ai_layer/mcp/tools/epics.py",
              '"""PRIMARY EPIC NAVIGATOR. Call when the user intentionally works on this Epic, after Epic metadata transitions, after linked Task completion, and after context loss. DRAFT/APPROVED Epics do not pre-empt unrelated Task work. During execution, accepted standalone Tasks may pause the Epic and trigger a narrow impact review rather than automatic full drift reconciliation."""',
              '"""PRIMARY EPIC NAVIGATOR. Call when project_status shows this executing Epic, when the user explicitly selects/resumes it, after Epic transitions or linked Task completion, and after context loss. Its live next_action plus current agent/Project Map contracts define present procedure even for Epics created by older releases; stored historical prose must not override them. DRAFT/APPROVED Epics remain passive."""',
          )
          replace(
              "src/ai_layer/mcp/tools/epics.py",
              '"""WHEN: epic_next says create_task_plan after successful Phase 0. INPUT only implementation work items. AI Layer automatically preserves Phase 0 and appends the mandatory final whole-Epic review Task."""',
              '"""WHEN: epic_next says create_task_plan after successful Phase 0. INPUT only ordered implementation work items; current Epic execution is sequential through the managed Task engine, not a generic parallel DAG. AI Layer preserves Phase 0 and appends the mandatory final whole-Epic closure/review Task for integration, documentation, reviewed Project Knowledge and Project Map evidence."""',
          )
          replace(
              "src/ai_layer/mcp/tools/epics.py",
              '"""WHEN: epic_next says archive. Allowed only after the final STANDARD Task passed and mechanical closure gates prove documentation changed and reviewed Project Knowledge was published."""',
              '"""WHEN: epic_next says archive. Allowed only after the final STANDARD Task passed and mechanical closure gates prove required documentation, reviewed Project Knowledge, and scoped ProjectMapReconciled evidence are complete. Never archive by inferring completion from chat or child Task status alone."""',
          )

          replace(
              "src/ai_layer/builtin_skills/ai-layer-workflow.md",
              "9. Persist Project Knowledge, Decisions, Task/Epic state, findings, or verification evidence only when it has durable value.",
              "9. Persist durable state through its supported owner only: Decisions when consequential rationale matters; managed Task/Epic state through their live workflows; Project Knowledge authoring/publishing only through its review-gated managed flow. Ordinary native work may read Knowledge but must not claim direct VERIFIED publication.",
          )
          replace(
              "src/ai_layer/builtin_skills/ai-layer-workflow.md",
              "During real investigation, the agent establishes a non-obvious invariant such as “retry processing must remain idempotent by provider event id” and verifies it against source/tests. If this will matter to later work, record it as Project Knowledge with precise evidence paths rather than a transient session narrative. Review-gated Knowledge is useful because later agents can search it without repeating the original investigation. Do not put such behavioral invariants into Project Map merely because they mention a useful file.",
              "During real investigation, the agent establishes a non-obvious invariant such as “retry processing must remain idempotent by provider event id” and verifies it against source/tests. If the current work is inside a supported managed Knowledge author/review flow, draft it with precise evidence paths so an independent review can publish it. During ordinary unmanaged host-native work, do not pretend VERIFIED Knowledge can be written directly; create/use an explicit managed Knowledge/onboarding task when durable publication is actually valuable. Do not put behavioral invariants into Project Map merely because they mention a useful file.",
          )
          replace(
              "src/ai_layer/builtin_skills/ai-layer-workflow.md",
              "For Project Knowledge, verify important claims against current source, tests, configuration, or other authoritative project evidence before creating/updating durable cards. Evidence paths are pointers that make future staleness detectable.",
              "When a supported managed flow authors Project Knowledge, verify important claims against current source, tests, configuration, or other authoritative project evidence before drafting/reviewing durable cards. Evidence paths are pointers that make future staleness detectable. Ordinary unmanaged work should use `knowledge_search` for reads and must not fabricate direct publication authority.",
          )

          replace(
              "src/ai_layer/integrations/global_install.py",
              "INTEGRATION_TEMPLATE_VERSION = 22\nGLOBAL_BOOTSTRAP_VERSION = 12",
              "INTEGRATION_TEMPLATE_VERSION = 23\nGLOBAL_BOOTSTRAP_VERSION = 13",
          )
          replace(
              "src/ai_layer/integrations/service.py",
              "INTEGRATION_TEMPLATE_VERSION = 22\nGLOBAL_BOOTSTRAP_VERSION = 9",
              "INTEGRATION_TEMPLATE_VERSION = 23\nGLOBAL_BOOTSTRAP_VERSION = 13",
          )
          replace(
              "src/ai_layer/integrations/global_install.py",
              '"---\\ndescription: Mandatory Local AI Development Layer workflow\\nalwaysApply: true\\n---\\n\\n"',
              '"---\\ndescription: Local AI Development Layer control plane\\nalwaysApply: true\\n---\\n\\n"',
          )

          Path(".github/workflows/agent-contract-audit-edit.yml").unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align all agent-facing runtime guidance"
          git push origin HEAD:audit/agent-facing-contracts
