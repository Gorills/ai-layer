name: agent-contract-format-once

on:
  push:
    branches:
      - audit/agent-facing-contracts
    paths:
      - .github/workflows/agent-contract-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/agent-facing-contracts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.16.2
      - run: ruff format src/ai_layer/application/tasks.py src/ai_layer/tasks/navigation.py tests/test_agent_facing_contracts.py
      - name: Commit formatting
        run: |
          rm -f .github/workflows/agent-contract-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format agent-facing contract changes"
          git push origin HEAD:audit/agent-facing-contracts
