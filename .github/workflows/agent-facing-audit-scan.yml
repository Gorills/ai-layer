name: agent-facing-audit-scan

on:
  push:
    branches:
      - audit/agent-facing-contracts
    paths:
      - .github/workflows/agent-facing-audit-scan.yml

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/agent-facing-contracts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan agent-facing text
        run: |
          echo '=== STALE/LEGACY PHRASE CANDIDATES ==='
          rg -n -i 'after memory_context|reuse the initial `?memory_context|create a task before implementation|forbidden_until_task_create|MCP Task Layer|curated project facts belong to memory_search|load only the relevant skill section|PRIMARY WORKFLOW NAVIGATOR|Mandatory Local AI Development Layer workflow|Task Layer' src/ai_layer AGENTS.md GEMINI.md || true
          echo '=== MEMORY ALIAS/COMPATIBILITY REFERENCES ==='
          rg -n 'memory_context|memory_search' src/ai_layer/domain src/ai_layer/mcp src/ai_layer/builtin_skills src/ai_layer/integrations src/ai_layer/memory || true
          echo '=== PRODUCT-SPECIFIC SKILL REFERENCES ==='
          rg -n 'project_status|project_search|task_next|epic_next|project_map_reconcile|knowledge_search|memory_context' src/ai_layer/builtin_skills || true
          echo '=== MCP TOOL DOCSTRINGS ==='
          python - <<'PY'
          import ast
          from pathlib import Path
          for path in sorted(Path('src/ai_layer/mcp/tools').glob('*.py')):
              tree = ast.parse(path.read_text(encoding='utf-8'))
              docs=[]
              for node in tree.body:
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      doc=ast.get_docstring(node)
                      if doc:
                          docs.append((node.name, ' '.join(doc.split())))
              if docs:
                  print(f'## {path}')
                  for name, doc in docs:
                      print(f'{name}: {doc}')
          PY
          echo '=== INTEGRATION VERSIONS ==='
          rg -n 'INTEGRATION_TEMPLATE_VERSION|GLOBAL_BOOTSTRAP_VERSION' src/ai_layer/integrations
      - name: Remove scan workflow
        if: always()
        run: |
          rm -f .github/workflows/agent-facing-audit-scan.yml
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: remove one-shot agent-facing audit scan"
          git push origin HEAD:audit/agent-facing-contracts
