name: apply-deep-skill-overhaul

on:
  push:
    branches:
      - feat/deep-professional-skills

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/deep-professional-skills
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and materialize prepared skill corpus
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/.skill-overhaul-payload/part-*.txt | base64 --decode > /tmp/skill-overhaul.tar.xz
          echo "2e30aaa02fb846aeab30c2d90d62552662430200b2fb01803aeba71b4247a8db  /tmp/skill-overhaul.tar.xz" | sha256sum --check
          tar -xJf /tmp/skill-overhaul.tar.xz
      - name: Fix bounded core clipping exposed by deep skills
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/ai_layer/skills/service.py")
          text = path.read_text(encoding="utf-8")
          old = (
              '    content = "\\n\\n".join(chunks).strip() or str(skill.get("content") or "").strip()\n'
              '    if len(content) <= max_chars:\n'
              '        return content\n'
              '    return content[: max_chars - 45].rstrip() + "\\n...[skill core clipped; use skill_get section]"\n'
          )
          new = (
              '    content = "\\n\\n".join(chunks).strip() or str(skill.get("content") or "").strip()\n'
              '    if max_chars <= 0:\n'
              '        return ""\n'
              '    if len(content) <= max_chars:\n'
              '        return content\n'
              '    suffix = "\\n...[skill core clipped; use skill_get section]"\n'
              '    if len(suffix) >= max_chars:\n'
              '        return content[:max_chars]\n'
              '    return content[: max_chars - len(suffix)].rstrip() + suffix\n'
          )
          if old not in text:
              raise SystemExit("skill_core_content clipping block no longer matches expected baseline")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Format changed Python files
        run: ruff format scripts/skill_gate.py src/ai_layer/skills/service.py tests/test_skill_quality_gate.py tests/test_skill_core_limits.py
      - name: Acknowledge reviewed governance change
        run: python scripts/governance_gate.py --write-baseline
      - name: Refresh deterministic wheel
        run: python scripts/build_release_wheel.py
      - name: Refresh release manifest
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest_path = Path("release/release-manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          wheel = Path(manifest["application_wheel"])
          manifest["application_wheel_sha256"] = hashlib.sha256(wheel.read_bytes()).hexdigest()
          manifest["notes"] = (
              "0.12.2 refreshes all 43 bundled project skills into deep, selectively retrievable "
              "professional playbooks, adds executable depth and distinctiveness quality floors, "
              "fixes strict core-content clipping, and refreshes the deterministic wheel. "
              "No schema or Task/Epic transition semantics changed."
          )
          manifest_path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Remove bootstrap-only files
        run: |
          rm -rf scripts/.skill-overhaul-payload
          rm -f .github/workflows/apply-skill-overhaul.yml
      - name: Targeted skill quality tests
        run: python -m pytest tests/test_skill_quality_gate.py tests/test_skill_core_limits.py tests/test_skills.py tests/test_native_skills.py -q
      - name: Canonical quality
        run: make quality
      - name: Diff hygiene
        run: git diff --check
      - name: Commit materialized overhaul
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "feat(skills): deepen bundled production skill catalog"
          git push origin HEAD:feat/deep-professional-skills
