name: apply-truthful-health
on:
  push:
    branches: [ai/truthful-integration-health]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/truthful-integration-health
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply prepared exact-context patch
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          import gzip
          from pathlib import Path

          encoded = Path('.github/truthful-health.patch.gz.b64').read_text(encoding='utf-8')
          patch = gzip.decompress(base64.b64decode(encoded)).decode('utf-8')
          lines = patch.splitlines(keepends=True)
          root = Path('.')
          i = 0
          changed = []
          while i < len(lines):
              if not lines[i].startswith('diff --git '):
                  i += 1
                  continue
              parts = lines[i].strip().split()
              target = parts[3][2:]
              i += 1
              new_file = False
              while i < len(lines) and not lines[i].startswith('@@') and not lines[i].startswith('diff --git '):
                  if lines[i].startswith('new file mode'):
                      new_file = True
                  i += 1
              path = root / target
              if new_file:
                  output = []
                  while i < len(lines) and not lines[i].startswith('diff --git '):
                      if lines[i].startswith('@@'):
                          i += 1
                          continue
                      if lines[i].startswith('+') and not lines[i].startswith('+++'):
                          output.append(lines[i][1:])
                      i += 1
                  if path.exists():
                      raise RuntimeError(f'expected new file to be absent: {target}')
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text(''.join(output), encoding='utf-8')
                  changed.append(target)
                  continue

              text = path.read_text(encoding='utf-8')
              position = 0
              hunks = 0
              while i < len(lines) and not lines[i].startswith('diff --git '):
                  if not lines[i].startswith('@@'):
                      i += 1
                      continue
                  i += 1
                  hunk = []
                  while i < len(lines) and not lines[i].startswith('@@') and not lines[i].startswith('diff --git '):
                      hunk.append(lines[i])
                      i += 1
                  old = ''.join(
                      item[1:] if item[:1] in {' ', '-'} else item
                      for item in hunk
                      if not item.startswith('+')
                  )
                  new = ''.join(
                      item[1:] if item[:1] in {' ', '+'} else item
                      for item in hunk
                      if not item.startswith('-')
                  )
                  index = text.find(old, position)
                  if index < 0:
                      raise RuntimeError(f'exact patch context mismatch: {target} hunk {hunks + 1}')
                  text = text[:index] + new + text[index + len(old):]
                  position = index + len(new)
                  hunks += 1
              path.write_text(text, encoding='utf-8')
              changed.append(target)
          expected = {
              'src/ai_layer/integrations/status.py',
              'src/ai_layer/cli/doctor.py',
              'tests/test_integration_health.py',
          }
          if set(changed) != expected:
              raise RuntimeError(f'unexpected patch surface: {changed}')
          print('Applied exact-context health patch:', ', '.join(changed))
          PY
          rm .github/truthful-health.patch.gz.b64
          rm .github/workflows/apply-truthful-health.yml
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Format touched Python files
        run: |
          ruff format src/ai_layer/integrations/status.py src/ai_layer/cli/doctor.py tests/test_integration_health.py
          ruff check --fix src/ai_layer/integrations/status.py src/ai_layer/cli/doctor.py tests/test_integration_health.py
      - name: Refresh deterministic application wheel
        run: |
          python scripts/build_release_wheel.py
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest_path = Path('release/release-manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          wheel = Path(manifest['application_wheel'])
          manifest['application_wheel_sha256'] = hashlib.sha256(wheel.read_bytes()).hexdigest()
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit branch result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Report truthful integration health'
          git push origin HEAD:ai/truthful-integration-health
