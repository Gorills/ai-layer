name: architecture-diagnostics
on:
  push:
    branches: [fix-ci-baseline]
jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Print architecture errors only
        run: |
          python scripts/architecture_gate.py --json > /tmp/architecture.json || true
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/architecture.json').read_text())
          print(json.dumps({"ok": payload.get("ok"), "errors": payload.get("errors", [])}, indent=2))
          PY
