name: build-0.11.5-wheel
on:
  push:
    branches: [fix/release-0.11.5]
permissions:
  contents: read
jobs:
  build-wheel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_release_wheel.py
      - uses: actions/upload-artifact@v4
        with:
          name: ai-layer-0.11.5-wheel
          path: dist/local_ai_development_layer-0.11.5-py3-none-any.whl
          if-no-files-found: error
