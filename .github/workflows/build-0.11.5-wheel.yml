name: build-0.11.5-wheel
on:
  push:
    branches: [fix/release-0.11.5]
permissions:
  contents: write
jobs:
  build-wheel:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_release_wheel.py
      - run: |
          rm -f dist/local_ai_development_layer-0.11.4-py3-none-any.whl
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- dist/local_ai_development_layer-0.11.4-py3-none-any.whl dist/local_ai_development_layer-0.11.5-py3-none-any.whl
          git commit -m "Refresh 0.11.5 installable wheel"
          git push origin HEAD:fix/release-0.11.5
      - uses: actions/upload-artifact@v4
        with:
          name: ai-layer-0.11.5-wheel
          path: dist/local_ai_development_layer-0.11.5-py3-none-any.whl
          if-no-files-found: error
