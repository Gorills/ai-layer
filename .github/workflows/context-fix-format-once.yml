name: context-fix-format-once

on:
  push:
    branches:
      - fix/project-map-context-contract
    paths:
      - .github/workflows/context-fix-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/project-map-context-contract
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.16.2
      - run: ruff format src/ai_layer/application/epic_navigation.py
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ai_layer/application/epic_navigation.py
          git commit -m "style(epics): apply canonical formatting"
          git push origin HEAD:fix/project-map-context-contract
