name: context-fix-release-once

on:
  push:
    branches:
      - fix/project-map-context-contract
    paths:
      - .github/workflows/context-fix-release-once.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/project-map-context-contract
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Promote 0.13.2
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected source fragment missing: {path}: {old!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace("pyproject.toml", 'version = "0.13.1"', 'version = "0.13.2"')
          replace("src/ai_layer/__init__.py", '__version__ = "0.13.1"', '__version__ = "0.13.2"')
          replace("README.md", "Current package version: **0.13.1**.", "Current package version: **0.13.2**.")
          replace(
              "CURRENT_STATE.md",
              "# Current State — v0.13.1 semantic Project Map enrichment",
              "# Current State — v0.13.2 Project Map runtime contract hardening",
          )

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          marker = "# Changelog\n\n"
          entry = """## 0.13.2 — Project Map runtime contract hardening

- Compacted MCP-facing `memory_context` into a compatibility brief instead of returning the legacy multi-surface context payload; focused Project Intelligence APIs remain the preferred path.
- `memory_context` without `task`/`query` now fails soft to `project_status` instead of producing a validation error during legacy/weak-agent startup.
- Added a versioned runtime Project Map capability contract that explicitly names `project_search` for reads and `project_map_reconcile` for updates, including scope, provenance, multilingual aliases and honest no-change semantics.
- Published the current Project Map contract through `project_status`, native/MCP bootstrap and every `epic_next`, so Epics created before Project Map existed learn current behavior dynamically.
- Epic finalization no longer creates another final Task when documentation and Project Knowledge are complete but only `ProjectMapReconciled` evidence is missing; it waits on reconciliation against the already-completed Task.
- Added regression tests for compact legacy context, no-task fallback, old-Epic Project Map guidance and map-only Epic closure behavior. No database migration.

"""
          if entry.strip() not in text:
              if marker not in text:
                  raise SystemExit("CHANGELOG marker missing")
              changelog.write_text(text.replace(marker, marker + entry, 1), encoding="utf-8")

          state = Path("CURRENT_STATE.md")
          text = state.read_text(encoding="utf-8")
          anchor = "- **Legacy context:** `memory_context` remains for compatibility but is informational only. It no longer invokes `task_next`, selects workflow authority or acts as the mandatory project bootstrap."
          replacement = "- **Legacy context:** `memory_context` remains only as a compact compatibility helper. With no task/query it serves `project_status`; with a task it returns bounded knowledge hints instead of the old multi-surface payload. It never selects or advances Task/Epic workflow."
          if anchor in text:
              text = text.replace(anchor, replacement, 1)
          map_anchor = "- **Project Map reconciliation:** `project_map_reconcile` validates current paths/symbols, records Task provenance and checked scope, permits an explicit factual no-change result, and binds semantic freshness to the source content hash. Completed meaningful Tasks are prompted to reconcile only what they learned; the final Epic Task must emit scoped reconciliation evidence before closure."
          map_replacement = "- **Project Map reconciliation:** `project_map_reconcile` validates current paths/symbols, records Task provenance and checked scope, permits an explicit factual no-change result, and binds semantic freshness to the source content hash. A versioned capability contract is emitted by `project_status` and `epic_next`, so old Epics learn the current tool semantics dynamically; map-only final closure waits on reconciliation against the completed Task instead of spawning another final Task."
          if map_anchor in text:
              text = text.replace(map_anchor, map_replacement, 1)
          state.write_text(text, encoding="utf-8")
          PY
          rm .github/workflows/context-fix-release-once.yml
          python scripts/build_release_wheel.py
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          wheel = Path("dist/local_ai_development_layer-0.13.2-py3-none-any.whl")
          if not wheel.is_file():
              raise SystemExit("0.13.2 wheel was not built")
          manifest_path = Path("release/release-manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["version"] = "0.13.2"
          manifest["application_wheel"] = wheel.as_posix()
          manifest["application_wheel_sha256"] = hashlib.sha256(wheel.read_bytes()).hexdigest()
          manifest["notes"] = (
              "0.13.2 compacts legacy memory_context, publishes an explicit Project Map runtime contract "
              "to new and old workflows, and fixes Epic map-only closure without a redundant retry Task."
          )
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          python scripts/governance_gate.py --write-baseline
      - name: Commit promoted release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: promote 0.13.2"
          git push origin HEAD:fix/project-map-context-contract
