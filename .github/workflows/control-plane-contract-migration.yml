name: Control Plane Contract Migration

on:
  push:
    branches:
      - refactor/project-intelligence-control-plane

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message == 'chore: add one-shot control-plane contract migration'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/project-intelligence-control-plane
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Migrate obsolete contract tests
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          def replace_function(path: str, name: str, replacement: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              tree = ast.parse(text)
              node = next(
                  item for item in tree.body
                  if isinstance(item, (ast.FunctionDef, ast.AsyncFunctionDef)) and item.name == name
              )
              lines = text.splitlines(keepends=True)
              new_lines = lines[: node.lineno - 1] + [replacement.rstrip() + '\n\n'] + lines[node.end_lineno :]
              p.write_text(''.join(new_lines), encoding='utf-8')

          # MCP instructions now describe the host-native control plane, not a global orchestrator role.
          path = Path('tests/test_context_trace.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '    assert "top-level chat" in seen["instructions"]\n',
              '    assert "project_status" in seen["instructions"]\n'
              '    assert "native host reads/edits/tests/subagents" in seen["instructions"]\n',
          )
          path.write_text(text, encoding='utf-8')

          replace_function(
              'tests/test_epic_workflow_friction.py',
              'test_memory_context_keeps_passive_epic_from_hijacking_normal_task_navigation',
              '''def test_memory_context_keeps_epic_state_passive_and_informational(monkeypatch) -> None:
              rows = [
                  {
                      "key": "E-0001",
                      "title": "Large dashboard redesign",
                      "status": "draft",
                      "execution_spec_version": None,
                  }
              ]
              monkeypatch.setattr(context_app.epic_uc, "list_for_project", lambda *args, **kwargs: rows)

              passive = context_app._epic_context("/tmp/project")
              assert passive["available"] is True
              assert passive["active"] is None
              assert passive["open"][0]["key"] == "E-0001"
              assert passive["open"][0]["mode"] == "design"
              assert "Informational only" in passive["contract"]
              assert "workflow_focus" not in passive

              rows[0]["status"] = "running"
              rows[0]["execution_spec_version"] = 1
              executing = context_app._epic_context("/tmp/project")
              assert executing["active"]["key"] == "E-0001"
              assert executing["active"]["status"] == "running"
              assert "workflow_focus" not in executing''',
          )

          replace_function(
              'tests/test_incremental_memory.py',
              'test_incremental_scan_hashes_and_refreshes_only_affected_source_evidence',
              '''def test_incremental_scan_hashes_and_refreshes_only_affected_source_evidence(
              tmp_path: Path, monkeypatch
          ):
              for number in range(50):
                  (tmp_path / f"file_{number:02d}.py").write_text(f"VALUE = {number}\\n", encoding="utf-8")
              embedder = _configure(monkeypatch)
              db, project = _project_db(tmp_path)
              try:
                  first = scanner.scan_project(db, project, tmp_path)
                  db.commit()
                  assert first.hashes_calculated == 50
                  assert first.embeddings_regenerated == 50
                  assert sum(len(batch) for batch in embedder.calls) == 50

                  (tmp_path / "file_03.py").write_text("VALUE = 300\\n", encoding="utf-8")
                  (tmp_path / "file_17.py").write_text("VALUE = 1700\\n", encoding="utf-8")
                  (tmp_path / "new_file.py").write_text("NEW = True\\n", encoding="utf-8")
                  (tmp_path / "file_40.py").unlink()

                  second = scanner.scan_project(db, project, tmp_path)
                  db.commit()

                  assert second.hashes_calculated == 3
                  assert second.changes["added"] == ["new_file.py"]
                  assert second.changes["modified"] == ["file_03.py", "file_17.py"]
                  assert second.changes["deleted"] == ["file_40.py"]
                  assert second.changes["unchanged"] == 47
                  assert second.embeddings_regenerated == 3
                  assert second.embeddings_reused == 47
                  assert sum(len(batch) for batch in embedder.calls) == 53

                  sources = set(
                      db.scalars(select(ProjectFile.path).where(ProjectFile.project_id == project.id)).all()
                  )
                  assert "file_40.py" not in sources
                  assert "new_file.py" in sources
                  assert db.scalar(select(Knowledge).where(Knowledge.project_id == project.id)) is None
              finally:
                  db.close()''',
          )

          replace_function(
              'tests/test_incremental_memory.py',
              'test_unchanged_scan_reuses_deterministic_file_identity_without_embeddings',
              '''def test_unchanged_scan_reuses_deterministic_file_identity_without_embeddings(
              tmp_path: Path, monkeypatch
          ):
              (tmp_path / "app.py").write_text("print('ok')\\n", encoding="utf-8")
              embedder = _configure(monkeypatch)
              db, project = _project_db(tmp_path)
              try:
                  first = scanner.scan_project(db, project, tmp_path)
                  db.commit()
                  assert first.embeddings_regenerated == 1
                  calls_after_first = len(embedder.calls)
                  assert calls_after_first == 1

                  second = scanner.scan_project(db, project, tmp_path)
                  db.commit()

                  assert second.hashes_calculated == 0
                  assert second.changes["total"] == 0
                  assert second.embeddings_regenerated == 0
                  assert second.embeddings_reused == 1
                  assert len(embedder.calls) == calls_after_first
              finally:
                  db.close()''',
          )

          replace_function(
              'tests/test_incremental_memory.py',
              'test_scanner_schema_drift_forces_reparse_of_unchanged_source',
              '''def test_scanner_schema_drift_forces_reparse_of_unchanged_source(tmp_path: Path, monkeypatch):
              import json

              source = tmp_path / "app.py"
              source.write_text("VALUE = 1\\n", encoding="utf-8")
              embedder = _configure(monkeypatch)
              monkeypatch.setattr(
                  freshness,
                  "embedding_signature",
                  lambda: {"provider": "hash", "model": "hash-v1", "dimensions": 384},
              )
              db, project = _project_db(tmp_path)
              try:
                  first = scanner.scan_project(db, project, tmp_path)
                  db.commit()
                  freshness.write_scan_metadata(project, first, reason="initial")
                  calls_after_first = len(embedder.calls)

                  scan_file = tmp_path / ".ai-layer" / "memory" / freshness.SCAN_FILE
                  metadata = json.loads(scan_file.read_text(encoding="utf-8"))
                  metadata["scanner_schema"] = 3
                  scan_file.write_text(json.dumps(metadata), encoding="utf-8")
                  db.add(
                      Knowledge(
                          project_id=project.id,
                          kind="file",
                          title="legacy source chunk",
                          content="VALUE = 1",
                          source_path="app.py",
                          meta={"scanner_schema": 3},
                          embedding=[0.0] * 384,
                      )
                  )
                  db.add(
                      Knowledge(
                          project_id=project.id,
                          kind="architecture",
                          title="legacy architecture",
                          content="old summary",
                          source_path=None,
                          meta={"scanner_schema": 3},
                          embedding=[0.0] * 384,
                      )
                  )
                  db.commit()

                  result = freshness.ensure_memory_fresh(db, project)

                  assert result["reason"] == "scanner_schema_changed"
                  assert result["hashes_calculated"] == 1
                  assert result["embeddings_regenerated"] == 1
                  assert result["raw_source_embeddings_regenerated"] == 0
                  assert result["legacy_source_knowledge_removed"] == 2
                  assert len(embedder.calls) == calls_after_first + 1
                  evidence = db.scalar(
                      select(ProjectFile).where(
                          ProjectFile.project_id == project.id,
                          ProjectFile.path == "app.py",
                      )
                  )
                  assert evidence is not None
                  assert evidence.scanner_schema == 5
                  assert evidence.content_sha256
                  assert db.scalar(select(Knowledge).where(Knowledge.project_id == project.id)) is None
              finally:
                  db.close()''',
          )

          # Global integrations now bootstrap Project Intelligence while leaving execution host-native.
          path = Path('tests/test_integrations.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '        assert "memory_context(task=<actual user task>" in text\n'
              '        assert "task_next" in text\n'
              '        assert "dirty worktree is a valid baseline" in text\n',
              '        assert "project_status" in text\n'
              '        assert "project_search" in text\n'
              '        assert "host-native" in text.casefold()\n'
              '        assert "memory_context(task=<actual user task>" not in text\n'
              '        assert "Never stash, reset, restore, discard or commit user changes" in text\n',
          )
          text = text.replace(
              '    assert "task_next" in global_rule\n'
              '    assert "Current repository source is authoritative" in global_rule\n'
              '    assert "Never stash, reset, restore, discard or commit user changes" in global_rule\n'
              '    assert "must not edit repository files" in global_rule.casefold()\n',
              '    assert "project_status" in global_rule\n'
              '    assert "project_search" in global_rule\n'
              '    assert "Current repository source is authoritative" in global_rule\n'
              '    assert "Never stash, reset, restore, discard or commit user changes" in global_rule\n'
              '    assert "native read/edit/search/shell/test/subagent capabilities remain available" in global_rule.casefold()\n'
              '    assert "memory_context(task=<actual user task>" not in global_rule\n',
          )
          path.write_text(text, encoding='utf-8')

          replace_function(
              'tests/test_native_skills.py',
              'test_global_native_skills_share_agents_root_for_cursor_and_codex',
              '''def test_global_native_skills_publish_to_supported_host_roots(tmp_path, monkeypatch):
              monkeypatch.setenv("AI_LAYER_HOME", str(tmp_path / "state"))
              monkeypatch.setenv("HOME", str(tmp_path / "user"))
              get_settings.cache_clear()
              try:
                  result = sync_global_native_skills(home=tmp_path / "user")
                  assert result["routing_owner"] == "host-native"
                  assert result["activation_payload"] == "full-authoritative-skill"
                  assert result["canonical_skills"] == 44
                  assert result["validation"]["ok"] is True
                  shared = tmp_path / "user" / ".agents" / "skills" / "django" / "SKILL.md"
                  antigravity = tmp_path / "user" / ".gemini" / "config" / "skills" / "django" / "SKILL.md"
                  claude = tmp_path / "user" / ".claude" / "skills" / "django" / "SKILL.md"
                  assert shared.is_file() and antigravity.is_file() and claude.is_file()
                  assert shared.read_text(encoding="utf-8") == antigravity.read_text(encoding="utf-8")
                  assert shared.read_text(encoding="utf-8") == claude.read_text(encoding="utf-8")
                  text = shared.read_text(encoding="utf-8")
                  meta = _frontmatter(text)
                  assert meta["name"] == "django"
                  assert "description" in meta
                  assert set(meta) == {"name", "description"}
                  assert "## Core contract" in text
                  assert "## Decision rules" in text
                  assert "## Migrations" in text
                  assert "skill_get" not in text
                  assert "required" not in meta and "recommended" not in meta

                  workflow_native = (
                      tmp_path / "user" / ".agents" / "skills" / "ai-layer-workflow" / "SKILL.md"
                  )
                  assert workflow_native.is_file()
                  workflow_text = workflow_native.read_text(encoding="utf-8")
                  workflow_meta = _frontmatter(workflow_text)
                  assert workflow_meta["name"] == "ai-layer-workflow"
                  assert "managed Tasks/Epics" in workflow_meta["description"]
                  assert "## Workflow" in workflow_text
                  assert "## Project intelligence and durable memory" in workflow_text
              finally:
                  get_settings.cache_clear()''',
          )

          replace_function(
              'tests/test_native_skills.py',
              'test_ai_layer_workflow_core_keeps_complete_entry_sections',
              '''def test_ai_layer_workflow_core_keeps_complete_entry_sections(tmp_path, monkeypatch):
              monkeypatch.setenv("AI_LAYER_HOME", str(tmp_path / "state"))
              get_settings.cache_clear()
              try:
                  skill = load_skill("ai-layer-workflow")
                  assert skill is not None
                  core, sections = skill_section_content(skill, "core")
                  assert "## Apply when" in core
                  assert "## Core contract" in core
                  assert "## Decision rules" in core
                  assert "skill core clipped" not in core
                  assert "`project_status` is the first AI Layer state call" in core
                  assert "AI Layer is an engineering control plane" in core
                  assert "default is host-native execution" in core
                  assert "do not create a Task merely to authorize editing" in core
                  assert "`project_search" in core
                  assert "Workflow" in sections
                  assert "Evidence to inspect" in sections
                  assert "Verification" in sections
                  assert "Failure modes" in sections
                  assert "Completion criteria" in sections
                  assert len(core) < len(skill["content"])
              finally:
                  get_settings.cache_clear()''',
          )

          replace_function(
              'tests/test_orchestrator_contract.py',
              'test_critical_orchestrator_contract_is_readable_mandatory_first_call_kernel',
              '''def test_global_bootstrap_is_project_intelligence_first_and_host_native(tmp_path: Path):
              project_text = workflow(tmp_path)
              global_text = global_bootstrap_workflow()

              assert "AI Layer control-plane boundary" in global_text
              assert "host agent runtime remains the execution engine" in global_text
              assert "project_status" in global_text
              assert "project_search" in global_text
              assert "knowledge_search" in global_text
              assert "Native read/edit/search/shell/test/subagent capabilities remain available" in global_text
              assert "Managed Tasks and Epics remain durable workflows" in global_text
              assert "Current repository source is the final authority" in global_text
              assert "Never stash, reset, restore, discard or commit user changes" in global_text
              assert "memory_context(task=<actual user task>" not in global_text
              assert "top-level chat is the ORCHESTRATOR" not in global_text

              assert "Mandatory engineering discipline" in global_text
              assert "at or below 100 words" in global_text
              assert "at or below 60 words" in global_text
              assert global_text.count("Mandatory engineering discipline") == 1
              for rule in STATIC_POLICY_RULES:
                  assert f"- {rule}" in global_text
              assert len(global_text.encode("utf-8")) < 9000

              assert "project binding (legacy compatibility)" in project_text
              assert "Canonical project root" in project_text
              assert "global native bootstrap and MCP Task Layer" in project_text
              assert "## AI Layer control-plane boundary" not in project_text
              assert len(project_text.encode("utf-8")) < 500''',
          )

          path = Path('tests/test_orchestrator_contract.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '        assert before["next_action"]["orchestrator_contract"]["repository_mutation"] == "forbidden"\n',
              '        assert (\n'
              '            before["next_action"]["orchestrator_contract"]["repository_mutation"]\n'
              '            == "forbidden_during_delegated_stage"\n'
              '        )\n',
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Install dev dependencies
        run: python -m pip install -e '.[dev]' >/dev/null 2>&1
      - name: Format migrated contracts
        run: |
          ruff check --fix tests/test_context_trace.py tests/test_epic_workflow_friction.py tests/test_incremental_memory.py tests/test_integrations.py tests/test_native_skills.py tests/test_orchestrator_contract.py
          ruff format tests/test_context_trace.py tests/test_epic_workflow_friction.py tests/test_incremental_memory.py tests/test_integrations.py tests/test_native_skills.py tests/test_orchestrator_contract.py
      - name: Verify migrated contract tests
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_context_trace.py \
            tests/test_epic_workflow_friction.py \
            tests/test_incremental_memory.py \
            tests/test_integrations.py \
            tests/test_native_skills.py \
            tests/test_orchestrator_contract.py
      - name: Remove one-shot helpers and commit
        run: |
          rm -f .github/workflows/control-plane-diagnostic.yml
          rm -f .github/workflows/control-plane-contract-migration.yml
          git config user.name 'Gorills'
          git config user.email '57192423+Gorills@users.noreply.github.com'
          git add tests .github/workflows
          git commit -m 'test: align contracts with host-native control plane'
          git push origin HEAD:refactor/project-intelligence-control-plane
