name: Control Plane Diagnostic

on:
  push:
    branches:
      - refactor/project-intelligence-control-plane

permissions:
  contents: read

jobs:
  quality-summary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install quietly
        run: python -m pip install -e '.[dev]' >/dev/null 2>&1
      - name: Canonical failure summary
        run: |
          set +e
          python scripts/quality_gate.py --deterministic-wheel > /tmp/quality.log 2>&1
          code=$?
          grep -E 'FAILED |ERROR |short test summary|failed,|passed,|unit-and-integration-tests|release-reproducibility' /tmp/quality.log | tail -n 120 || true
          echo "QUALITY_EXIT=$code"
          exit 0
