name: dashboard-nav-refine

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16@sha256:a132765ec351c65111b5b675928a3a0515a466a40f97277329db8b8209ad8bc9
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_layer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_layer"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      AI_LAYER_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/ai_layer
      AI_LAYER_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/ai_layer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/project-centered-dashboard
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Apply final navigation refinement
        run: python .github/dashboard_nav_refine.py
      - name: Format helper and tests
        run: ruff format .github/dashboard_nav_refine.py tests/test_dashboard_project_workspace_ux.py
      - name: Focused Dashboard UX gate
        run: |
          ruff check .github/dashboard_nav_refine.py tests/test_dashboard_project_workspace_ux.py
          python -m pytest -q tests/test_dashboard_project_workspace_ux.py tests/test_dashboard.py tests/test_dashboard_redesign.py tests/test_dashboard_work_ui.py
      - name: Refresh deterministic wheel and manifest
        run: |
          python scripts/build_release_wheel.py
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest_path = Path('release/release-manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          wheel = Path(manifest['application_wheel'])
          manifest['application_wheel_sha256'] = hashlib.sha256(wheel.read_bytes()).hexdigest()
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Full quality gate
        run: make quality
      - name: PostgreSQL gate
        run: make postgres-gate
      - name: Refresh release archive
        run: python scripts/build_release.py --output dist/ai-layer-release.zip
      - name: Commit verified navigation refinement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/ai_layer/dashboard/static/js/app.js \
            tests/test_dashboard_project_workspace_ux.py \
            dist/local_ai_development_layer-0.14.0-py3-none-any.whl \
            dist/ai-layer-release.zip \
            release/release-manifest.json
          git diff --cached --quiet && { echo 'No validated changes to commit'; exit 1; }
          git commit -m 'Keep project hubs one click away'
          git push origin HEAD:ux/project-centered-dashboard
