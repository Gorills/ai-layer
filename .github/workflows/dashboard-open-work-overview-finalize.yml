name: dashboard-open-work-overview-finalizer

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize bounded overview change
        run: |
          python .github/dashboard-open-work-overview-finalize.py
          rm .github/dashboard-open-work-overview-finalize.py
          rm .github/workflows/dashboard-open-work-overview-finalize.yml
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Normalize new regression test
        run: |
          ruff check --fix tests/test_dashboard_open_work_overview.py
          ruff format tests/test_dashboard_open_work_overview.py
      - name: Refresh deterministic application wheel
        run: |
          python scripts/build_release_wheel.py
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest_path = Path('release/release-manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          wheel = Path(manifest['application_wheel'])
          manifest['application_wheel_sha256'] = hashlib.sha256(wheel.read_bytes()).hexdigest()
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Focused verification
        run: |
          python -m pytest \
            tests/test_dashboard_open_work_overview.py \
            tests/test_dashboard_project_workspace_ux.py \
            tests/test_dashboard_work_actions.py
      - name: Canonical quality gate
        run: make quality
      - name: Self-review and publish finalized branch
        run: |
          git diff --check
          git add -- \
            src/ai_layer/dashboard/static/js/views/project.js \
            src/ai_layer/dashboard/static/js/views/overview.js \
            tests/test_dashboard_open_work_overview.py \
            dist/local_ai_development_layer-0.14.0-py3-none-any.whl \
            release/release-manifest.json \
            .github/dashboard-open-work-overview-finalize.py \
            .github/workflows/dashboard-open-work-overview-finalize.yml
          git diff --cached --check
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/dashboard-open-work-overview-finalize.py \
            .github/workflows/dashboard-open-work-overview-finalize.yml \
            dist/local_ai_development_layer-0.14.0-py3-none-any.whl \
            release/release-manifest.json \
            src/ai_layer/dashboard/static/js/views/overview.js \
            src/ai_layer/dashboard/static/js/views/project.js \
            tests/test_dashboard_open_work_overview.py | sort)"
          test "$actual" = "$expected"
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Keep all open Work visible in Dashboard overview'
          git push origin HEAD:agent/dashboard-open-work-overview
