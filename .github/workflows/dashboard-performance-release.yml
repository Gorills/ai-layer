      - name: Reject concurrent branch movement
        shell: bash
        run: |
          expected='${{ github.sha }}'
          current="$(git ls-remote origin refs/heads/fix/dashboard-performance-0.12.2 | awk '{print $1}')"
          test "$current" = "$expected" || { echo "branch advanced: expected $expected got $current"; exit 1; }

      - name: Commit final 0.12.2 release tree
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            src/ai_layer/application/tasks.py \
            src/ai_layer/observability/snapshot.py \
            src/ai_layer/projections/dashboard.py \
            src/ai_layer/projections/epics.py \
            src/ai_layer/dashboard/static/js/app.js \
            tests/test_dashboard.py \
            tests/test_epic_dashboard.py \
            pyproject.toml \
            src/ai_layer/__init__.py \
            CHANGELOG.md \
            release/release-manifest.json \
            release/governance-baseline.json \
            dist/local_ai_development_layer-0.12.2-py3-none-any.whl
          git add -u -- dist .github/workflows/dashboard-performance-release.yml
          git diff --cached --check
          git commit -m 'Finalize 0.12.2 Dashboard performance fix'
          git push origin HEAD:fix/dashboard-performance-0.12.2
