name: dashboard-performance-release

on:
  push:
    branches:
      - fix/dashboard-performance-0.12.2

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Apply performance patch
        run: python .github/dashboard_perf_patch.py

      - name: Format and focused regression tests
        run: |
          ruff check --fix src/ai_layer/application/tasks.py src/ai_layer/observability/snapshot.py src/ai_layer/projections/dashboard.py src/ai_layer/projections/epics.py tests/test_dashboard.py tests/test_epic_dashboard.py tests/test_tasks.py
          ruff format src/ai_layer/application/tasks.py src/ai_layer/observability/snapshot.py src/ai_layer/projections/dashboard.py src/ai_layer/projections/epics.py tests/test_dashboard.py tests/test_epic_dashboard.py tests/test_tasks.py
          pytest -q tests/test_dashboard.py tests/test_epic_dashboard.py tests/test_tasks.py

      - name: Build deterministic 0.12.2 wheel
        run: |
          rm -f dist/local_ai_development_layer-*.whl
          python scripts/build_release_wheel.py
          test -f dist/local_ai_development_layer-0.12.2-py3-none-any.whl

      - name: Refresh release metadata
        run: python .github/dashboard_perf_release.py

      - name: Remove temporary release helpers
        run: rm -f .github/dashboard_perf_patch.py .github/dashboard_perf_release.py .github/workflows/dashboard-performance-release.yml

      - name: Canonical final quality
        run: python scripts/quality_gate.py --deterministic-wheel

      - name: Reject concurrent branch movement
        shell: bash
        run: |
          expected='${{ github.sha }}'
          current="$(git ls-remote origin refs/heads/fix/dashboard-performance-0.12.2 | awk '{print $1}')"
          test "$current" = "$expected" || { echo "branch advanced: expected $expected got $current"; exit 1; }

      - name: Commit final 0.12.2 release tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/ai_layer/application/tasks.py src/ai_layer/observability/snapshot.py src/ai_layer/projections/dashboard.py src/ai_layer/projections/epics.py src/ai_layer/dashboard/static/js/app.js tests/test_dashboard.py tests/test_epic_dashboard.py tests/test_tasks.py pyproject.toml src/ai_layer/__init__.py CHANGELOG.md release/release-manifest.json release/governance-baseline.json dist/local_ai_development_layer-0.12.2-py3-none-any.whl
          git add -u -- dist .github/dashboard_perf_patch.py .github/dashboard_perf_release.py .github/workflows/dashboard-performance-release.yml
          git diff --cached --check
          git commit -m 'Finalize 0.12.2 Dashboard performance fix'
          git push origin HEAD:fix/dashboard-performance-0.12.2
