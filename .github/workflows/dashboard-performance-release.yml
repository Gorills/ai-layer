name: dashboard-performance-release

on:
  push:
    branches:
      - fix/dashboard-performance-0.12.2

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Apply Dashboard performance fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')

          # 1. Projection Task reads must never invoke the authoritative navigator/repository guards.
          path = root / 'src/ai_layer/application/tasks.py'
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'def read_state(project_root: str | Path) -> dict:',
              'def read_state(project_root: str | Path, *, include_history: bool = True) -> dict:',
          )
          text = text.replace(
              'state = current_task(db, project, include_history=True)',
              'state = current_task(db, project, include_history=include_history)',
          )
          path.write_text(text, encoding='utf-8')

          # 2. Observability carries the already-read Task projection so Dashboard never reads it twice.
          path = root / 'src/ai_layer/observability/snapshot.py'
          text = path.read_text(encoding='utf-8')
          old = '''def _project_snapshot(
              root: Path,
              *,
              include_handoff_text: bool = False,
              registered: dict | None = None,
          ) -> dict:'''
          new = '''def _project_snapshot(
              root: Path,
              *,
              include_handoff_text: bool = False,
              include_task_history: bool = True,
              registered: dict | None = None,
          ) -> dict:'''
          if old not in text:
              raise SystemExit('snapshot _project_snapshot signature not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              'task_state = read_task_state(root)',
              'task_state = read_task_state(root, include_history=include_task_history)',
              1,
          )
          marker = '''        "task": task_state.get("current") or task_state.get("latest"),
              "task_active": bool(task_state.get("current")),'''
          replacement = '''        "task": task_state.get("current") or task_state.get("latest"),
              "task_active": bool(task_state.get("current")),
              "task_state": task_state,'''
          if marker not in text:
              raise SystemExit('snapshot task payload marker not found')
          text = text.replace(marker, replacement, 1)
          old = '''def observability_snapshot(
              project_root: str | Path | None = None,
              *,
              all_projects: bool = False,
              include_handoff_text: bool = False,
          ) -> dict:'''
          new = '''def observability_snapshot(
              project_root: str | Path | None = None,
              *,
              all_projects: bool = False,
              include_handoff_text: bool = False,
              include_task_history: bool = True,
          ) -> dict:'''
          if old not in text:
              raise SystemExit('observability_snapshot signature not found')
          text = text.replace(old, new, 1)
          old = '''            include_handoff_text=include_handoff_text,
                  registered=registered_for_root.get(str(root.resolve())),'''
          new = '''            include_handoff_text=include_handoff_text,
                  include_task_history=include_task_history,
                  registered=registered_for_root.get(str(root.resolve())),'''
          if old not in text:
              raise SystemExit('snapshot call marker not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          # 3. Dashboard projection: reuse snapshot Task state, keep overview history light,
          #    and cache expensive native skill descriptor reads between polls.
          path = root / 'src/ai_layer/projections/dashboard.py'
          text = path.read_text(encoding='utf-8')
          text = text.replace('import hashlib\n', 'import hashlib\nimport time\n', 1)
          text = text.replace(
              'from ai_layer.application.tasks import read_state as read_task_state\n',
              '',
              1,
          )
          cache_marker = 'from ai_layer.skills.native import native_catalog_files\n\n\n'
          cache_block = '''from ai_layer.skills.native import native_catalog_files

_NATIVE_CATALOG_COUNT_TTL_SECONDS = 30.0
_NATIVE_CATALOG_COUNT_CACHE: dict[str, tuple[float, dict[str, int]]] = {}


def _native_catalog_counts(root: Path) -> dict[str, int]:
    key = str(root.expanduser().resolve())
    now = time.monotonic()
    cached = _NATIVE_CATALOG_COUNT_CACHE.get(key)
    if cached is not None and now - cached[0] < _NATIVE_CATALOG_COUNT_TTL_SECONDS:
        return dict(cached[1])
    catalogs = native_catalog_files(root)
    counts = {host: len(paths) for host, paths in catalogs.items()}
    _NATIVE_CATALOG_COUNT_CACHE[key] = (now, dict(counts))
    return counts


'''
          if cache_marker not in text:
              raise SystemExit('dashboard native import marker not found')
          text = text.replace(cache_marker, cache_block, 1)
          text = text.replace(
              '    catalogs = native_catalog_files(root)\n    return {',
              '    catalog_counts = _native_catalog_counts(root)\n    return {',
              1,
          )
          text = text.replace(
              '        "configured_catalog": {host: len(paths) for host, paths in catalogs.items()},',
              '        "configured_catalog": catalog_counts,',
              1,
          )
          text = text.replace(
              'snapshot = observability_snapshot(all_projects=True, include_handoff_text=False)',
              'snapshot = observability_snapshot(\n        all_projects=True, include_handoff_text=False, include_task_history=False\n    )',
              1,
          )
          if text.count('task_state = read_task_state(root)') != 2:
              raise SystemExit('expected exactly two duplicate Dashboard Task reads')
          text = text.replace(
              'task_state = read_task_state(root)',
              'task_state = project.get("task_state") or {}',
          )
          path.write_text(text, encoding='utf-8')

          # 4. Project Epic list is a read-side summary, not N+1 full Epic expansion.
          path = root / 'src/ai_layer/projections/epics.py'
          path.write_text('''from __future__ import annotations

import hashlib
from pathlib import Path

from sqlalchemy import select

from ai_layer.application import epics as epic_uc
from ai_layer.core.registry import list_registered_projects
from ai_layer.core.service import get_project
from ai_layer.db.epic_models import Epic
from ai_layer.db.session import session_scope
from ai_layer.epics.contracts import epic_key


def _project_key(entry: dict) -> str:
    project_id = str(entry.get("project_id") or "").strip()
    if project_id:
        return project_id
    root = str(entry.get("root") or "")
    return "root-" + hashlib.sha256(root.encode("utf-8")).hexdigest()[:16]


def _root_for_key(key: str) -> Path | None:
    for entry in list_registered_projects(existing_only=True):
        if _project_key(entry) == key:
            return Path(str(entry["root"])).expanduser().resolve()
    return None


def _epic_summary(row: Epic) -> dict:
    return {
        "id": str(row.id),
        "key": epic_key(row.sequence),
        "project_id": str(row.project_id),
        "title": row.title,
        "status": row.status,
        "current_spec_version": row.current_spec_version,
        "approved_spec_version": row.approved_spec_version,
        "execution_spec_version": row.execution_spec_version,
        "plan_version": row.plan_version,
        "blocked_reason": row.blocked_reason,
        "created_at": row.created_at.isoformat() if row.created_at else None,
        "updated_at": row.updated_at.isoformat() if row.updated_at else None,
        "completed_at": row.completed_at.isoformat() if row.completed_at else None,
        "archived_at": row.archived_at.isoformat() if row.archived_at else None,
    }


def _list_epic_summaries(root: Path) -> list[dict]:
    with session_scope() as db:
        project = get_project(db, root)
        rows = db.scalars(
            select(Epic).where(Epic.project_id == project.id).order_by(Epic.sequence.desc())
        ).all()
        return [_epic_summary(row) for row in rows]


def project_epics_payload(project_key: str) -> dict | None:
    root = _root_for_key(project_key)
    if root is None:
        return None
    return {"project_key": project_key, "epics": _list_epic_summaries(root)}


def epic_detail_payload(project_key: str, epic_key: str) -> dict | None:
    root = _root_for_key(project_key)
    if root is None:
        return None
    try:
        epic = epic_uc.get(root, key=epic_key, include_history=True)
    except ValueError:
        return None
    return {"project_key": project_key, "epic": epic}
''', encoding='utf-8')

          # 5. Frontend: adaptive recursive polling, pause hidden tabs, and avoid full DOM churn
          #    when only volatile timestamps/uptime changed.
          path = root / 'src/ai_layer/dashboard/static/js/app.js'
          path.write_text('''import { api } from "./api.js";
import { time, escapeHtml } from "./format.js";
import { renderEpicDetail, renderEpicList } from "./views/epic.js";
import { renderOverview } from "./views/overview.js";
import { renderProject } from "./views/project.js";

const app = document.querySelector("#app");
const projectNav = document.querySelector("#project-nav");
const pageTitle = document.querySelector("#page-title");
const pageSubtitle = document.querySelector("#page-subtitle");
const updatedAt = document.querySelector("#updated-at");
const dot = document.querySelector("#connection-dot");
const connectionLabel = document.querySelector("#connection-label");
const refreshButton = document.querySelector("#refresh-button");

const ACTIVE_POLL_MS = 3000;
const IDLE_POLL_MS = 12000;
const VOLATILE_RENDER_FIELDS = new Set(["generated_at", "uptime_seconds", "idle_seconds"]);

let overviewCache = null;
let timer = null;
let loading = false;
let nextPollMs = IDLE_POLL_MS;
let lastRenderFingerprint = null;
let lastNavFingerprint = null;

function route() {
  const value = location.hash.replace(/^#\\/?/, "") || "overview";
  const parts = value.split("/");
  if (parts[0] === "project" && parts[1]) {
    return { kind: "project", key: decodeURIComponent(parts[1]) };
  }
  if (parts[0] === "epic" && parts[1] && parts[2]) {
    return {
      kind: "epic",
      projectKey: decodeURIComponent(parts[1]),
      epicKey: decodeURIComponent(parts[2]),
    };
  }
  return { kind: "overview" };
}

function routeKey(current) {
  if (current.kind === "project") return `project:${current.key}`;
  if (current.kind === "epic") return `epic:${current.projectKey}:${current.epicKey}`;
  return "overview";
}

function semanticFingerprint(current, payload) {
  return JSON.stringify([routeKey(current), payload], (key, value) => (
    VOLATILE_RENDER_FIELDS.has(key) ? undefined : value
  ));
}

function setConnection(ok, label) {
  dot.classList.toggle("online", ok);
  dot.classList.toggle("offline", !ok);
  connectionLabel.textContent = label;
}

function renderNav(data) {
  const projects = data.projects || [];
  const fingerprint = JSON.stringify(projects.map((p) => [p.key, p.name]));
  if (fingerprint !== lastNavFingerprint) {
    projectNav.innerHTML = projects.map((p) => `<a class="nav-item" href="#/project/${encodeURIComponent(p.key)}" data-project-nav="${escapeHtml(p.key)}">${escapeHtml(p.name)}</a>`).join("");
    lastNavFingerprint = fingerprint;
  }
  const current = route();
  document.querySelectorAll(".nav-item.active").forEach((el) => el.classList.remove("active"));
  if (current.kind === "overview") document.querySelector('[data-route="overview"]')?.classList.add("active");
  else {
    const key = current.kind === "epic" ? current.projectKey : current.key;
    document.querySelector(`[data-project-nav="${CSS.escape(key)}"]`)?.classList.add("active");
  }
}

function bindProjectRows() {
  document.querySelectorAll("[data-project-key]").forEach((row) => {
    row.addEventListener("click", () => { location.hash = `#/project/${encodeURIComponent(row.dataset.projectKey)}`; });
  });
}

function overviewIsLive(data) {
  const summary = data?.summary || {};
  return Number(summary.active_tasks || 0) > 0 || Number(summary.active_agents || 0) > 0;
}

function projectIsLive(data) {
  const project = data?.project || {};
  const task = data?.task_state?.current || {};
  return project.runtime_state === "active"
    || project.project_state === "working"
    || task.status === "active"
    || (project.active_operations || []).length > 0;
}

function epicIsLive(data) {
  return ["running", "final_review"].includes(data?.epic?.status || "");
}

function renderChanged(current, payload, render) {
  const fingerprint = semanticFingerprint(current, payload);
  if (fingerprint === lastRenderFingerprint) return false;
  lastRenderFingerprint = fingerprint;
  render();
  return true;
}

async function load() {
  if (loading) return;
  loading = true;
  try {
    const current = route();
    if (!overviewCache || current.kind === "overview") overviewCache = await api.overview();
    renderNav(overviewCache);
    if (current.kind === "project") {
      const [data, epicData] = await Promise.all([api.project(current.key), api.projectEpics(current.key)]);
      renderChanged(current, { data, epicData }, () => {
        pageTitle.textContent = data.project?.name || "Проект";
        pageSubtitle.textContent = "Задачи, Epics, стадии, ревью и состояние проекта";
        app.innerHTML = `${renderProject(data)}${renderEpicList(epicData, current.key)}`;
      });
      updatedAt.textContent = `обновлено ${time(data.generated_at)}`;
      nextPollMs = projectIsLive(data) ? ACTIVE_POLL_MS : IDLE_POLL_MS;
    } else if (current.kind === "epic") {
      const data = await api.epic(current.projectKey, current.epicKey);
      renderChanged(current, data, () => {
        pageTitle.textContent = `${data.epic?.key || "Epic"} · ${data.epic?.title || ""}`;
        pageSubtitle.textContent = "Specification · audits · Phase 0 · Task plan · final review";
        app.innerHTML = renderEpicDetail(data);
      });
      updatedAt.textContent = `обновлено ${time(data.epic?.updated_at)}`;
      nextPollMs = epicIsLive(data) ? ACTIVE_POLL_MS : IDLE_POLL_MS;
    } else {
      renderChanged(current, overviewCache, () => {
        pageTitle.textContent = "Обзор";
        pageSubtitle.textContent = "Текущие задачи, стадии и состояние AI Layer";
        app.innerHTML = renderOverview(overviewCache);
        bindProjectRows();
      });
      updatedAt.textContent = `обновлено ${time(overviewCache.generated_at)}`;
      nextPollMs = overviewIsLive(overviewCache) ? ACTIVE_POLL_MS : IDLE_POLL_MS;
    }
    const background = Boolean(overviewCache.service?.background);
    setConnection(true, `${background ? "Фоновая служба" : "AI Layer"} ${overviewCache.version || ""}`.trim());
  } catch (error) {
    setConnection(false, "Панель отключена");
    lastRenderFingerprint = null;
    app.innerHTML = `<div class="alert">Ошибка API панели: ${escapeHtml(error.message)}</div>`;
    nextPollMs = IDLE_POLL_MS;
  } finally {
    loading = false;
  }
}

function schedule() {
  if (timer) clearTimeout(timer);
  timer = null;
  if (document.hidden) return;
  timer = setTimeout(async () => {
    await load();
    schedule();
  }, nextPollMs);
}

async function refresh({ resetOverview = false } = {}) {
  if (resetOverview) overviewCache = null;
  await load();
  schedule();
}

window.addEventListener("hashchange", () => {
  lastRenderFingerprint = null;
  void refresh({ resetOverview: true });
});
refreshButton.addEventListener("click", () => { void refresh({ resetOverview: true }); });
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    if (timer) clearTimeout(timer);
    timer = null;
    return;
  }
  void refresh({ resetOverview: true });
});

void refresh();
''', encoding='utf-8')

