name: dashboard-project-cockpit-finalize
on:
  push:
    branches: [agent/dashboard-project-cockpit]
permissions:
  contents: write
jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[cockpit-finalized]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dashboard-project-cockpit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Apply Project Cockpit changes
        run: python .github/dashboard-project-cockpit-apply.py
      - name: Normalize Python test
        run: python -m ruff format tests/test_dashboard_project_cockpit.py
      - name: Rebuild deterministic application wheel
        run: python scripts/build_release_wheel.py
      - name: Refresh application wheel digest
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest_path = Path('release/release-manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          wheel = Path(manifest['application_wheel'])
          manifest['application_wheel_sha256'] = hashlib.sha256(wheel.read_bytes()).hexdigest()
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Focused Project Cockpit verification
        run: pytest -q tests/test_dashboard_project_cockpit.py
      - name: Canonical quality gate
        run: make quality
      - name: Review final diff
        run: |
          git diff --check
          git status --short
          git diff --stat
      - name: Publish finalized implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            src/ai_layer/dashboard/static/js/app.js \
            src/ai_layer/dashboard/static/js/views/project.js \
            src/ai_layer/dashboard/static/css/workspace.css \
            tests/test_dashboard_project_cockpit.py \
            dist/local_ai_development_layer-0.14.0-py3-none-any.whl \
            release/release-manifest.json
          git diff --cached --check
          git commit -m 'Apply Project Cockpit UX [cockpit-finalized]'
          git push origin HEAD:agent/dashboard-project-cockpit
