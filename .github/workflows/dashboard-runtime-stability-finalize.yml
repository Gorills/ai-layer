name: dashboard-runtime-stability-finalizer

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/dashboard-runtime-stability'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply staged implementation
        run: |
          git apply --check .github/dashboard-runtime-stability.patch
          git apply .github/dashboard-runtime-stability.patch
          rm .github/dashboard-runtime-stability.patch
          rm .github/workflows/dashboard-runtime-stability-finalize.yml

      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Format changed Python
        run: |
          python -m ruff check --fix \
            src/ai_layer/dashboard/work_contracts.py \
            tests/test_dashboard_work.py \
            tests/test_dashboard_runtime_ui.py
          python -m ruff format \
            src/ai_layer/dashboard/work_contracts.py \
            tests/test_dashboard_work.py \
            tests/test_dashboard_runtime_ui.py

      - name: Refresh deterministic release wheel
        run: |
          python scripts/build_release_wheel.py
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          wheel = Path('dist/local_ai_development_layer-0.14.0-py3-none-any.whl')
          manifest_path = Path('release/release-manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['application_wheel_sha256'] = hashlib.sha256(wheel.read_bytes()).hexdigest()
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Focused Dashboard verification
        run: >-
          pytest -q
          tests/test_dashboard_work.py
          tests/test_dashboard_work_ui.py
          tests/test_dashboard_runtime_ui.py
          tests/test_dashboard_work_actions.py
          tests/test_dashboard_redesign.py

      - name: Canonical quality gate
        run: make quality

      - name: Validate final diff scope
        run: |
          git diff --check
          git add \
            src/ai_layer/dashboard/work_contracts.py \
            src/ai_layer/dashboard/static/js/app.js \
            src/ai_layer/dashboard/static/js/api.js \
            src/ai_layer/dashboard/static/js/views/work.js \
            src/ai_layer/dashboard/static/css/app.css \
            tests/test_dashboard_work.py \
            tests/test_dashboard_runtime_ui.py \
            dist/local_ai_development_layer-0.14.0-py3-none-any.whl \
            release/release-manifest.json
          git add -A \
            .github/dashboard-runtime-stability.patch \
            .github/workflows/dashboard-runtime-stability-finalize.yml
          python - <<'PY'
          import subprocess

          allowed = {
              'src/ai_layer/dashboard/work_contracts.py',
              'src/ai_layer/dashboard/static/js/app.js',
              'src/ai_layer/dashboard/static/js/api.js',
              'src/ai_layer/dashboard/static/js/views/work.js',
              'src/ai_layer/dashboard/static/css/app.css',
              'tests/test_dashboard_work.py',
              'tests/test_dashboard_runtime_ui.py',
              'dist/local_ai_development_layer-0.14.0-py3-none-any.whl',
              'release/release-manifest.json',
              '.github/dashboard-runtime-stability.patch',
              '.github/workflows/dashboard-runtime-stability-finalize.yml',
          }
          changed = set(
              subprocess.check_output(
                  ['git', 'diff', '--cached', '--name-only'], text=True
              ).splitlines()
          )
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f'unexpected finalizer changes: {sorted(unexpected)}')
          required = {
              'src/ai_layer/dashboard/work_contracts.py',
              'src/ai_layer/dashboard/static/js/app.js',
              'src/ai_layer/dashboard/static/js/api.js',
              'src/ai_layer/dashboard/static/js/views/work.js',
              'src/ai_layer/dashboard/static/css/app.css',
              'tests/test_dashboard_work.py',
              'tests/test_dashboard_runtime_ui.py',
              'dist/local_ai_development_layer-0.14.0-py3-none-any.whl',
              'release/release-manifest.json',
          }
          missing = required - changed
          if missing:
              raise SystemExit(f'missing expected finalizer changes: {sorted(missing)}')
          PY

      - name: Commit finalized implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Stabilize Dashboard runtime navigation'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
