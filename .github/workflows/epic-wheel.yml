name: Epic wheel artifact

on:
  push:
    branches:
      - hardening/epic-workflow-friction

permissions:
  contents: read

jobs:
  build-wheel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build deterministic wheel
        run: python scripts/build_release_wheel.py
      - name: Show wheel hash
        run: sha256sum dist/local_ai_development_layer-0.12.2-py3-none-any.whl
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: epic-wheel
          path: dist/local_ai_development_layer-0.12.2-py3-none-any.whl
          if-no-files-found: error
          retention-days: 1
