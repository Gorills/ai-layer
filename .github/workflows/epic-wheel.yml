name: Epic wheel artifact

on:
  push:
    branches:
      - hardening/epic-workflow-friction

permissions:
  contents: write

jobs:
  build-wheel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build deterministic wheel
        run: python scripts/build_release_wheel.py
      - name: Refresh release manifest
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          wheel = Path("dist/local_ai_development_layer-0.12.2-py3-none-any.whl")
          manifest_path = Path("release/release-manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["application_wheel_sha256"] = hashlib.sha256(wheel.read_bytes()).hexdigest()
          manifest["notes"] = (
              "0.12.2 refreshes all 43 bundled project skills into deep, selectively retrievable "
              "professional playbooks, adds executable depth and distinctiveness quality floors, fixes "
              "strict core-content clipping, and hardens long-lived Epic/Task coexistence, document-style "
              "spec editing, independent spec audit guidance, and intervening-Task impact reconciliation. "
              "No schema migration is required."
          )
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(manifest["application_wheel_sha256"])
          PY
      - name: Commit deterministic release artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/local_ai_development_layer-0.12.2-py3-none-any.whl release/release-manifest.json
          if git diff --cached --quiet; then
            echo "Release artifacts already current"
          else
            git commit -m "build(release): refresh deterministic Epic wheel"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: epic-wheel
          path: dist/local_ai_development_layer-0.12.2-py3-none-any.whl
          if-no-files-found: error
          retention-days: 1
