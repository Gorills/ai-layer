name: epics-final-release
on:
  push:
    branches: [feature/epics-v1]
permissions:
  contents: write
jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/epics-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Apply idempotent final Epic source fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          env = Path('alembic/env.py')
          text = env.read_text(encoding='utf-8')
          if 'epic_models as _epic_models' not in text:
              text = text.replace(
                  'from ai_layer.db import models\n',
                  'from ai_layer.db import epic_models as _epic_models\nfrom ai_layer.db import models\n',
              )
          env.write_text(text, encoding='utf-8')

          planning = Path('src/ai_layer/application/epic_planning.py')
          text = planning.read_text(encoding='utf-8')
          text = text.replace('    capture_identity,\n', '')
          marker = 'from ai_layer.db.epic_models import Epic, EpicPlanItem, EpicSpecVersion\n'
          if 'epic_task_boundary import accepted_task_identity' not in text:
              text = text.replace(
                  marker,
                  'from ai_layer.application.epic_task_boundary import accepted_task_identity\n' + marker,
              )
          text = text.replace(
              '        identity = capture_identity(project.root_path)\n        epic.execution_digest = identity["digest"]\n        epic.execution_files = identity["file_count"]\n',
              '        identity = accepted_task_identity(db, task)\n        epic.execution_digest = str(identity["digest"])\n        epic.execution_files = int(identity["file_count"])\n',
          )
          planning.write_text(text, encoding='utf-8')

          navigation = Path('src/ai_layer/application/epic_navigation.py')
          text = navigation.read_text(encoding='utf-8')
          marker = 'from ai_layer.application.epic_planning import retry_final_item\n'
          if 'epic_task_boundary import accepted_task_identity' not in text:
              text = text.replace(
                  marker,
                  marker + 'from ai_layer.application.epic_task_boundary import accepted_task_identity\n',
              )
          old = '''    identity = capture_identity(project.root_path)\n    epic.execution_digest = identity["digest"]\n    epic.execution_files = identity["file_count"]\n    if active.kind == "final":\n'''
          new = '''    identity = accepted_task_identity(db, task)\n    epic.execution_digest = str(identity["digest"])\n    epic.execution_files = int(identity["file_count"])\n    if active.kind == "final":\n'''
          if old in text:
              text = text.replace(old, new, 1)
          navigation.write_text(text, encoding='utf-8')

          mcp = Path('src/ai_layer/mcp/tools/epics.py')
          text = mcp.read_text(encoding='utf-8')
          text = text.replace(
              'WHEN: DRAFT audit/discussion changes the Epic, or a human resolves a blocked material decision. Creates a new immutable spec version; never rewrites an approved historical version in place.',
              'WHEN: a DRAFT or already-approved-but-not-started Epic changes before Phase 0. Creates a new immutable spec version, returns the Epic to DRAFT and requires explicit reapproval; execution-time human decisions use epic_reconcile_complete.',
          )
          text = text.replace(
              'WHEN: an independent pre-approval Epic audit has actually been performed. Records findings against the exact current spec version. Audit rounds are unlimited. Recording an audit does not revise or approve the spec.',
              'WHEN: an independent Epic specification audit has actually been performed before Phase 0, including after approval but before execution starts. Records findings against the exact current spec version. Audit rounds are unlimited; revision after approval returns the Epic to DRAFT and requires reapproval.',
          )
          text = text.replace(
              'Automatically applies non-branching/clearly recommended durable corrections. Set human_decisions only for genuine material product/architecture trade-offs; any entry blocks execution for the user.',
              'Automatically applies non-branching/clearly recommended durable corrections. Set human_decisions only for genuine material product/architecture trade-offs; any entry blocks execution. After the user resolves a blocked decision, call this tool again with the resolved updated_spec and human_decisions=[].',
          )
          mcp.write_text(text, encoding='utf-8')

          skill = Path('src/ai_layer/builtin_skills/epics.md')
          text = skill.read_text(encoding='utf-8')
          text = text.replace('## Audit and revision before approval\n', '## Audit and revision before execution\n')
          text = text.replace(
              '- Audit rounds are unlimited.\n',
              '- Audit rounds are unlimited before Phase 0, including after approval but before execution starts.\n',
              1,
          )
          text = text.replace(
              '- If the audit/discussion changes the spec, call `epic_spec_revise` with the complete new spec. Never silently rewrite an older version.\n',
              '- If the audit/discussion changes the spec, call `epic_spec_revise` with the complete new spec. Never silently rewrite an older version. Revising an already-approved-but-not-started Epic returns it to DRAFT and requires explicit reapproval.\n',
          )
          text = text.replace(
              '- Genuine material product/architecture trade-off: put it in `human_decisions`; this intentionally blocks the Epic for the user.\n',
              '- Genuine material product/architecture trade-off: put it in `human_decisions`; this intentionally blocks the Epic for the user. After the user chooses, call `epic_reconcile_complete` again with the resolved execution spec and an empty `human_decisions` list so Phase 0/drift continues from the same durable reconciliation context.\n',
          )
          skill.write_text(text, encoding='utf-8')

          tests = Path('tests/test_epic_human_gates.py')
          text = tests.read_text(encoding='utf-8')
          if 'test_phase0_post_completion_change_is_not_silently_accepted' not in text:
              text += '''\n\ndef test_phase0_post_completion_change_is_not_silently_accepted(tmp_path: Path, monkeypatch) -> None:\n    db, project, root = _environment(tmp_path, monkeypatch)\n    try:\n        key = _phase0_ready(db, project, root)\n        (root / "after-phase0.py").write_text("CHANGED_AFTER_REVIEW = True\\n", encoding="utf-8")\n        reconciled = epics.reconcile_complete(root, key=key, summary="Phase 0 findings recorded.")\n        assert reconciled["status"] == "planning"\n        epics.set_plan(\n            root,\n            key=key,\n            work_items=[\n                {\n                    "title": "Implement scope",\n                    "goal": "Implement scope.",\n                    "acceptance_criteria": ["Scope complete"],\n                    "constraints": [],\n                }\n            ],\n        )\n        navigation = epics.next_action(root, key=key)\n        assert navigation["epic"]["status"] == "blocked"\n        assert navigation["next_action"]["action"] == "start_drift_reconciliation"\n    finally:\n        db.close()\n        get_settings.cache_clear()\n'''
          tests.write_text(text, encoding='utf-8')
          PY
          python -m ruff check --fix src/ai_layer alembic/env.py tests/test_epics.py tests/test_epic_human_gates.py tests/test_epic_mcp_runtime.py tests/test_epic_dashboard.py
          python -m ruff format src/ai_layer alembic/env.py tests/test_epics.py tests/test_epic_human_gates.py tests/test_epic_mcp_runtime.py tests/test_epic_dashboard.py
      - name: Source gates
        run: |
          python -m ruff check src/ai_layer alembic/env.py tests/test_epics.py tests/test_epic_human_gates.py tests/test_epic_mcp_runtime.py tests/test_epic_dashboard.py
          python -m ruff format --check src/ai_layer alembic/env.py tests/test_epics.py tests/test_epic_human_gates.py tests/test_epic_mcp_runtime.py tests/test_epic_dashboard.py
          python -m mypy src/ai_layer
          python -m pytest -q tests/test_epics.py tests/test_epic_human_gates.py tests/test_epic_mcp_runtime.py tests/test_epic_dashboard.py
          python scripts/architecture_gate.py
      - name: Remove all temporary build artifacts before packaging
        run: |
          rm -f ci-epics-focused.txt ci-quality-debug.json ci-arch-debug.json
          rm -f \
            .github/workflows/epics-focused-debug.yml \
            .github/workflows/epics-finalize-source.yml \
            .github/workflows/epics-release-build.yml \
            .github/workflows/epic-task-boundary-fix.yml \
            .github/workflows/epics-clean-temp.yml \
            .github/workflows/epics-final-release.yml
      - name: Build source-fresh wheel and release metadata
        run: |
          rm -rf /tmp/epics-wheel
          mkdir -p /tmp/epics-wheel
          python scripts/build_release_wheel.py --output-dir /tmp/epics-wheel
          python - <<'PY'
          import hashlib
          import json
          import shutil
          from pathlib import Path

          root = Path('.')
          built = Path('/tmp/epics-wheel/local_ai_development_layer-0.12.0-py3-none-any.whl')
          if not built.is_file():
              raise SystemExit('0.12.0 deterministic wheel was not produced')
          dist = root / 'dist'
          dist.mkdir(exist_ok=True)
          for old in dist.glob('local_ai_development_layer-*.whl'):
              old.unlink()
          target = dist / built.name
          shutil.copy2(built, target)
          digest = hashlib.sha256(target.read_bytes()).hexdigest()

          manifest_path = root / 'release/release-manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['version'] = '0.12.0'
          manifest['application_wheel'] = str(target)
          manifest['application_wheel_sha256'] = digest
          manifest['migration_compatibility']['target_schema'] = '0014_epics_v1'
          manifest['notes'] = (
              '0.12.0 activates durable Epics v1: versioned human-approved specs, unlimited pre-execution audits, '
              'mandatory Phase 0 source reconciliation, sequential STANDARD Task execution, verified-boundary drift '
              'reconciliation, whole-Epic final review, documentation/Project Knowledge closure, native weak-model guidance '
              'and Dashboard views. The committed wheel is rebuilt from this exact source.'
          )
          validation = dict(manifest.get('validation') or {})
          validation['epic_workflow_black_box'] = 'required_before_promotion_on_supported_host'
          manifest['validation'] = validation
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          policy = json.loads((root / 'release/governance-policy.json').read_text(encoding='utf-8'))
          hashes = {}
          for path_text in policy['protected_paths']:
              path = root / path_text
              if not path.is_file():
                  raise SystemExit(f'governance protected path missing: {path_text}')
              hashes[path_text] = hashlib.sha256(path.read_bytes()).hexdigest()
          (root / 'release/governance-baseline.json').write_text(
              json.dumps({'schema': 1, 'sha256': hashes}, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(f'wheel={target} sha256={digest}')
          PY
      - name: Canonical final quality
        run: python scripts/quality_gate.py --deterministic-wheel
      - name: Reject stale concurrent branch writes
        run: |
          git fetch origin feature/epics-v1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/feature/epics-v1)"
      - name: Commit final release tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            alembic/env.py \
            src/ai_layer \
            tests/test_epics.py \
            tests/test_epic_human_gates.py \
            tests/test_epic_mcp_runtime.py \
            tests/test_epic_dashboard.py \
            release/release-manifest.json \
            release/governance-baseline.json \
            dist/local_ai_development_layer-0.12.0-py3-none-any.whl
          git add -u -- dist .github/workflows
          if git ls-files --error-unmatch ci-epics-focused.txt >/dev/null 2>&1; then git add -u -- ci-epics-focused.txt; fi
          if git ls-files --error-unmatch ci-quality-debug.json >/dev/null 2>&1; then git add -u -- ci-quality-debug.json; fi
          if git ls-files --error-unmatch ci-arch-debug.json >/dev/null 2>&1; then git add -u -- ci-arch-debug.json; fi
          git commit -m 'Finalize 0.12.0 Epics v1 release'
          git push origin HEAD:feature/epics-v1
