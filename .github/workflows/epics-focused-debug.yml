name: epics-focused-debug
on:
  push:
    branches: [feature/epics-v1]
permissions:
  contents: write
jobs:
  focused:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/epics-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Run focused diagnostics
        shell: bash
        run: |
          set +e
          : > ci-epics-focused.txt
          run_check() {
            name="$1"; shift
            tmp="$(mktemp)"
            "$@" >"$tmp" 2>&1
            code=$?
            echo "=== $name exit=$code ===" >> ci-epics-focused.txt
            tail -n 120 "$tmp" >> ci-epics-focused.txt
            echo >> ci-epics-focused.txt
          }
          run_check ruff-check python -m ruff check src/ai_layer tests/test_epics.py tests/test_epic_human_gates.py tests/test_epic_mcp_runtime.py tests/test_epic_dashboard.py
          run_check ruff-format python -m ruff format --check src/ai_layer tests/test_epics.py tests/test_epic_human_gates.py tests/test_epic_mcp_runtime.py tests/test_epic_dashboard.py
          run_check mypy python -m mypy src/ai_layer
          run_check epic-tests python -m pytest -q tests/test_epics.py tests/test_epic_human_gates.py tests/test_epic_mcp_runtime.py tests/test_epic_dashboard.py
          run_check architecture python scripts/architecture_gate.py
      - name: Commit diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- ci-epics-focused.txt
          git commit -m 'Capture focused Epics diagnostics'
          git push origin HEAD:feature/epics-v1
