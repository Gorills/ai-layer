name: epics-quality-debug
on:
  push:
    branches: [feature/epics-v1]
permissions:
  contents: write
jobs:
  debug:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/epics-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Sync test unit of work and format focused files
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_epics.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'from ai_layer.application import epic_execution, epic_lifecycle, epic_planning, epics',
              'from ai_layer.application import (\n    epic_execution,\n    epic_lifecycle,\n    epic_navigation,\n    epic_planning,\n    epics,\n)',
          )
          marker = '    monkeypatch.setattr(epic_execution, "session_scope", scope)\n'
          if 'monkeypatch.setattr(epic_navigation, "session_scope", scope)' not in text:
              text = text.replace(
                  marker,
                  marker + '    monkeypatch.setattr(epic_navigation, "session_scope", scope)\n',
              )
          path.write_text(text, encoding='utf-8')
          PY
          python -m ruff check --fix src/ai_layer/application/epic_execution.py src/ai_layer/application/epic_navigation.py src/ai_layer/application/epics.py tests/test_epics.py
          python -m ruff format src/ai_layer/application/epic_execution.py src/ai_layer/application/epic_navigation.py src/ai_layer/application/epics.py tests/test_epics.py
      - name: Capture architecture diagnostics
        run: |
          python scripts/architecture_gate.py > ci-arch-debug.json || true
      - name: Commit focused normalization and diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/ai_layer/application/epic_execution.py src/ai_layer/application/epic_navigation.py src/ai_layer/application/epics.py tests/test_epics.py ci-arch-debug.json
          if ! git diff --cached --quiet; then
            git commit -m 'Normalize flattened Epic navigation'
            git push origin HEAD:feature/epics-v1
          fi
