name: epics-v1-refactor
on:
  push:
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/epics-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Split Epic planning from execution
        run: |
          python - <<'PY'
          from pathlib import Path

          execution_path = Path('src/ai_layer/application/epic_execution.py')
          text = execution_path.read_text(encoding='utf-8')
          if Path('src/ai_layer/application/epic_planning.py').exists():
              print('planning split already present')
          else:
              start = text.index('def _write_execution_spec(')
              end = text.index('def _final_closure_evidence(')
              planning_chunk = text[start:end].rstrip() + '\n'
              planning_header = '''from __future__ import annotations

from pathlib import Path

from sqlalchemy import select
from sqlalchemy.orm import Session

from ai_layer.application.epic_common import (
    append_epic_event,
    capture_identity,
    current_spec,
    epic_for_update,
    epic_payload,
    project_for_root,
    task_row,
)
from ai_layer.db.epic_models import Epic, EpicPlanItem, EpicSpecVersion
from ai_layer.db.models import utcnow
from ai_layer.db.session import session_scope
from ai_layer.epics.contracts import (
    MAX_EPIC_PLAN_ITEMS,
    MAX_EPIC_SPEC_CHARS,
    bounded_text,
    epic_key,
    final_task_contract,
)

'''
              Path('src/ai_layer/application/epic_planning.py').write_text(
                  planning_header + planning_chunk,
                  encoding='utf-8',
              )
              text = text[:start] + text[end:]

          needle = '        epic = epic_for_update(db, project, key)\n        if epic.status == "draft":'
          if needle in text:
              text = text.replace(
                  needle,
                  '        epic = epic_for_update(db, project, key)\n'
                  '        action: dict[str, object]\n'
                  '        if epic.status == "draft":',
                  1,
              )
          execution_path.write_text(text, encoding='utf-8')

          facade = Path('src/ai_layer/application/epics.py')
          data = facade.read_text(encoding='utf-8')
          data = data.replace(
              'from ai_layer.application.epic_execution import (\n    next_action,\n    reconcile_complete,\n    set_plan,\n    start_drift_reconciliation,\n    start_next,\n)\n',
              'from ai_layer.application.epic_execution import (\n    next_action,\n    start_drift_reconciliation,\n    start_next,\n)\nfrom ai_layer.application.epic_planning import reconcile_complete, set_plan\n',
          )
          facade.write_text(data, encoding='utf-8')

          tests = Path('tests/test_epics.py')
          data = tests.read_text(encoding='utf-8')
          data = data.replace(
              'from ai_layer.application import epic_execution, epic_lifecycle, epics',
              'from ai_layer.application import epic_execution, epic_lifecycle, epic_planning, epics',
          )
          marker = '    monkeypatch.setattr(epic_execution, "session_scope", scope)\n'
          if 'monkeypatch.setattr(epic_planning, "session_scope", scope)' not in data:
              data = data.replace(
                  marker,
                  marker + '    monkeypatch.setattr(epic_planning, "session_scope", scope)\n',
              )
          tests.write_text(data, encoding='utf-8')
          PY
          python -m ruff check --fix src/ai_layer/application/epic_execution.py src/ai_layer/application/epic_planning.py src/ai_layer/application/epics.py tests/test_epics.py
          python -m ruff format src/ai_layer/application/epic_execution.py src/ai_layer/application/epic_planning.py src/ai_layer/application/epics.py tests/test_epics.py
      - name: Focused verification
        run: |
          python -m mypy src/ai_layer
          python -m pytest -q tests/test_epics.py
          python scripts/architecture_gate.py
      - name: Commit refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/ai_layer/application/epic_execution.py src/ai_layer/application/epic_planning.py src/ai_layer/application/epics.py tests/test_epics.py
          if ! git diff --cached --quiet; then
            git commit -m 'Split Epic planning from execution'
            git push origin HEAD:feature/epics-v1
          fi
