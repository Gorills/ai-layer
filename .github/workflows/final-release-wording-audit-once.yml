name: final-release-wording-audit-once
on:
  push:
    branches:
      - audit/agent-facing-contracts
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find stale release and architecture wording
        shell: bash
        run: |
          set -u
          echo '=== stale current release references ==='
          grep -RIn --exclude-dir=.git --exclude='*.whl' -E '0\.13\.2|0\.13\.1|Current package version' README.md CURRENT_STATE.md CHANGELOG.md pyproject.toml release src scripts tests || true
          echo '=== stale product-memory/task-layer wording ==='
          grep -RIn --exclude-dir=.git --exclude='*.whl' -E 'project memory|Project memory|Task Layer|MCP Task Layer|mandatory memory|mandatory Task|memory_context.*first|first.*memory_context' README.md CURRENT_STATE.md pyproject.toml release src scripts tests || true
