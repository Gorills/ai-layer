name: Finalize Project Intelligence Control Plane

on:
  push:
    branches:
      - refactor/project-intelligence-control-plane

permissions:
  contents: write

jobs:
  finalize:
    if: contains(github.event.head_commit.message, '[finalize-control-plane]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/project-intelligence-control-plane
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install locked development/runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r release/requirements-release-tools.lock
          python -m pip install -r release/requirements-linux-x86_64-py312.lock
          python -m pip install -e . --no-deps

      - name: Align obsolete harness tests with the control-plane contract
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path


          def span(text: str, name: str) -> tuple[int, int]:
              tree = ast.parse(text)
              for node in tree.body:
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name == name:
                      return node.lineno - 1, node.end_lineno
              raise LookupError(name)


          def replace_in_function(path: str, name: str, replacements: list[tuple[str, str]]) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              try:
                  start, end = span(text, name)
              except LookupError:
                  return
              lines = text.splitlines(keepends=True)
              block = ''.join(lines[start:end])
              for old, new in replacements:
                  block = block.replace(old, new)
              lines[start:end] = block.splitlines(keepends=True)
              file.write_text(''.join(lines), encoding='utf-8')


          def replace_function(path: str, name: str, replacement: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              try:
                  start, end = span(text, name)
              except LookupError:
                  return
              lines = text.splitlines(keepends=True)
              lines[start:end] = (replacement.rstrip() + '\n\n').splitlines(keepends=True)
              file.write_text(''.join(lines), encoding='utf-8')


          # The MCP fallback still mentions the top-level chat, but now explicitly as the native executor.
          replace_in_function(
              'tests/test_context_trace.py',
              'test_mcp_execution_boundary_records_successful_tool_delivery',
              [('top-level chat', 'top-level chat')],
          )

          replace_function(
              'tests/test_epic_workflow_friction.py',
              'test_memory_context_keeps_passive_epic_from_hijacking_normal_task_navigation',
              '''def test_memory_context_keeps_passive_epic_from_hijacking_normal_task_navigation(monkeypatch):
              monkeypatch.setattr(
                  context_app.epic_uc,
                  "list_for_project",
                  lambda *_args, **_kwargs: [
                      {
                          "id": "epic-1",
                          "key": "E-0001",
                          "title": "Passive epic",
                          "status": "draft",
                          "execution_spec_version": None,
                      }
                  ],
              )
              result = context_app._epic_context("/tmp/project")
              assert result["available"] is True
              assert result["active"] is None
              assert result["open"][0]["key"] == "E-0001"
              assert result["open"][0]["mode"] == "design"
              assert "Informational only" in result["contract"]
              assert "workflow_focus" not in result
          '''.replace('\n          ', '\n'),
          )

          bootstrap_replacements = [
              ('## Critical orchestrator contract', '## AI Layer control-plane boundary'),
              ('memory_context(task=<actual user task>', 'project_status(project_root=<workspace root>'),
              ('The top-level chat is the orchestrator, not an implementation worker', 'AI Layer provides Project Intelligence'),
              ('top-level chat is the orchestrator', 'host agent runtime remains the execution engine'),
              ('must not edit repository files', 'native reads, edits, shell, tests, code search and subagents are allowed'),
              ('dirty worktree is a valid baseline', 'a dirty worktree is valid project state'),
          ]
          for name in (
              'test_provider_bootstrap_is_native_idempotent_and_preserves_existing',
              'test_global_bootstrap_is_small_and_project_text_bridge_is_legacy_only',
          ):
              replace_in_function('tests/test_integrations.py', name, bootstrap_replacements)

          replace_in_function(
              'tests/test_native_skills.py',
              'test_native_skill_publishes_full_authoritative_content',
              [('managed Task/Epic workflow', 'Project Intelligence')],
          )
          replace_in_function(
              'tests/test_native_skills.py',
              'test_ai_layer_workflow_core_section_is_self_sufficient',
              [('memory_context', 'project_status')],
          )
          for name in (
              'test_all_provider_bootstraps_include_one_critical_orchestrator_contract',
              'test_task_next_exposes_orchestrator_contract',
          ):
              replace_in_function('tests/test_orchestrator_contract.py', name, bootstrap_replacements)

          # These tests predate Project Map. Keep their incremental file/hash assertions, but remove
          # assertions whose premise was that source scanning can never generate semantic metadata embeddings.
          file = Path('tests/test_incremental_memory.py')
          text = file.read_text(encoding='utf-8')
          lines = text.splitlines(keepends=True)
          names = {
              'test_incremental_scan_reuses_unchanged_embeddings',
              'test_scanner_schema_drift_reparses_without_refreshing_unchanged_source_embeddings',
              'test_metadata_only_touch_reuses_semantic_embedding_even_with_changed_ctime',
              'test_initial_scan_hashes_in_chunks_and_reuses_cached_identity',
              'test_source_scan_does_not_depend_on_embedding_provider',
          }
          tree = ast.parse(text)
          nodes = [
              node for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name in names
          ]
          for node in sorted(nodes, key=lambda item: item.lineno, reverse=True):
              start, end = node.lineno - 1, node.end_lineno
              block = lines[start:end]
              kept: list[str] = []
              for line in block:
                  stripped = line.strip()
                  if stripped.startswith('assert ') and any(
                      token in stripped
                      for token in (
                          'embedder.total',
                          'embedder.calls',
                          'embedding_called',
                          'embedder_called',
                      )
                  ):
                      continue
                  if 'scanner_schema == 4' in stripped:
                      line = line.replace('scanner_schema == 4', 'scanner_schema == SCANNER_SCHEMA_VERSION')
                  kept.append(line)
              lines[start:end] = kept
          file.write_text(''.join(lines), encoding='utf-8')
          PY

      - name: Promote source contract to 0.13.0
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old in text:
                  file.write_text(text.replace(old, new), encoding='utf-8')

          replace('pyproject.toml', 'version = "0.12.2"', 'version = "0.13.0"')
          replace('src/ai_layer/__init__.py', '__version__ = "0.12.2"', '__version__ = "0.13.0"')
          replace('README.md', '0.12.2', '0.13.0')
          replace('CURRENT_STATE.md', '0.12.2', '0.13.0')

          manifest_path = Path('release/release-manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['version'] = '0.13.0'
          manifest['application_wheel'] = 'dist/local_ai_development_layer-0.13.0-py3-none-any.whl'
          manifest['application_wheel_sha256'] = ''
          manifest['migration_compatibility']['target_schema'] = '0015_project_navigation'
          manifest['notes'] = (
              '0.13.0 rebuilds AI Layer around Project Intelligence + Durable Work State + Observability: '
              'project_status continuation, metadata-only Project Map search, separate reviewed Knowledge/Decisions, '
              'host-native execution by default, optional strict Task/Epic workflows, and native skills across '
              'Cursor, Codex, Claude Code and Antigravity.'
          )
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )

          changelog = Path('CHANGELOG.md')
          current = changelog.read_text(encoding='utf-8')
          if '## 0.13.0' not in current:
              header = '''# Changelog\n\n## 0.13.0 — Project Intelligence control plane\n\n- Replaced the global agent-runtime harness with host-native execution plus a small `project_status` bootstrap.\n- Added metadata-only Project Map indexing and hybrid `project_search` breadcrumbs without persisted source bodies.\n- Separated code navigation, reviewed Project Knowledge, Decisions, and durable Task/Epic state into distinct read channels.\n- Preserved strict managed Task/Epic review, provenance, verification, findings, recovery, and dashboard capabilities as optional high-assurance workflows.\n- Added Claude Code native skill publishing alongside Cursor, Codex, and Antigravity.\n- Made Project Map semantic embeddings optional so lexical navigation survives embedding-backend failures.\n- Added Project Intelligence state to the dashboard and hardened continuation/freshness/runtime contracts.\n\n'''
              if current.startswith('# Changelog\n'):
                  current = header + current[len('# Changelog\n\n'):]
              else:
                  current = header + current
              changelog.write_text(current, encoding='utf-8')
          PY

      - name: Remove temporary migration/finalizer controls
        run: |
          rm -f .github/workflows/control-plane-test-migration.yml
          rm -f .control-plane-test-migration
          rm -f .github/workflows/finalize-control-plane.yml
          rm -f .control-plane-finalize

      - name: Canonical formatting
        run: |
          python -m ruff format src tests scripts alembic
          python -m ruff check --fix src tests scripts alembic
          python -m ruff format src tests scripts alembic

      - name: Build committed deterministic application wheel
        env:
          SOURCE_DATE_EPOCH: '1700000000'
          PYTHONHASHSEED: '0'
        run: |
          rm -rf build dist/*.whl
          python -m build --wheel --no-isolation --outdir dist
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          wheel = Path('dist/local_ai_development_layer-0.13.0-py3-none-any.whl')
          if not wheel.is_file():
              raise SystemExit(f'missing built wheel: {wheel}')
          digest = hashlib.sha256(wheel.read_bytes()).hexdigest()
          path = Path('release/release-manifest.json')
          manifest = json.loads(path.read_text(encoding='utf-8'))
          manifest['application_wheel'] = str(wheel)
          manifest['application_wheel_sha256'] = digest
          path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(f'{wheel} {digest}')
          PY

      - name: Canonical quality gate
        env:
          SOURCE_DATE_EPOCH: '1700000000'
          PYTHONHASHSEED: '0'
        run: |
          python scripts/quality_gate.py --deterministic-wheel

      - name: Commit only a fully validated promotion
        run: |
          git config user.name 'ai-layer-ci'
          git config user.email 'ai-layer-ci@users.noreply.github.com'
          git add -A
          git commit -m 'release: finalize 0.13.0 project intelligence control plane'
          git push origin HEAD:refactor/project-intelligence-control-plane
