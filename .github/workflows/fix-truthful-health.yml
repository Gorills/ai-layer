name: fix-truthful-health
"on":
  push:
    branches: [ai/truthful-integration-health]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/truthful-integration-health
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve legacy doctor acceptance warning
        run: >-
          python -c "from pathlib import Path; p=Path('src/ai_layer/cli/doctor.py'); s=p.read_text(); old='        operational = state.get(\"operational_status\")\n        if operational == \"blocked\":\n'; new='        operational = state.get(\"operational_status\")\n        if operational is None and state.get(\"runtime_acceptance_required\"):\n            operational = \"configured_unverified\"\n        if operational == \"blocked\":\n'; assert s.count(old)==1; s=s.replace(old,new,1); old='                    \"problem\": f\"global {provider} bootstrap is configured but runtime acceptance is unverified\",\n'; new='                    \"problem\": f\"global {provider} bootstrap is configured; black-box acceptance is unverified\",\n'; assert s.count(old)==1; p.write_text(s.replace(old,new,1))"
      - name: Refresh deterministic application wheel
        run: python scripts/build_release_wheel.py
      - name: Refresh manifest wheel hash
        run: >-
          python -c "import hashlib,json; from pathlib import Path; p=Path('release/release-manifest.json'); m=json.loads(p.read_text()); w=Path(m['application_wheel']); m['application_wheel_sha256']=hashlib.sha256(w.read_bytes()).hexdigest(); p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')"
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/fix-truthful-health.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Preserve legacy health acceptance warning'
          git push origin HEAD:ai/truthful-integration-health
