name: format-agent-audit-once
on:
  push:
    branches:
      - audit/agent-facing-contracts
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/agent-facing-contracts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.16.2
      - run: ruff format src tests scripts
      - run: rm -f .github/workflows/format-agent-audit-once.yml
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --exit-code && exit 0
          git commit -m 'style: format agent contract audit'
          git push origin HEAD:audit/agent-facing-contracts
