name: import-sort-once
on:
  push:
    branches: [fix-ci-baseline]
permissions:
  contents: write
jobs:
  sort:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.16.2
      - run: ruff check src/ai_layer/skills/manager.py --select I --fix
      - run: ruff format src/ai_layer/skills/manager.py
      - run: ruff check .
      - name: Commit import sort
        run: |
          rm .github/workflows/import-sort-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "sort remaining baseline imports"
          git push origin HEAD:fix-ci-baseline
