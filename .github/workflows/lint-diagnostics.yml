name: lint-diagnostics
on:
  push:
    branches: [fix-ci-baseline]
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.16.2
      - run: ruff check . --output-format=concise || true
