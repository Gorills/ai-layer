name: lint-fix-once
on:
  push:
    branches: [fix-ci-baseline]
permissions:
  contents: write
jobs:
  lint-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.16.2
      - run: ruff check . --fix
      - run: ruff format .
      - name: Commit safe lint fixes
        run: |
          rm .github/workflows/lint-fix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "apply safe ruff lint fixes"
          git push origin HEAD:fix-ci-baseline
