name: mypy-diagnostics
on:
  push:
    branches: [fix-ci-baseline]
jobs:
  mypy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: mypy src/ai_layer --no-error-summary --show-error-codes || true
