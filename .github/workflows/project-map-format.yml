name: project-map-format-once

on:
  push:
    branches:
      - feature/project-map-enrichment
    paths:
      - .github/workflows/project-map-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/project-map-enrichment
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.16.2
      - name: Format Project Map changes
        run: |
          ruff format \
            alembic/versions/0016_project_map_semantics.py \
            src/ai_layer/db/navigation_models.py \
            src/ai_layer/memory/navigation.py \
            src/ai_layer/memory/project_map_semantics.py \
            src/ai_layer/application/project_intelligence.py \
            src/ai_layer/application/epic_execution.py \
            src/ai_layer/application/epic_navigation.py \
            src/ai_layer/application/tasks.py \
            src/ai_layer/application/transport.py \
            src/ai_layer/mcp/tools/project_context.py \
            src/ai_layer/mcp/server.py \
            src/ai_layer/core/mcp_runtime.py \
            src/ai_layer/projections/dashboard_intelligence.py \
            tests/test_project_map_semantics.py \
            tests/test_project_map_semantics_postgres.py \
            tests/test_project_map_epic_contract.py \
            tests/test_project_intelligence_control_plane.py
      - name: Commit formatting only
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            alembic/versions/0016_project_map_semantics.py \
            src/ai_layer/db/navigation_models.py \
            src/ai_layer/memory/navigation.py \
            src/ai_layer/memory/project_map_semantics.py \
            src/ai_layer/application/project_intelligence.py \
            src/ai_layer/application/epic_execution.py \
            src/ai_layer/application/epic_navigation.py \
            src/ai_layer/application/tasks.py \
            src/ai_layer/application/transport.py \
            src/ai_layer/mcp/tools/project_context.py \
            src/ai_layer/mcp/server.py \
            src/ai_layer/core/mcp_runtime.py \
            src/ai_layer/projections/dashboard_intelligence.py \
            tests/test_project_map_semantics.py \
            tests/test_project_map_semantics_postgres.py \
            tests/test_project_map_epic_contract.py \
            tests/test_project_intelligence_control_plane.py
          git commit -m "style(project-map): apply canonical Ruff formatting"
          git push origin HEAD:feature/project-map-enrichment
