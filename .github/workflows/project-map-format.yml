name: project-map-hardening-once

on:
  push:
    branches:
      - feature/project-map-enrichment
    paths:
      - .github/workflows/project-map-format.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/project-map-enrichment
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.16.2
      - name: Tighten reconciliation evidence
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected source fragment missing: {path}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace(
              "src/ai_layer/memory/project_map_semantics.py",
              '''    if task is None:\n        raise ValueError(f"project_map_reconcile: task `{rendered}` does not exist in this project")\n    return task, f"T-{int(task.sequence):04d}"\n''',
              '''    if task is None:\n        raise ValueError(f"project_map_reconcile: task `{rendered}` does not exist in this project")\n    if task.status != "completed":\n        raise ValueError(\n            f"project_map_reconcile: task `{rendered}` must be completed before semantic map reconciliation"\n        )\n    return task, f"T-{int(task.sequence):04d}"\n''',
          )
          replace(
              "src/ai_layer/memory/project_map_semantics.py",
              '''    task, source_ref = _task_for_key(db, project, source_task_key)\n    for item in normalized:\n''',
              '''    task, source_ref = _task_for_key(db, project, source_task_key)\n    if task is not None and not scope:\n        raise ValueError(\n            "project_map_reconcile: task-linked reconciliation must identify at least one checked scope path"\n        )\n    for item in normalized:\n''',
          )
          replace(
              "src/ai_layer/application/epic_navigation.py",
              '''    map_event = _latest_task_event(db, task, "ProjectMapReconciled")\n    map_payload = dict(map_event.payload or {}) if map_event else {}\n    return {\n        "docs_updated": docs_updated,\n        "knowledge_published": published,\n        "project_map_reconciled": map_event is not None,\n        "project_map_updated": int(map_payload.get("updated") or 0),\n        "project_map_removed": int(map_payload.get("removed") or 0),\n        "project_map_scope_paths": list(map_payload.get("scope_paths") or [])[:120],\n''',
              '''    map_event = _latest_task_event(db, task, "ProjectMapReconciled")\n    map_payload = dict(map_event.payload or {}) if map_event else {}\n    map_scope_paths = list(map_payload.get("scope_paths") or [])[:120]\n    return {\n        "docs_updated": docs_updated,\n        "knowledge_published": published,\n        "project_map_reconciled": map_event is not None and bool(map_scope_paths),\n        "project_map_updated": int(map_payload.get("updated") or 0),\n        "project_map_removed": int(map_payload.get("removed") or 0),\n        "project_map_scope_paths": map_scope_paths,\n''',
          )
          replace(
              "tests/test_project_map_semantics_postgres.py",
              '''        stale_hits = search_semantic_map(db, project, "повторная отправка заказа", limit=8)\n        assert stale_hits[0]["semantic"]["freshness"] == "stale"\n        db.rollback()\n\n    with Session(engine) as db:\n        if project_id is not None:\n            # rollback above keeps this id absent; this assertion protects test isolation assumptions.\n            assert db.get(ProjectNavigationSemantic, project_id) is None\n''',
              '''        stale_hits = search_semantic_map(db, project, "повторная отправка заказа", limit=8)\n        assert stale_hits[0]["semantic"]["freshness"] == "stale"\n        db.rollback()\n''',
          )
          replace(
              "tests/test_project_map_semantics_postgres.py",
              "from ai_layer.db.navigation_models import ProjectNavigation, ProjectNavigationSemantic\n",
              "from ai_layer.db.navigation_models import ProjectNavigation\n",
          )
          replace(
              "tests/test_project_map_semantics_postgres.py",
              "    project_id = None\n",
              "",
          )
          replace(
              "tests/test_project_map_semantics_postgres.py",
              "        project_id = project.id\n",
              "",
          )
          PY
          ruff format \
            src/ai_layer/memory/project_map_semantics.py \
            src/ai_layer/application/epic_navigation.py \
            tests/test_project_map_semantics_postgres.py
      - name: Commit hardening
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/ai_layer/memory/project_map_semantics.py \
            src/ai_layer/application/epic_navigation.py \
            tests/test_project_map_semantics_postgres.py
          git commit -m "fix(project-map): require completed scoped task evidence"
          git push origin HEAD:feature/project-map-enrichment
