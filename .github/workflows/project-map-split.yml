name: project-map-split-once

on:
  push:
    branches:
      - feature/project-map-enrichment
    paths:
      - .github/workflows/project-map-split.yml

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/project-map-enrichment
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.16.2
      - name: Split semantic write and search modules
        run: |
          python - <<'PY'
          from pathlib import Path

          semantic_path = Path("src/ai_layer/memory/project_map_semantics.py")
          semantic = semantic_path.read_text(encoding="utf-8")
          marker = "\ndef _lexical_score("
          if marker not in semantic:
              raise SystemExit("semantic search split marker missing")
          semantic_path.write_text(semantic.split(marker, 1)[0].rstrip() + "\n", encoding="utf-8")

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected source fragment missing: {path}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace(
              "src/ai_layer/application/project_intelligence.py",
              '''from ai_layer.memory.project_map_semantics import (\n    merge_project_search,\n    reconcile_project_map,\n    search_semantic_map,\n    semantic_map_status,\n)\n''',
              '''from ai_layer.memory.project_map_search import merge_project_search, search_semantic_map\nfrom ai_layer.memory.project_map_semantics import reconcile_project_map, semantic_map_status\n''',
          )
          replace(
              "tests/test_project_map_semantics.py",
              '''from ai_layer.memory.navigation import _semantic_scores\nfrom ai_layer.memory.project_map_semantics import _normalize_entry, merge_project_search\n''',
              '''from ai_layer.memory.navigation import _semantic_scores\nfrom ai_layer.memory.project_map_search import merge_project_search\nfrom ai_layer.memory.project_map_semantics import _normalize_entry\n''',
          )
          replace(
              "tests/test_project_map_semantics_postgres.py",
              '''from ai_layer.memory.project_map_semantics import (\n    reconcile_project_map,\n    search_semantic_map,\n    semantic_map_status,\n)\n''',
              '''from ai_layer.memory.project_map_search import search_semantic_map\nfrom ai_layer.memory.project_map_semantics import reconcile_project_map, semantic_map_status\n''',
          )
          PY
          ruff format \
            src/ai_layer/memory/project_map_semantics.py \
            src/ai_layer/memory/project_map_search.py \
            src/ai_layer/application/project_intelligence.py \
            tests/test_project_map_semantics.py \
            tests/test_project_map_semantics_postgres.py
      - name: Commit architectural split
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/ai_layer/memory/project_map_semantics.py \
            src/ai_layer/memory/project_map_search.py \
            src/ai_layer/application/project_intelligence.py \
            tests/test_project_map_semantics.py \
            tests/test_project_map_semantics_postgres.py
          git commit -m "refactor(project-map): separate semantic write and search paths"
          git push origin HEAD:feature/project-map-enrichment
