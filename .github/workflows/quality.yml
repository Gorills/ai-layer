name: canonical-quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: make quality

  postgres-hardening:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16@sha256:a132765ec351c65111b5b675928a3a0515a466a40f97277329db8b8209ad8bc9
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_layer_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AI_LAYER_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/ai_layer_gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: make postgres-gate

  patch-source:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reviewed source corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement, got {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/ai_layer/work/service.py",
              "from uuid import UUID\n\n",
              "",
          )
          replace_once(
              "src/ai_layer/application/work.py",
              '''            "attention": [\n                item\n                for item in active\n                if item.get("status") == "blocked" or item.get("map_pending")\n            ],\n''',
              '''            "attention": [\n                *[item for item in active if item.get("status") == "blocked"],\n                *[\n                    item\n                    for item in recent\n                    if (item.get("map_disposition") or {}).get("status")\n                    in {"pending", "deferred"}\n                ],\n            ],\n''',
          )
          replace_once(
              "src/ai_layer/cli/commands/operations.py",
              '"workflow": "AI Layer MCP is mandatory for registered-project engineering tasks.",',
              '"workflow": "AI Layer supplies Project Intelligence and durable work state; execution remains host-native.",',
          )
          PY
      - run: python -m pip install ruff==0.16.2
      - run: ruff format src/ai_layer/work/service.py src/ai_layer/application/work.py src/ai_layer/cli/commands/operations.py
      - name: Commit reviewed corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/ai_layer/work/service.py \
            src/ai_layer/application/work.py \
            src/ai_layer/cli/commands/operations.py
          if ! git diff --cached --quiet; then
            git commit -m "fix: align work attention and host-native guidance"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
