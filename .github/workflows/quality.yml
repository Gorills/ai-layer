name: canonical-quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: make quality

  postgres-hardening:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16@sha256:a132765ec351c65111b5b675928a3a0515a466a40f97277329db8b8209ad8bc9
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_layer_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AI_LAYER_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/ai_layer_gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: make postgres-gate

  dashboard-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]' playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - name: Run Dashboard browser acceptance
        env:
          AI_LAYER_BROWSER_TESTS: '1'
        run: pytest -q tests/test_dashboard_browser.py

  postmerge-review-fix-publish:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reviewed Phase 3 fixes and restore canonical workflow
        run: |
          git fetch --no-tags --depth=1 origin p3-postmerge-review-fixes
          git checkout -B p3-postmerge-review-fixes FETCH_HEAD
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          engine_path = Path('src/ai_layer/application/action_engine.py')
          source = engine_path.read_text(encoding='utf-8')

          old = '''def _safe_dirty_worktree(project: Project) -> bool:\n    try:\n        changes = git_changed_paths(Path(project.root_path).expanduser().resolve())\n    except RuntimeError:\n        return False\n    return bool(int(changes.get("total") or 0))\n'''
          new = '''def _safe_dirty_worktree(project: Project) -> bool:\n    try:\n        changes = git_changed_paths(Path(project.root_path).expanduser().resolve())\n    except RuntimeError as exc:\n        _protocol_error(\n            "REPOSITORY_STATE_UNAVAILABLE",\n            "cannot safely choose clean vs dirty assurance promotion while Git state is unavailable",\n        )\n    return bool(int(changes.get("total") or 0))\n'''
          assert source.count(old) == 1
          source = source.replace(old, new, 1)

          old = '''def _recover_unbound_open_task(db: Session, project: Project, work: WorkItem) -> Task | None:\n    task = _open_project_task(db, project)\n    if task is None:\n        return None\n    binding = task_work_binding(db, task)\n    if binding is not None:\n        return task if binding.work.id == work.id and binding.role == "outcome" else None\n    if str(task.goal).strip() != str(work.goal).strip():\n        return None\n    bind_task_work(db, project, task, work, role="outcome")\n    db.commit()\n    return task\n'''
          new = '''def _recover_claimed_unbound_open_task(\n    db: Session, project: Project, work: WorkItem\n) -> Task | None:\n    """Recover only an orphan Task proven to belong to this Work by a durable submission."""\n    task = _open_project_task(db, project)\n    if task is None:\n        return None\n    binding = task_work_binding(db, task)\n    if binding is not None:\n        return task if binding.work.id == work.id and binding.role == "outcome" else None\n    if str(task.goal).strip() != str(work.goal).strip():\n        return None\n    bind_task_work(db, project, task, work, role="outcome")\n    db.commit()\n    return task\n'''
          assert source.count(old) == 1
          source = source.replace(old, new, 1)

          old = '''    open_task = _open_project_task(db, project)\n    if open_task is not None:\n        recovered = _recover_unbound_open_task(db, project, work)\n        if recovered is None:\n            _protocol_error(\n                "OPEN_MANAGED_TASK_CONFLICT",\n                "another managed Task is already open for this project",\n            )\n        return current_action(db, project, work)\n'''
          new = '''    open_task = _open_project_task(db, project)\n    if open_task is not None:\n        binding = task_work_binding(db, open_task)\n        if (\n            binding is None\n            or binding.work.id != work.id\n            or binding.role != "outcome"\n        ):\n            _protocol_error(\n                "OPEN_MANAGED_TASK_CONFLICT",\n                "another managed Task is already open for this project",\n            )\n        return current_action(db, project, work)\n'''
          assert source.count(old) == 1
          source = source.replace(old, new, 1)

          old = '''    task = _latest_outcome_task(db, work)\n    if task is None:\n        task = _recover_unbound_open_task(db, project, work)\n    if task is not None and int(task.version or 1) != int(submission.state_version):\n        response = current_action(db, project, work)\n        return _complete_submission(db, submission, response)\n'''
          new = '''    task = _latest_outcome_task(db, work)\n    if task is None:\n        recovered = _recover_claimed_unbound_open_task(db, project, work)\n        if recovered is not None:\n            response = current_action(db, project, work)\n            return _complete_submission(db, submission, response)\n        task = None\n    if task is not None and int(task.version or 1) != int(submission.state_version):\n        response = current_action(db, project, work)\n        return _complete_submission(db, submission, response)\n'''
          assert source.count(old) == 1
          source = source.replace(old, new, 1)
          engine_path.write_text(source, encoding='utf-8')

          test_path = Path('tests/test_phase3_action_engine.py')
          tests = test_path.read_text(encoding='utf-8')
          import_anchor = 'from ai_layer.db.work_relation_models import TaskWorkRelation\n'
          assert tests.count(import_anchor) == 1
          tests = tests.replace(
              import_anchor,
              import_anchor + 'from ai_layer.tasks.service import create_task\n',
              1,
          )
          appendix = r'''


def test_promotion_fails_closed_when_git_state_is_unavailable(
    tmp_path: Path, monkeypatch: pytest.MonkeyPatch
) -> None:
    engine, project_id, _root = _engine_project(tmp_path)
    db, project = _rows(engine, project_id)
    try:
        work, _run = _native_work(db, project)
        initial = current_action(db, project, work)
        token = initial["next_action"]["action_token"]

        def unavailable(_root: Path) -> dict:
            raise RuntimeError("git state unavailable")

        monkeypatch.setattr(
            "ai_layer.application.action_engine.git_changed_paths",
            unavailable,
        )
        with pytest.raises(ActionProtocolError, match="REPOSITORY_STATE_UNAVAILABLE"):
            continue_action(
                db,
                action_token=token,
                report={
                    "kind": "assurance_request",
                    "summary": "Require reviewed assurance",
                    "outcome": "escalate",
                },
            )

        assert db.scalar(select(func.count()).select_from(Task)) == 0
        state = db.get(WorkActionState, work.id)
        assert state is not None and state.action_token == token
        assert db.scalar(select(func.count()).select_from(WorkActionSubmission)) == 0
    finally:
        db.close()


def test_unbound_same_goal_task_is_not_silently_claimed_by_work(tmp_path: Path) -> None:
    engine, project_id, _root = _engine_project(tmp_path)
    db, project = _rows(engine, project_id)
    try:
        work, _run = _native_work(db, project, goal="Repeated goal")
        create_task(
            db,
            project,
            goal="Repeated goal",
            acceptance_criteria=[],
            constraints=[],
            workflow="standard",
        )
        with pytest.raises(ActionProtocolError, match="OPEN_MANAGED_TASK_CONFLICT"):
            attach_reviewed_assurance(db, project, work)
        assert db.scalar(select(func.count()).select_from(TaskWorkRelation)) == 0
    finally:
        db.close()


def test_claimed_native_promotion_recovers_crash_between_task_create_and_binding(
    tmp_path: Path, monkeypatch: pytest.MonkeyPatch
) -> None:
    import ai_layer.application.action_engine as action_engine

    engine, project_id, _root = _engine_project(tmp_path)
    db, project = _rows(engine, project_id)
    work, _run = _native_work(db, project, goal="Crash-safe promotion")
    work_id = work.id
    initial = current_action(db, project, work)
    token = initial["next_action"]["action_token"]
    report = {
        "kind": "assurance_request",
        "summary": "Require reviewed assurance",
        "outcome": "escalate",
    }
    original_bind = action_engine.bind_task_work
    crashed = False

    def crash_once(*args, **kwargs):
        nonlocal crashed
        if not crashed:
            crashed = True
            raise SystemExit("simulated process crash after Task creation")
        return original_bind(*args, **kwargs)

    monkeypatch.setattr(action_engine, "bind_task_work", crash_once)
    with pytest.raises(SystemExit, match="simulated process crash"):
        continue_action(db, action_token=token, report=report)
    db.close()

    monkeypatch.setattr(action_engine, "bind_task_work", original_bind)
    db2, project2 = _rows(engine, project_id)
    try:
        recovered = continue_action(db2, action_token=token, report=report)
        assert recovered["next_action"]["kind"] == "run_worker"
        relation = db2.scalar(
            select(TaskWorkRelation).where(TaskWorkRelation.work_id == work_id)
        )
        assert relation is not None and relation.role == "outcome"
        submission = db2.scalar(
            select(WorkActionSubmission).where(WorkActionSubmission.action_token == token)
        )
        assert submission is not None and submission.status == "completed"
    finally:
        db2.close()
'''
          assert 'test_promotion_fails_closed_when_git_state_is_unavailable' not in tests
          test_path.write_text(tests.rstrip() + appendix + '\n', encoding='utf-8')

          manifest_path = Path('release/release-manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          import subprocess
          subprocess.run(['python', 'scripts/build_release_wheel.py'], check=True)
          wheel = Path(manifest['application_wheel'])
          manifest['application_wheel_sha256'] = hashlib.sha256(wheel.read_bytes()).hexdigest()
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY
          git fetch --no-tags --depth=1 origin redesign/agent-native-workflow
          git checkout FETCH_HEAD -- .github/workflows/quality.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/ai_layer/application/action_engine.py tests/test_phase3_action_engine.py dist/local_ai_development_layer-0.14.0-py3-none-any.whl release/release-manifest.json .github/workflows/quality.yml
          git commit -m "Harden Phase 3 promotion recovery"
          git push origin HEAD:p3-postmerge-review-fixes
