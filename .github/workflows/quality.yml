name: canonical-quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Apply Phase 2 compatibility fixes and refresh wheel
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags origin "+refs/heads/$HEAD_REF:refs/remotes/origin/$HEAD_REF"
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          git checkout -B "$HEAD_REF" "origin/$HEAD_REF"
          python - <<'PY'
          from pathlib import Path

          def replace_one(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected one exact replacement, found {text.count(old)}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_one(
              "tests/test_activity_task_epic_filters.py",
              '        assert [item["event_type"] for item in payload["items"]] == ["EpicCreated"]\n        assert payload["items"][0]["epic_id"] == str(epic_id)\n',
              '        assert [item["event_type"] for item in payload["items"]] == [\n            "EpicCreated",\n            "WorkStarted",\n        ]\n        assert {item["epic_id"] for item in payload["items"]} == {str(epic_id)}\n',
          )
          replace_one(
              "tests/test_agent_facing_contracts.py",
              '    assert manifest["migration_compatibility"]["target_schema"] == "0018_command_project_scope"\n',
              '    assert manifest["migration_compatibility"]["target_schema"] == "0019_canonical_work_relations"\n',
          )
          replace_one(
              "tests/test_phase2_work_relations.py",
              "from pathlib import Path\n",
              "from pathlib import Path\nfrom uuid import UUID\n",
          )
          replace_one(
              "tests/test_phase2_work_relations.py",
              '        relation = db.get(TaskWorkRelation, created["id"])\n',
              '        relation = db.get(TaskWorkRelation, UUID(created["id"]))\n',
          )
          replace_one(
              "tests/test_phase2_work_relation_migration.py",
              "from uuid import uuid4\n",
              "from uuid import UUID, uuid4\n",
          )
          replace_one(
              "tests/test_phase2_work_relation_migration.py",
              'def _legacy_schema(metadata: sa.MetaData) -> dict[str, sa.Table]:\n',
              'def _uuid(value: object) -> UUID:\n    return value if isinstance(value, UUID) else UUID(str(value))\n\n\ndef _legacy_schema(metadata: sa.MetaData) -> dict[str, sa.Table]:\n',
          )
          replace_one(
              "tests/test_phase2_work_relation_migration.py",
              '        task_rows = connection.execute(\n            sa.select(task_rel.c.task_id, task_rel.c.work_id, task_rel.c.role)\n        ).all()\n        assert task_rows == [(resolved_task, resolved_work, "outcome")]\n        assert connection.execute(sa.select(epic_rel.c.epic_id)).all() == []\n        assert connection.execute(sa.select(plan_rel.c.plan_item_id, plan_rel.c.work_id)).all() == [\n            (plan_item_id, resolved_work)\n        ]\n\n        statuses = {\n            (owner_type, owner_id): (status, candidate_count)\n',
              '        task_rows = [\n            (_uuid(task_id), _uuid(work_id), role)\n            for task_id, work_id, role in connection.execute(\n                sa.select(task_rel.c.task_id, task_rel.c.work_id, task_rel.c.role)\n            ).all()\n        ]\n        assert task_rows == [(resolved_task, resolved_work, "outcome")]\n        assert connection.execute(sa.select(epic_rel.c.epic_id)).all() == []\n        plan_rows = [\n            (_uuid(item_id), _uuid(work_id))\n            for item_id, work_id in connection.execute(\n                sa.select(plan_rel.c.plan_item_id, plan_rel.c.work_id)\n            ).all()\n        ]\n        assert plan_rows == [(plan_item_id, resolved_work)]\n\n        statuses = {\n            (owner_type, _uuid(owner_id)): (status, candidate_count)\n',
          )
          PY
          ruff format \
            tests/test_activity_task_epic_filters.py \
            tests/test_agent_facing_contracts.py \
            tests/test_phase2_work_relation_migration.py \
            tests/test_phase2_work_relations.py
          python scripts/build_release_wheel.py
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest_path = Path("release/release-manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          wheel = Path(manifest["application_wheel"])
          manifest["application_wheel_sha256"] = hashlib.sha256(wheel.read_bytes()).hexdigest()
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print(manifest["application_wheel_sha256"])
          PY
          git checkout "origin/$BASE_REF" -- .github/workflows/quality.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/quality.yml \
            tests/test_activity_task_epic_filters.py \
            tests/test_agent_facing_contracts.py \
            tests/test_phase2_work_relation_migration.py \
            tests/test_phase2_work_relations.py \
            dist/local_ai_development_layer-0.14.0-py3-none-any.whl \
            release/release-manifest.json
          git commit -m "Fix Phase 2 compatibility and refresh wheel"
          git push origin HEAD:"$HEAD_REF"
      - run: make quality

  postgres-hardening:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16@sha256:a132765ec351c65111b5b675928a3a0515a466a40f97277329db8b8209ad8bc9
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_layer_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AI_LAYER_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/ai_layer_gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: make postgres-gate

  dashboard-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]' playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - name: Run Dashboard browser acceptance
        env:
          AI_LAYER_BROWSER_TESTS: '1'
        run: pytest -q tests/test_dashboard_browser.py
