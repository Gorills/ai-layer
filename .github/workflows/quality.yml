name: canonical-quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: make quality

  postgres-hardening:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16@sha256:a132765ec351c65111b5b675928a3a0515a466a40f97277329db8b8209ad8bc9
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_layer_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AI_LAYER_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/ai_layer_gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: make postgres-gate

  patch-source-and-release-docs:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reviewed semantic and release-doc corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          service = Path("src/ai_layer/work/service.py")
          text = service.read_text(encoding="utf-8")
          bad = "    work.updated_at = now,\n"
          if text.count(bad) != 1:
              raise SystemExit(f"expected one tuple-assignment defect, got {text.count(bad)}")
          service.write_text(text.replace(bad, "    work.updated_at = now\n", 1), encoding="utf-8")

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          text = text.replace(
              "- **durable work state** — Tasks, stages, findings and Epics that can be resumed later;",
              "- **durable work state** — ordinary WorkItems/AgentRuns plus optional managed Tasks/Epics that can be resumed later;",
              1,
          )
          text = text.replace("Current package version: **0.13.3**.", "Current package version: **0.14.0**.", 1)
          old = '''1. call `project_status(project_root=<workspace root>)`;\n2. if the project already has managed work in progress, use its `current_focus` to interpret requests such as **“continue”**;\n3. if a precise file or symbol is already known, inspect current source directly with host-native tools;\n4. if the relevant code location is unknown, call `project_search(query=<actual user goal>)` before broad repository discovery;\n5. use `knowledge_search` and `decision_search` only when durable facts or prior decisions materially help the task;\n6. execute normally through the host runtime;\n7. use `task_next` / `epic_next` when resuming or explicitly choosing a managed workflow.\n8. after meaningful work, call `project_map_reconcile` only for navigation facts actually established from the inspected/affected scope; trivial work may skip it.\n'''
          new = '''1. call `project_status(project_root=<workspace root>)` and apply its bounded `project_policy`;\n2. use `work.current_focus` / `work.continuation` to resume observed ordinary Work or managed Task/Epic state;\n3. for a new substantive ordinary request call `work_begin`; short work normally needs only one terminal Work call after execution;\n4. if a precise file or symbol is already known, inspect current source directly with host-native tools;\n5. if code location is unknown, use `project_search` with a concise English code-centric primary query for non-English intent, preserving exact repository identifiers and optionally one original/mixed widening variant;\n6. use `knowledge_search` and `decision_search` only when durable facts or prior decisions materially help the task;\n7. execute normally through the host runtime;\n8. use `task_next` / `epic_next` only when resuming or explicitly choosing a managed assurance workflow;\n9. reconcile Project Map only for navigation facts actually established from inspected/affected scope.\n'''
          if old not in text:
              raise SystemExit("README operating-model block drifted")
          readme.write_text(text.replace(old, new, 1), encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          marker = "# Changelog\n\n"
          if not text.startswith(marker):
              raise SystemExit("CHANGELOG header drifted")
          entry = '''## 0.14.0 — Durable Work spine and truthful observability\n\n- Added first-class `WorkItem` and `AgentRun` lifecycle for ordinary host-native user work while keeping managed Tasks/Epics as optional stricter assurance. Multiple WorkItems may coexist per project; the managed Task single-open constraint does not leak into ordinary work.\n- Added idempotent `work_begin`, milestone `work_checkpoint`, and terminal Work MCP commands backed by the existing `CommandReceipt`/advisory-lock boundary.\n- Added additive schema `0017_work_spine` with durable Work/AgentRun records plus `runtime_event_context` correlation for Work/Run/Task/Epic and host/session/model identity.\n- Made `RuntimeEvent` the durable human activity journal and kept JSONL/context trace diagnostic-only; common MCP execution now records safe terminal operation evidence without copying raw prompt/source bodies.\n- Made Dashboard project state truthful: live ordinary work requires a non-stale AgentRun; managed Task state and MCP bridge traffic are displayed separately and no longer prove that user work is currently executing.\n- Added bounded effective project policy to `project_status` with version/hash and corrected the repository bootstrap to the canonical root `DECISIONS/` ADR directory.\n- Published Search Contract v2: non-English intent uses a concise English code-centric primary Project Map query, preserves exact identifiers, allows at most one original/mixed widening variant, and requires current-source verification.\n- Added unit and real PostgreSQL regression coverage for Work concurrency/idempotency, event correlation, safe activity presentation, project policy, multilingual search fusion and truthful Dashboard state.\n\n'''
          if "## 0.14.0 —" not in text:
              text = marker + entry + text[len(marker):]
          changelog.write_text(text, encoding="utf-8")
          PY
      - run: python -m pip install ruff==0.16.2
      - run: ruff format src/ai_layer/work/service.py
      - name: Commit reviewed corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/ai_layer/work/service.py README.md CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "fix: correct work timestamp and document v0.14"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
