name: canonical-quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: make quality

  postgres-hardening:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16@sha256:a132765ec351c65111b5b675928a3a0515a466a40f97277329db8b8209ad8bc9
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_layer_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AI_LAYER_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/ai_layer_gate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Generate Phase 0 baseline evidence
        if: github.event_name == 'pull_request'
        run: python scripts/agent_native_baseline.py
      - name: Commit Phase 0 baseline evidence
        if: github.event_name == 'pull_request'
        run: |
          git add docs/evidence/0.14.0-agent-native-phase0-baseline.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh agent-native Phase 0 baseline evidence'
          git push origin HEAD:${{ github.head_ref }}
      - run: make postgres-gate

  dashboard-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]' playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - name: Run Dashboard browser acceptance
        env:
          AI_LAYER_BROWSER_TESTS: '1'
        run: pytest -q tests/test_dashboard_browser.py
