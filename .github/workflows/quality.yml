name: canonical-quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Apply NoReturn typing fix and restore canonical workflow
        run: |
          git fetch --no-tags --depth=1 origin p3-server-owned-actions
          git checkout -B p3-server-owned-actions FETCH_HEAD
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          source = Path("src/ai_layer/application/action_engine.py")
          text = source.read_text(encoding="utf-8")
          text = text.replace("from typing import Any\n", "from typing import Any, NoReturn\n")
          text = text.replace(
              "def _protocol_error(code: str, message: str) -> None:\n",
              "def _protocol_error(code: str, message: str) -> NoReturn:\n",
          )
          source.write_text(text, encoding="utf-8")
          PY
          ruff format src/ai_layer/application/action_engine.py
          python scripts/build_release_wheel.py
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest_path = Path("release/release-manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          wheel = Path(manifest["application_wheel"])
          manifest["application_wheel_sha256"] = hashlib.sha256(wheel.read_bytes()).hexdigest()
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY
          cat > .github/workflows/quality.yml <<'YAML'
          name: canonical-quality
          on:
            pull_request:
            push:
              branches: [main]
          permissions:
            contents: read
          jobs:
            quality:
              runs-on: ubuntu-24.04
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: '3.12'
                - run: python -m pip install --upgrade pip
                - run: python -m pip install -e '.[dev]'
                - run: make quality

            postgres-hardening:
              runs-on: ubuntu-24.04
              services:
                postgres:
                  image: pgvector/pgvector:0.8.0-pg16@sha256:a132765ec351c65111b5b675928a3a0515a466a40f97277329db8b8209ad8bc9
                  env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: ai_layer_gate
                  ports:
                    - 5432:5432
                  options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 20
              env:
                AI_LAYER_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/ai_layer_gate
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: '3.12'
                - run: python -m pip install --upgrade pip
                - run: python -m pip install -e '.[dev]'
                - run: make postgres-gate

            dashboard-browser:
              runs-on: ubuntu-24.04
              timeout-minutes: 15
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: '3.12'
                - run: python -m pip install --upgrade pip
                - run: python -m pip install -e '.[dev]' playwright==1.55.0
                - run: python -m playwright install --with-deps chromium
                - name: Run Dashboard browser acceptance
                  env:
                    AI_LAYER_BROWSER_TESTS: '1'
                  run: pytest -q tests/test_dashboard_browser.py
          YAML
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ai_layer/application/action_engine.py release/release-manifest.json dist/local_ai_development_layer-0.14.0-py3-none-any.whl .github/workflows/quality.yml
          git commit -m "Fix action protocol typing and rebuild release wheel"
          git push origin HEAD:p3-server-owned-actions
