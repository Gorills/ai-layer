name: canonical-quality
on:
  pull_request:
permissions:
  contents: write
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Extract Phase 3 action-state seam
        env:
          CANONICAL_B64: 
        run: |
          git fetch --no-tags --depth=1 origin p3-server-owned-actions
          git checkout -B p3-server-owned-actions FETCH_HEAD
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          restore_only() {
            set +e
            git reset --hard HEAD
            python -c 'import base64, os; from pathlib import Path; Path(".github/workflows/quality.yml").write_bytes(base64.b64decode(os.environ["CANONICAL_B64"]))'
            git add .github/workflows/quality.yml
            git commit -m "Restore canonical quality workflow after refactor failure" || true
            git push origin HEAD:p3-server-owned-actions || true
          }
          trap restore_only ERR
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path("src/ai_layer/application/action_engine.py")
          text = path.read_text(encoding="utf-8")
          lines = text.splitlines(keepends=True)
          tree = ast.parse(text)
          move_names = {
              "ActionProtocolError", "_protocol_error", "_canonical_json", "report_fingerprint",
              "action_token_shape_valid", "_new_action_token", "_project_key", "_public_assurance",
              "_public_work", "_state_response", "_finished_response", "_worker_kind",
              "_public_result_contract", "_public_worker_packet", "_state_binding_matches",
              "_upsert_action_state", "action_debug_snapshot",
          }
          nodes = [node for node in tree.body if isinstance(node, (ast.FunctionDef, ast.ClassDef)) and node.name in move_names]
          found = {node.name for node in nodes}
          if found != move_names:
              raise SystemExit(f"action-state extraction mismatch: {sorted(move_names - found)}")
          segments = ["".join(lines[node.lineno - 1:node.end_lineno]) for node in nodes]
          header = """from __future__ import annotations

import hashlib
import json
import re
import secrets
from collections.abc import Mapping
from typing import Any, NoReturn

from sqlalchemy import select
from sqlalchemy.orm import Session

from ai_layer.db.action_models import WorkActionState
from ai_layer.db.models import Project, Task, TaskStage, utcnow
from ai_layer.db.work_models import WorkItem
from ai_layer.db.work_relation_models import TaskWorkRelation
from ai_layer.tasks.delegation_contract import worker_job_packet
from ai_layer.work.service import work_key, work_to_dict

CONTRACT_VERSION = 1
TOKEN_VERSION = "act1"
_TOKEN_RE = re.compile(r"^act1_[A-Za-z0-9_-]{43}$")

"""
          Path("src/ai_layer/application/action_state.py").write_text(header + "\n\n".join(segment.rstrip() for segment in segments) + "\n", encoding="utf-8")
          removed = set()
          for node in nodes:
              removed.update(range(node.lineno, node.end_lineno + 1))
          engine = "".join(line for number, line in enumerate(lines, 1) if number not in removed)
          engine = engine.replace("import hashlib\n", "").replace("import json\n", "").replace("import re\n", "")
          engine = engine.replace("from typing import Any, NoReturn\n", "from typing import Any\n")
          engine = engine.replace("from ai_layer.tasks.delegation_contract import worker_job_packet\n", "")
          engine = engine.replace("from ai_layer.work.service import finish_work, work_key, work_to_dict\n", "from ai_layer.work.service import finish_work, work_key\n")
          engine = engine.replace('CONTRACT_VERSION = 1\nTOKEN_VERSION = "act1"\n_TOKEN_RE = re.compile(r"^act1_[A-Za-z0-9_-]{43}$")\n', "")
          anchor = "from ai_layer.application.work_relations import bind_task_work, task_work_binding\n"
          import_block = """from ai_layer.application.action_state import (
    ActionProtocolError,
    _finished_response,
    _protocol_error,
    _public_worker_packet,
    _state_response,
    _upsert_action_state,
    _worker_kind,
    action_debug_snapshot,
    action_token_shape_valid,
    report_fingerprint,
)
"""
          if anchor not in engine:
              raise SystemExit("action-state import anchor missing")
          path.write_text(engine.replace(anchor, import_block + anchor, 1), encoding="utf-8")
          PY
          ruff format src/ai_layer/application/action_engine.py src/ai_layer/application/action_state.py
          ruff check src/ai_layer/application/action_engine.py src/ai_layer/application/action_state.py
          mypy src/ai_layer
          python scripts/architecture_gate.py
          python scripts/build_release_wheel.py
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          manifest_path = Path("release/release-manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          wheel = Path(manifest["application_wheel"])
          manifest["application_wheel_sha256"] = hashlib.sha256(wheel.read_bytes()).hexdigest()
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY
          python -c 'import base64, os; from pathlib import Path; Path(".github/workflows/quality.yml").write_bytes(base64.b64decode(os.environ["CANONICAL_B64"]))'
          trap - ERR
          git add src/ai_layer/application/action_engine.py src/ai_layer/application/action_state.py release/release-manifest.json dist/local_ai_development_layer-0.14.0-py3-none-any.whl .github/workflows/quality.yml
          git commit -m "Extract durable action state seam"
          git push origin HEAD:p3-server-owned-actions
