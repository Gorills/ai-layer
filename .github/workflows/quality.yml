name: canonical-quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply-cursor-field-repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cursor-work-complete-natural-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Apply guarded natural Work lifecycle repair
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one guarded fragment, found {count}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'src/ai_layer/mcp/tool_schema.py',
              '''def _natural_check_status(\n    value: WorkCheckStatus | None, *, result: object, summary: str, command: str | None\n) -> WorkCheckStatus:\n    if value is not None:\n        return value\n    if isinstance(result, bool):\n        return "passed" if result else "failed"\n    if isinstance(result, int):\n        return "passed" if result == 0 else "failed"\n    if result is not None or summary.strip() or command:\n        return "reported"\n    return "not_run"\n''',
              '''def _natural_check_status(\n    value: WorkCheckStatus | None,\n    *,\n    passed: bool | None,\n    result: object,\n    summary: str,\n    command: str | None,\n) -> WorkCheckStatus:\n    if value is not None:\n        return value\n    if passed is not None:\n        return "passed" if passed else "failed"\n    if isinstance(result, bool):\n        return "passed" if result else "failed"\n    if isinstance(result, int):\n        return "passed" if result == 0 else "failed"\n    if result is not None or summary.strip() or command:\n        return "reported"\n    return "not_run"\n''',
          )
          replace_once(
              'src/ai_layer/mcp/tool_schema.py',
              '''    summary: Annotated[str, Field(max_length=500)] = ""\n    command: Annotated[str | None, Field(max_length=2000, exclude=True)] = None\n    result: Annotated[\n        Annotated[str, Field(max_length=4000)] | bool | int | None,\n        Field(exclude=True),\n    ] = None\n\n    @model_validator(mode="after")\n    def normalize_natural_report(self) -> WorkCheckInput:\n        self.name = str(self.name or "").strip() or "reported check"\n        if not self.summary and self.result is not None:\n            self.summary = str(self.result).strip()[:500]\n        self.status = _natural_check_status(\n            self.status, result=self.result, summary=self.summary, command=self.command\n        )\n        return self\n''',
              '''    summary: Annotated[str, Field(max_length=500)] = ""\n    command: Annotated[str | None, Field(max_length=2000, exclude=True)] = None\n    result: Annotated[\n        Annotated[str, Field(max_length=4000)] | bool | int | None,\n        Field(exclude=True),\n    ] = None\n    passed: Annotated[bool | None, Field(exclude=True)] = None\n    details: Annotated[\n        Annotated[str, Field(max_length=4000)] | None,\n        Field(exclude=True),\n    ] = None\n\n    @model_validator(mode="after")\n    def normalize_natural_report(self) -> WorkCheckInput:\n        self.name = str(self.name or "").strip() or "reported check"\n        if not self.summary:\n            detail = self.details if self.details is not None else self.result\n            if detail is not None:\n                self.summary = str(detail).strip()[:500]\n        self.status = _natural_check_status(\n            self.status,\n            passed=self.passed,\n            result=self.result,\n            summary=self.summary,\n            command=self.command,\n        )\n        return self\n''',
          )

          work_tool = Path('src/ai_layer/mcp/tools/work.py')
          text = work_tool.read_text(encoding='utf-8')
          anchor = '\n\ndef work_begin(\n'
          helper = '''\n\ndef _optional_work_key(value: str | None, *, tool: str) -> str | None:\n    rendered = str(value or "").strip()\n    if not rendered:\n        return None\n    return _text(rendered, tool=tool, field="work_key")\n\n\ndef work_begin(\n'''
          if text.count(anchor) != 1:
              raise SystemExit('work.py: work_begin anchor mismatch')
          text = text.replace(anchor, helper, 1)
          replace_pairs = [
              ('def work_checkpoint(\n    work_key: WorkKeyText,\n', 'def work_checkpoint(\n    work_key: WorkKeyText | None = None,\n'),
              ('    work_key = _text(work_key, tool="work_checkpoint", field="work_key")\n', '    work_key = _optional_work_key(work_key, tool="work_checkpoint")\n'),
              ('    work_key: str,\n    summary: str,\n', '    work_key: str | None,\n    summary: str,\n'),
              ('    work_key = _text(work_key, tool=operation, field="work_key")\n', '    work_key = _optional_work_key(work_key, tool=operation)\n'),
          ]
          for old, new in replace_pairs:
              if text.count(old) != 1:
                  raise SystemExit(f'work.py guarded fragment mismatch: {old!r}')
              text = text.replace(old, new, 1)
          for name in ('work_complete', 'work_fail', 'work_interrupt', 'work_abandon'):
              old = f'def {name}(\n    work_key: WorkKeyText,\n'
              new = f'def {name}(\n    work_key: WorkKeyText | None = None,\n'
              if text.count(old) != 1:
                  raise SystemExit(f'work.py: {name} signature mismatch')
              text = text.replace(old, new, 1)
          text = text.replace(
              '"""WHEN: a long work phase reaches a meaningful milestone or blocker. Do not checkpoint every file/tool action. checks use bounded name/status/summary metadata, never raw output.',
              '"""WHEN: a long work phase reaches a meaningful milestone or blocker. work_key may be omitted when AI Layer has exactly one active Work. Do not checkpoint every file/tool action. checks use bounded canonical evidence or natural host reports.',
              1,
          )
          text = text.replace(
              'summary is optional: when omitted AI Layer reuses an existing Work summary or derives a truthful terminal summary from the known goal. checks may use canonical name/status/summary or a natural command/result report;',
              'work_key may be omitted when AI Layer has exactly one active Work. summary is optional: when omitted AI Layer reuses an existing Work summary or derives a truthful terminal summary from the known goal. checks may use canonical name/status/summary or natural command/result/passed/details reports;',
              1,
          )
          work_tool.write_text(text, encoding='utf-8')

          service = Path('src/ai_layer/work/service.py')
          text = service.read_text(encoding='utf-8')
          anchor = '''    if row is None:\n        raise ValueError(f"work item {rendered} does not exist in this project")\n    return row\n\n\ndef _task_id'''
          replacement = '''    if row is None:\n        raise ValueError(f"work item {rendered} does not exist in this project")\n    return row\n\n\ndef resolve_work_key(db: Session, project: Project, value: str | None) -> str:\n    rendered = str(value or "").strip()\n    if rendered:\n        return work_key(_work_for_key(db, project, rendered))\n\n    locked_project = db.scalar(\n        select(Project).where(Project.id == project.id).with_for_update()\n    )\n    if locked_project is None:\n        raise ValueError("project no longer exists")\n    rows = list(\n        db.scalars(\n            select(WorkItem)\n            .where(\n                WorkItem.project_id == project.id,\n                WorkItem.status.in_(("active", "blocked")),\n            )\n            .order_by(WorkItem.updated_at.desc(), WorkItem.sequence.desc())\n            .limit(2)\n        ).all()\n    )\n    if len(rows) == 1:\n        return work_key(rows[0])\n    if not rows:\n        raise ValueError("work_key is required because this project has no active Work item")\n    keys = ", ".join(work_key(item) for item in rows)\n    raise ValueError(\n        f"work_key is required because this project has multiple active Work items: {keys}"\n    )\n\n\ndef _task_id'''
          if text.count(anchor) != 1:
              raise SystemExit('service.py: resolve anchor mismatch')
          text = text.replace(anchor, replacement, 1)
          old = '    work_key_value: str,\n    summary: str = "",\n'
          if text.count(old) != 1:
              raise SystemExit('service.py: checkpoint signature mismatch')
          text = text.replace(old, '    work_key_value: str | None,\n    summary: str = "",\n', 1)
          old = '    work = _work_for_key(db, project, work_key_value, lock=True)\n'
          if text.count(old) != 2:
              raise SystemExit(f'service.py: expected two mutable work lookups, found {text.count(old)}')
          text = text.replace(
              old,
              '    resolved_work_key = resolve_work_key(db, project, work_key_value)\n    work = _work_for_key(db, project, resolved_work_key, lock=True)\n',
              1,
          )
          old_sig = '    work_key_value: str,\n    status: str,\n'
          if text.count(old_sig) != 1:
              raise SystemExit('service.py: finish signature mismatch')
          text = text.replace(old_sig, '    work_key_value: str | None,\n    status: str,\n', 1)
          if text.count(old) != 1:
              raise SystemExit('service.py: finish lookup mismatch')
          text = text.replace(
              old,
              '    resolved_work_key = resolve_work_key(db, project, work_key_value)\n    work = _work_for_key(db, project, resolved_work_key, lock=True)\n',
              1,
          )
          service.write_text(text, encoding='utf-8')

          app = Path('src/ai_layer/application/work.py')
          text = app.read_text(encoding='utf-8')
          old = 'def checkpoint(\n    project_root: str | Path,\n    *,\n    work_key: str,\n'
          if text.count(old) != 1:
              raise SystemExit('application/work.py: checkpoint signature mismatch')
          text = text.replace(old, 'def checkpoint(\n    project_root: str | Path,\n    *,\n    work_key: str | None = None,\n', 1)
          old = '    work_key: str,\n    summary: str,\n'
          if text.count(old) != 1:
              raise SystemExit('application/work.py: _finish signature mismatch')
          text = text.replace(old, '    work_key: str | None,\n    summary: str,\n', 1)
          for name in ('complete', 'fail', 'interrupt', 'abandon'):
              old = f'def {name}(\n    project_root: str | Path,\n    *,\n    work_key: str,\n'
              new = f'def {name}(\n    project_root: str | Path,\n    *,\n    work_key: str | None = None,\n'
              if text.count(old) != 1:
                  raise SystemExit(f'application/work.py: {name} signature mismatch')
              text = text.replace(old, new, 1)
          app.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_cursor_field_acceptance.py')
          test = test_path.read_text(encoding='utf-8')
          old = 'from ai_layer.work.service import begin_work, finish_work\n'
          if test.count(old) != 1:
              raise SystemExit('test import mismatch')
          test = test.replace(old, 'from ai_layer.work.service import begin_work, checkpoint_work, finish_work\n', 1)
          old = '            work_key_value="W-0001",\n            status="completed",\n'
          if test.count(old) != 1:
              raise SystemExit('terminal regression key fragment mismatch')
          test = test.replace(old, '            work_key_value=None,\n            status="completed",\n', 1)
          test += '''\n\ndef test_cursor_passed_details_report_normalizes_without_host_contract_knowledge() -> None:\n    schema = WorkCheckInput.model_json_schema()\n    assert {"passed", "details"} <= set(schema["properties"])\n    check = WorkCheckInput(\n        passed=True,\n        details="No new errors in nutrition autocomplete; pre-existing project errors unchanged",\n    )\n    assert wire_value([check]) == [\n        {\n            "name": "reported check",\n            "status": "passed",\n            "summary": (\n                "No new errors in nutrition autocomplete; pre-existing project errors unchanged"\n            ),\n        }\n    ]\n\n\ndef test_mcp_work_lifecycle_does_not_require_redundant_work_key() -> None:\n    from ai_layer.mcp.server import mcp\n\n    for name in (\n        "work_checkpoint",\n        "work_complete",\n        "work_fail",\n        "work_interrupt",\n        "work_abandon",\n    ):\n        tool = mcp._tool_manager.get_tool(name)\n        assert tool is not None\n        assert "work_key" not in (tool.parameters.get("required") or [])\n\n\ndef test_single_active_work_is_resolved_but_ambiguous_work_is_not_guessed() -> None:\n    engine = create_engine("sqlite:///:memory:")\n    Base.metadata.create_all(engine)\n    with Session(engine, expire_on_commit=False) as db:\n        project = _project(db, "/tmp/cursor-work-key-resolution")\n        begin_work(db, project, goal="First change")\n        checkpointed, _run = checkpoint_work(\n            db,\n            project,\n            work_key_value=None,\n            summary="Observed one active Work",\n        )\n        assert checkpointed.sequence == 1\n\n        begin_work(db, project, goal="Second concurrent change")\n        with pytest.raises(ValueError, match="multiple active Work items"):\n            finish_work(\n                db,\n                project,\n                work_key_value=None,\n                status="completed",\n                summary="",\n            )\n'''
          test_path.write_text(test, encoding='utf-8')
          PY
      - name: Format touched Python files
        run: |
          ruff format src/ai_layer/mcp/tool_schema.py src/ai_layer/mcp/tools/work.py src/ai_layer/application/work.py src/ai_layer/work/service.py tests/test_cursor_field_acceptance.py
          ruff check --fix src/ai_layer/mcp/tool_schema.py src/ai_layer/mcp/tools/work.py src/ai_layer/application/work.py src/ai_layer/work/service.py tests/test_cursor_field_acceptance.py
      - name: Validate focused semantics and MCP schema
        run: |
          mypy src/ai_layer
          python scripts/architecture_gate.py
          python -m pytest tests/test_cursor_field_acceptance.py tests/test_work_spine.py tests/test_schema_hygiene.py tests/test_project_map_semantics.py
      - name: Rebuild deterministic 0.14.0 artifacts
        run: |
          python scripts/build_release_wheel.py
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest_path = Path('release/release-manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          wheel = Path(manifest['application_wheel'])
          manifest['application_wheel_sha256'] = hashlib.sha256(wheel.read_bytes()).hexdigest()
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python scripts/build_release_archive.py --output dist/ai-layer-release.zip
      - name: Full quality gate
        run: make quality
      - name: Commit validated repair
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ai_layer/mcp/tool_schema.py src/ai_layer/mcp/tools/work.py src/ai_layer/application/work.py src/ai_layer/work/service.py tests/test_cursor_field_acceptance.py release/release-manifest.json dist/local_ai_development_layer-0.14.0-py3-none-any.whl dist/ai-layer-release.zip
          git commit -m 'Accept natural Cursor Work lifecycle reports'
          git push origin HEAD:fix/cursor-work-complete-natural-v2

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: make quality

  postgres-hardening:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16@sha256:a132765ec351c65111b5b675928a3a0515a466a40f97277329db8b8209ad8bc9
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_layer_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AI_LAYER_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/ai_layer_gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: make postgres-gate
