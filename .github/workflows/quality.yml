name: canonical-quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: make quality

  postgres-hardening:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16@sha256:a132765ec351c65111b5b675928a3a0515a466a40f97277329db8b8209ad8bc9
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_layer_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AI_LAYER_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/ai_layer_gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: make postgres-gate

  release-candidate-artifact:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_release_wheel.py
      - uses: actions/upload-artifact@v4
        with:
          name: ai-layer-release-candidate
          path: dist/local_ai_development_layer-0.14.0-py3-none-any.whl
          if-no-files-found: error

  format-source:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.16.2
      - run: >-
          ruff format
          src/ai_layer/application/transport.py
          src/ai_layer/application/work.py
          src/ai_layer/db/work_models.py
          src/ai_layer/mcp/tools/work.py
          src/ai_layer/projections/dashboard_work_state.py
          src/ai_layer/work/service.py
          tests/test_work_spine.py
          tests/test_work_spine_postgres.py
      - name: Commit canonical formatting when needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/ai_layer/application/transport.py \
            src/ai_layer/application/work.py \
            src/ai_layer/db/work_models.py \
            src/ai_layer/mcp/tools/work.py \
            src/ai_layer/projections/dashboard_work_state.py \
            src/ai_layer/work/service.py \
            tests/test_work_spine.py \
            tests/test_work_spine_postgres.py
          if ! git diff --cached --quiet; then
            git commit -m "style: apply canonical formatter"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
