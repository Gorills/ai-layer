name: canonical-quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Normalize Phase 3 source and release artifact
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git checkout -B p3-server-owned-actions "$PR_HEAD_SHA"
          python - <<'PY'
          from pathlib import Path

          test = Path("tests/test_phase3_action_engine.py")
          text = test.read_text(encoding="utf-8")
          if "from uuid import UUID\n" not in text:
              text = text.replace("from pathlib import Path\n", "from pathlib import Path\nfrom uuid import UUID\n")
          test.write_text(text, encoding="utf-8")

          contract = Path("tests/test_agent_facing_contracts.py")
          text = contract.read_text(encoding="utf-8")
          text = text.replace(
              'manifest["migration_compatibility"]["target_schema"] == "0019_canonical_work_relations"',
              'manifest["migration_compatibility"]["target_schema"] == "0020_server_owned_actions"',
          )
          contract.write_text(text, encoding="utf-8")

          engine = Path("src/ai_layer/application/action_engine.py")
          text = engine.read_text(encoding="utf-8")
          old = '''    task = db.get(Task, state.task_id) if state.task_id else None
              if task is None:
                  _protocol_error("STALE_ACTION", "the managed Task for this decision is unavailable")
              selection = str(report.get("selection") or "").strip().casefold()
              if selection == "resume":
          '''
          new = '''    task = db.get(Task, state.task_id) if state.task_id else None
              selection = str(report.get("selection") or "").strip().casefold()
              if task is None:
                  if selection == "resume":
                      next_state = _upsert_action_state(
                          db,
                          project,
                          work,
                          task=None,
                          stage=None,
                          kind="native_engineering",
                          worker_kind=None,
                          worker_id="",
                          state_version=int(state.state_version) + 1,
                          instruction="Resume native repository engineering from the current Work state.",
                      )
                      return _state_response(db, project, work, next_state)
                  if selection == "cancel":
                      next_state = _upsert_action_state(
                          db,
                          project,
                          work,
                          task=None,
                          stage=None,
                          kind="done",
                          worker_kind=None,
                          worker_id="",
                          state_version=int(state.state_version) + 1,
                          instruction="Native work was cancelled; close the durable Work with the appropriate status.",
                      )
                      return _state_response(db, project, work, next_state)
                  _protocol_error("INVALID_HUMAN_CHOICE", "selection must be resume or cancel")
              if selection == "resume":
          '''
          if old not in text:
              raise SystemExit("expected native human-decision patch anchor not found")
          engine.write_text(text.replace(old, new), encoding="utf-8")
          PY
          ruff format src/ai_layer/application/action_engine.py src/ai_layer/db/action_models.py alembic/env.py alembic/versions/0020_server_owned_actions.py tests/test_phase3_action_engine.py tests/test_phase3_action_engine_postgres.py tests/test_phase3_action_migration.py tests/test_agent_facing_contracts.py
          python scripts/build_release_wheel.py
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest_path = Path("release/release-manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          wheel = Path(manifest["application_wheel"])
          manifest["application_wheel_sha256"] = hashlib.sha256(wheel.read_bytes()).hexdigest()
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY
          cat > .github/workflows/quality.yml <<'YAML'
          name: canonical-quality
          on:
            pull_request:
            push:
              branches: [main]
          permissions:
            contents: read
          jobs:
            quality:
              runs-on: ubuntu-24.04
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: '3.12'
                - run: python -m pip install --upgrade pip
                - run: python -m pip install -e '.[dev]'
                - run: make quality

            postgres-hardening:
              runs-on: ubuntu-24.04
              services:
                postgres:
                  image: pgvector/pgvector:0.8.0-pg16@sha256:a132765ec351c65111b5b675928a3a0515a466a40f97277329db8b8209ad8bc9
                  env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: ai_layer_gate
                  ports:
                    - 5432:5432
                  options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 20
              env:
                AI_LAYER_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/ai_layer_gate
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: '3.12'
                - run: python -m pip install --upgrade pip
                - run: python -m pip install -e '.[dev]'
                - run: make postgres-gate

            dashboard-browser:
              runs-on: ubuntu-24.04
              timeout-minutes: 15
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: '3.12'
                - run: python -m pip install --upgrade pip
                - run: python -m pip install -e '.[dev]' playwright==1.55.0
                - run: python -m playwright install --with-deps chromium
                - name: Run Dashboard browser acceptance
                  env:
                    AI_LAYER_BROWSER_TESTS: '1'
                  run: pytest -q tests/test_dashboard_browser.py
          YAML
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ai_layer/application/action_engine.py src/ai_layer/db/action_models.py alembic/env.py alembic/versions/0020_server_owned_actions.py tests/test_phase3_action_engine.py tests/test_phase3_action_engine_postgres.py tests/test_phase3_action_migration.py tests/test_agent_facing_contracts.py release/release-manifest.json dist/local_ai_development_layer-0.14.0-py3-none-any.whl .github/workflows/quality.yml
          git commit -m "Normalize Phase 3 action engine and release artifact"
          git push origin HEAD:p3-server-owned-actions
      - run: make quality

  postgres-hardening:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16@sha256:a132765ec351c65111b5b675928a3a0515a466a40f97277329db8b8209ad8bc9
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_layer_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AI_LAYER_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/ai_layer_gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: make postgres-gate

  dashboard-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]' playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - name: Run Dashboard browser acceptance
        env:
          AI_LAYER_BROWSER_TESTS: '1'
        run: pytest -q tests/test_dashboard_browser.py