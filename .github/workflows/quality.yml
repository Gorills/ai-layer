name: canonical-quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  wheel-refresh:
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_release_wheel.py
      - name: Update wheel hash in release manifest
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          wheel = Path('dist/local_ai_development_layer-0.14.0-py3-none-any.whl')
          manifest_path = Path('release/release-manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['application_wheel_sha256'] = hashlib.sha256(wheel.read_bytes()).hexdigest()
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit deterministic wheel
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/local_ai_development_layer-0.14.0-py3-none-any.whl release/release-manifest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Refresh deterministic release wheel'
          git push origin HEAD:${{ github.head_ref }}

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: make quality

  postgres-hardening:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16@sha256:a132765ec351c65111b5b675928a3a0515a466a40f97277329db8b8209ad8bc9
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_layer_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AI_LAYER_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/ai_layer_gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: make postgres-gate
