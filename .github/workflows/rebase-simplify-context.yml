name: rebase-simplify-context
on:
  push:
    branches: [simplify-context-intent-routing-rebased]
permissions:
  contents: write
jobs:
  rebase-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Prove repaired baseline did not semantically change PR1 files
        run: |
          set -euo pipefail
          files=(
            MAINTAINER_INSTRUCTIONS.md
            PROJECT_CHARTER.md
            docs/DECISIONS/0012-task-aware-memory-context-presentation.md
            src/ai_layer/mcp/tools/sessions.py
            src/ai_layer/memory/guidance.py
            src/ai_layer/memory/history.py
            src/ai_layer/memory/presentation.py
            src/ai_layer/memory/service.py
            tests/test_tool_guidance.py
          )
          for path in "${files[@]}"; do
            if ! git diff --ignore-all-space --ignore-blank-lines --exit-code \
              cdbccc978c7df451741918eb99c33e19dffe298b \
              4af4a75ea33ba9020874c8fc09c74b2e1a83e246 -- "$path"; then
              echo "Semantic baseline change detected in $path; refusing old-file replay."
              exit 1
            fi
          done
      - name: Replay only PR1 file states onto repaired baseline
        run: |
          set -euo pipefail
          files=(
            MAINTAINER_INSTRUCTIONS.md
            PROJECT_CHARTER.md
            docs/DECISIONS/0012-task-aware-memory-context-presentation.md
            src/ai_layer/mcp/tools/sessions.py
            src/ai_layer/memory/guidance.py
            src/ai_layer/memory/history.py
            src/ai_layer/memory/presentation.py
            src/ai_layer/memory/service.py
            tests/test_tool_guidance.py
          )
          for path in "${files[@]}"; do
            git show f2237746344ec528ea0e5fa1494f08144d6feaf7:"$path" > "$path"
          done
      - name: Normalize and verify
        run: |
          ruff format .
          ruff check .
          mypy src/ai_layer
          python scripts/quality_gate.py --deterministic-wheel
      - name: Commit verified rebased change
        run: |
          rm .github/workflows/rebase-simplify-context.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "simplify context intent handling"
          git push origin HEAD:simplify-context-intent-routing-rebased
