name: rebase-simplify-context
on:
  push:
    branches: [simplify-context-intent-routing-rebased]
permissions:
  contents: write
jobs:
  rebase-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Replay reviewed PR1 semantic state
        run: |
          set -euo pipefail
          files=(
            MAINTAINER_INSTRUCTIONS.md
            PROJECT_CHARTER.md
            docs/DECISIONS/0012-task-aware-memory-context-presentation.md
            src/ai_layer/mcp/tools/sessions.py
            src/ai_layer/memory/guidance.py
            src/ai_layer/memory/presentation.py
            src/ai_layer/memory/service.py
            tests/test_tool_guidance.py
          )
          for path in "${files[@]}"; do
            git show f2237746344ec528ea0e5fa1494f08144d6feaf7:"$path" > "$path"
          done
          python - <<'PY'
          from pathlib import Path
          path = Path("src/ai_layer/memory/history.py")
          text = path.read_text(encoding="utf-8")
          start = text.find("def latest_task_summary(")
          end = text.find("def relevant_decision_brief(", start)
          if start < 0 or end < 0:
              raise SystemExit("Could not locate latest_task_summary boundaries")
          path.write_text(text[:start] + text[end:], encoding="utf-8")
          PY
      - name: Normalize and verify full canonical quality
        run: |
          ruff format .
          ruff check . --select I --fix
          ruff format .
          ruff check .
          mypy src/ai_layer
          python scripts/quality_gate.py --deterministic-wheel
      - name: Commit verified rebased change
        run: |
          rm .github/workflows/rebase-simplify-context.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "simplify context intent handling"
          git push origin HEAD:simplify-context-intent-routing-rebased
