name: rebase-simplify-context
on:
  push:
    branches: [simplify-context-intent-routing-rebased]
permissions:
  contents: write
jobs:
  rebase-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Replay reviewed PR1 semantic state
        run: |
          set -euo pipefail
          files=(
            MAINTAINER_INSTRUCTIONS.md
            PROJECT_CHARTER.md
            docs/DECISIONS/0012-task-aware-memory-context-presentation.md
            src/ai_layer/mcp/tools/sessions.py
            src/ai_layer/memory/guidance.py
            src/ai_layer/memory/history.py
            src/ai_layer/memory/presentation.py
            src/ai_layer/memory/service.py
            tests/test_tool_guidance.py
          )
          for path in "${files[@]}"; do
            git show f2237746344ec528ea0e5fa1494f08144d6feaf7:"$path" > "$path"
          done
          python - <<'PY'
          from pathlib import Path
          path = Path("src/ai_layer/memory/history.py")
          text = path.read_text(encoding="utf-8")
          old = '''    for item in snapshot_decisions(project, limit=50):\n        score = _overlap_score(query, item.get("decision"), item.get("context"))\n        if score > 0:\n            ranked.append((score, {\n                "kind": "session_decision",\n                "id": f"session:{item['session_id']}",\n                "title": str(item.get("decision") or "")[:120],\n                "decision": item.get("decision") or "",\n                "rationale": "Committed durable session decision.",\n                "score": round(score, 4),\n                "provenance": "ai_layer_session_history",\n            }))\n'''
          new = '''    for snapshot_item in snapshot_decisions(project, limit=50):\n        score = _overlap_score(query, snapshot_item.get("decision"), snapshot_item.get("context"))\n        if score > 0:\n            ranked.append((score, {\n                "kind": "session_decision",\n                "id": f"session:{snapshot_item['session_id']}",\n                "title": str(snapshot_item.get("decision") or "")[:120],\n                "decision": snapshot_item.get("decision") or "",\n                "rationale": "Committed durable session decision.",\n                "score": round(score, 4),\n                "provenance": "ai_layer_session_history",\n            }))\n'''
          if text.count(old) != 1:
              raise SystemExit("Expected exactly one pre-baseline snapshot_decisions block")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Normalize and verify full canonical quality
        run: |
          ruff format .
          ruff check . --select I --fix
          ruff format .
          ruff check .
          mypy src/ai_layer
          python scripts/quality_gate.py --deterministic-wheel
      - name: Commit verified rebased change
        run: |
          rm .github/workflows/rebase-simplify-context.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "simplify context intent handling"
          git push origin HEAD:simplify-context-intent-routing-rebased
