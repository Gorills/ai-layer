name: refresh-tool-error-contract

on:
  push:
    branches:
      - agent/fail-closed-tool-errors-v2

permissions:
  contents: write

jobs:
  validate-and-refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fail-closed-tool-errors-v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run focused tool-error contract tests
        run: python -m pytest tests/test_agent_tool_error_recovery_contract.py tests/test_agent_facing_contracts.py -q
      - name: Rebuild deterministic application wheel
        run: python scripts/build_release_wheel.py
      - name: Refresh release manifest wheel checksum
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest_path = Path("release/release-manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          wheel = Path(manifest["application_wheel"])
          manifest["application_wheel_sha256"] = hashlib.sha256(wheel.read_bytes()).hexdigest()
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - name: Commit release evidence when changed
        run: |
          if git diff --quiet -- dist/local_ai_development_layer-0.14.0-py3-none-any.whl release/release-manifest.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/local_ai_development_layer-0.14.0-py3-none-any.whl release/release-manifest.json
          git commit -m "Refresh application wheel for tool-error contract"
          git push origin HEAD:agent/fail-closed-tool-errors-v2
