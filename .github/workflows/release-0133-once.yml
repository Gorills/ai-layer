name: release-0133-once
on:
  push:
    branches:
      - audit/agent-facing-contracts
permissions:
  contents: write
jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/agent-facing-contracts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Promote source metadata to 0.13.3
        shell: python
        run: |
          from __future__ import annotations
          import json
          from pathlib import Path

          root = Path.cwd()
          pyproject = root / "pyproject.toml"
          text = pyproject.read_text(encoding="utf-8")
          old = 'version = "0.13.2"'
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one {old!r} in pyproject.toml")
          pyproject.write_text(text.replace(old, 'version = "0.13.3"', 1), encoding="utf-8")

          init = root / "src/ai_layer/__init__.py"
          init_text = init.read_text(encoding="utf-8")
          if init_text.strip() != '__version__ = "0.13.2"':
              raise SystemExit("unexpected package version source")
          init.write_text('__version__ = "0.13.3"\n', encoding="utf-8")

          manifest_path = root / "release/release-manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("version") != "0.13.2":
              raise SystemExit(f"unexpected release version: {manifest.get('version')!r}")
          if (manifest.get("migration_compatibility") or {}).get("target_schema") != "0016_project_map_semantics":
              raise SystemExit("0.13.3 must not silently change the migration target")
          manifest["version"] = "0.13.3"
          manifest["application_wheel"] = "dist/local_ai_development_layer-0.13.3-py3-none-any.whl"
          manifest["application_wheel_sha256"] = "PENDING_BUILD"
          manifest["notes"] = (
              "0.13.3 audits and hardens all agent-facing contracts: project_status/live runtime semantics are "
              "authoritative, stale memory/task permission-layer guidance is removed from bootstrap, skills, QA "
              "and tests, legacy compatibility is explicit, and brittle accidental byte/count/wording constraints "
              "are replaced by semantic governance while real protocol/safety bounds remain enforced."
          )
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          changelog_path = root / "CHANGELOG.md"
          changelog = changelog_path.read_text(encoding="utf-8")
          heading = "# Changelog\n\n"
          if not changelog.startswith(heading):
              raise SystemExit("unexpected CHANGELOG.md header")
          entry = """## 0.13.3 — Live agent contract and repository hygiene\n\n- Audited every agent-facing control-plane surface: native/MCP bootstrap, `project_status`, Task/Epic navigation, MCP descriptions, recovery/error guidance, skills and compatibility paths now describe the current Project Intelligence architecture consistently.\n- Made the versioned live runtime contract the procedural authority over historical Task/Epic prose; ordinary host-native work no longer inherits the old mandatory Task permission model, while active managed work still follows `task_next`/`epic_next`.\n- Rewrote the `epics` native skill around the real ordered AI Layer state machine and current Project Map closure contract instead of generic DAG/orchestration advice.\n- Made installed bootstrap readiness version-aware so `doctor`/integration status can detect stale global instructions rather than accepting any historical managed block.\n- Promoted `knowledge_search`/`search_knowledge` to canonical internal names while retaining explicit `memory_search` compatibility aliases; legacy `memory_context` remains diagnosable but is not a successful current-flow start.\n- Updated QA, smoke and audit flows to start from `project_status`; legacy `memory_context`-first flows now surface a compatibility warning and fail current-contract validation instead of defining success.\n- Removed accidental architecture constraints such as exact bootstrap byte size, exact skill/policy-rule counts, transitive dependency-count floors and brittle exact prose assertions; retained real safety/protocol/performance limits and named meaningful compatibility bounds.\n- Centralized bootstrap/integration compatibility versions, cleaned stale `Task Layer`/memory wording, added semantic governance regression tests and ADR 0019. No database migration; target remains `0016_project_map_semantics`.\n\n"""
          changelog_path.write_text(heading + entry + changelog[len(heading):], encoding="utf-8")

          state_path = root / "CURRENT_STATE.md"
          state = state_path.read_text(encoding="utf-8")
          first = "# Current State — v0.13.2 Project Map runtime contract hardening"
          if first not in state:
              raise SystemExit("unexpected CURRENT_STATE.md heading")
          state = state.replace(
              first,
              "# Current State — v0.13.3 Live agent contract and semantic governance",
              1,
          )
          state = state.replace(
              "Release **0.13.1** is promoted in the source branch with an aligned deterministic application wheel, release manifest and governance baseline. ADR 0017 records the execution-model change.",
              "Release **0.13.3** is promoted in the source branch with an aligned deterministic application wheel, release manifest and governance baseline. ADR 0019 records the live-agent-contract and semantic-governance rules; ADRs 0017–0018 remain the Project Intelligence and semantic Project Map foundations.",
              1,
          )
          state = state.replace(
              "deterministic packaging checks against the declared 0.13.1 release artifacts.",
              "deterministic packaging checks against the declared 0.13.3 release artifacts.",
              1,
          )
          boundary = "AI Layer must not rebuild a second generic agent runtime around native hosts. A new control-plane requirement should justify itself by reducing rediscovery, preserving durable state/evidence or improving measured reliability."
          addition = boundary + "\n\nThe live runtime/tool contract is the procedural authority presented to agents. Historical Task/Epic prose and legacy compatibility names may remain for migration/history, but they must not override current `project_status`, `task_next`, `epic_next` or focused Project Intelligence tool semantics. Agent-facing quality tests protect these meanings rather than arbitrary byte counts, catalog counts or exact wording."
          if boundary not in state:
              raise SystemExit("architectural boundary paragraph missing")
          state = state.replace(boundary, addition, 1)
          state_path.write_text(state, encoding="utf-8")
      - name: Build deterministic 0.13.3 wheel
        run: python scripts/build_release_wheel.py
      - name: Finalize wheel digest
        shell: python
        run: |
          import hashlib
          import json
          from pathlib import Path
          root = Path.cwd()
          manifest_path = root / "release/release-manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          wheel = root / manifest["application_wheel"]
          if not wheel.is_file():
              raise SystemExit(f"wheel missing: {wheel}")
          manifest["application_wheel_sha256"] = hashlib.sha256(wheel.read_bytes()).hexdigest()
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(manifest["application_wheel_sha256"])
      - name: Refresh reviewed governance baseline
        run: |
          python scripts/governance_gate.py --write-baseline
          python scripts/governance_gate.py
      - name: Remove one-shot workflow
        run: rm -f .github/workflows/release-0133-once.yml
      - name: Commit 0.13.3 release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --exit-code && { echo 'release produced no changes'; exit 1; }
          git commit -m 'release: promote agent contract audit as 0.13.3'
          git push origin HEAD:audit/agent-facing-contracts
