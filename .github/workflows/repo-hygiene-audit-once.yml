name: repo-hygiene-audit-once
on:
  push:
    branches:
      - audit/agent-facing-contracts
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan suspicious legacy and brittle constraints
        shell: bash
        run: |
          set -u
          echo '=== legacy workflow terms ==='
          grep -RInE 'memory_context|memory_search|Task Layer|create_task before|task DAG|parallel DAG|MCP Task Layer' src tests scripts || true
          echo '=== size/count thresholds in tests ==='
          grep -RInE 'assert .*len\(|encode\(.+<|< [0-9]{3,}|> [0-9]{3,}|<= [0-9]{3,}|>= [0-9]{3,}' tests || true
          echo '=== duplicated version constants ==='
          grep -RInE 'INTEGRATION_TEMPLATE_VERSION|GLOBAL_BOOTSTRAP_VERSION|CONTRACT_VERSION|SCHEMA_VERSION' src tests scripts || true
          echo '=== exact workflow-string assertions ==='
          grep -RInE 'assert .*".*(project_status|project_search|knowledge_search|memory_context|memory_search|task_next|task_create|epic_next|Task Layer|DAG).*"' tests || true
