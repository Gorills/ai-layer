name: repo-hygiene-cleanup-once
on:
  push:
    branches:
      - audit/agent-facing-contracts
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/agent-facing-contracts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply repository hygiene cleanup
        run: python scripts/repo_hygiene_cleanup_once.py
      - name: Remove one-shot audit helpers
        run: rm -f scripts/repo_hygiene_cleanup_once.py .github/workflows/repo-hygiene-cleanup-once.yml .github/workflows/repo-hygiene-audit-once.yml
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --exit-code && exit 0
          git commit -m 'refactor: remove stale architectural constraints'
          git push origin HEAD:audit/agent-facing-contracts
