name: restore-facades-once
on:
  push:
    branches: [fix-ci-baseline]
permissions:
  contents: write
jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.16.2
      - name: Restore intentional public re-exports
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"unexpected match count in {path}: {old!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          replace(
              "src/ai_layer/observability/events.py",
              "from ai_layer.observability.event_common import parse_ts, utcnow\n",
              "from ai_layer.observability.event_common import parse_ts, utcnow\nfrom ai_layer.observability.event_aggregation import aggregate_events as aggregate_events\n",
          )
          replace(
              "src/ai_layer/integrations/service.py",
              "from ai_layer.integrations.global_install import (\n    _cursor_plugin_owned,\n    _merge_codex_config,\n)\n",
              "from ai_layer.integrations.global_install import (\n    _cursor_plugin_owned,\n    _merge_codex_config,\n    install_global_integrations as install_global_integrations,\n    remove_global_integrations as remove_global_integrations,\n)\n",
          )
          replace(
              "src/ai_layer/skills/manager.py",
              "from ai_layer.skills.registry import (\n",
              "from ai_layer.skills.registry import (\n    skill_records as skill_records,\n",
          )
          replace(
              "src/ai_layer/skills/manager.py",
              "from ai_layer.skills.sources import (\n    _catalog_source,\n",
              "from ai_layer.skills.sources import (\n    _catalog_source,\n    default_skill_catalog as default_skill_catalog,\n",
          )
          PY
      - run: ruff format src/ai_layer/observability/events.py src/ai_layer/integrations/service.py src/ai_layer/skills/manager.py
      - run: ruff check src/ai_layer/observability/events.py src/ai_layer/integrations/service.py src/ai_layer/skills/manager.py
      - name: Commit facade repairs
        run: |
          rm .github/workflows/restore-facades-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "restore intentional compatibility re-exports"
          git push origin HEAD:fix-ci-baseline
