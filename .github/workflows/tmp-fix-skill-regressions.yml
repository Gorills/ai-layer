name: tmp-fix-skill-regressions

on:
  push:
    paths:
      - .github/workflows/tmp-fix-skill-regressions.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/native-full-skill-activation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact regression fixes and refresh wheel
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import subprocess

          replacements = {
              'src/ai_layer/integrations/status.py': [(
                  '        if "<!-- AI-LAYER NATIVE SKILL v1 scope=global " in content:\n            count += 1',
                  '        if (\n            "<!-- AI-LAYER NATIVE SKILL v1 scope=global " in content\n            or "<!-- AI-LAYER NATIVE SKILL v2 scope=global " in content\n        ):\n            count += 1',
              )],
              'tests/test_integrations.py': [(
                  '    assert "skill_get" in shared_skill.read_text(encoding="utf-8")',
                  '    shared_skill_text = shared_skill.read_text(encoding="utf-8")\n    assert "## Core contract" in shared_skill_text\n    assert "## Decision rules" in shared_skill_text\n    assert "## Migrations" in shared_skill_text',
              )],
              'tests/test_skills.py': [(
                  '            assert skill_section_content(skill, "core")[0]\n            assert len(skill_core_content(skill)) <= 2400',
                  '            core = skill_core_content(skill)\n            assert core\n            assert "skill core clipped" not in core\n            for entry in meta.get("entry_sections", []):\n                section, _ = skill_section_content(skill, entry)\n                assert section in core',
              )],
              'tests/test_skill_core_limits.py': [(
                  '    assert core_contract in content',
                  '    assert core_contract.strip() in content',
              )],
          }
          for raw_path, pairs in replacements.items():
              path = Path(raw_path)
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if text.count(old) != 1:
                      raise SystemExit(f'{raw_path}: replacement target count={text.count(old)}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          subprocess.run(['python', 'scripts/build_release_wheel.py'], check=True)
          manifest_path = Path('release/release-manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          wheel = Path(manifest['application_wheel'])
          manifest['application_wheel_sha256'] = hashlib.sha256(wheel.read_bytes()).hexdigest()
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
      - name: Commit exact fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/ai_layer/integrations/status.py tests/test_integrations.py tests/test_skills.py tests/test_skill_core_limits.py dist/local_ai_development_layer-0.12.2-py3-none-any.whl release/release-manifest.json
          git diff --cached --check
          git commit -m 'fix(skills): recognize v2 native activation state'
          git push origin HEAD:fix/native-full-skill-activation
