name: zero-footprint-standard-migration
on:
  pull_request:
  push:
    branches: [refactor/zero-footprint-standard-init]
permissions:
  contents: write
jobs:
  migrate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16@sha256:a132765ec351c65111b5b675928a3a0515a466a40f97277329db8b8209ad8bc9
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_layer_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AI_LAYER_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/ai_layer_gate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/zero-footprint-standard-init
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Apply bounded source and regression changes
        run: |
          python - <<'PY'
          from pathlib import Path
          helper = Path('.github/zero_footprint_migrate.py')
          text = helper.read_text(encoding='utf-8')
          old = r'def _archive_external_local_residue\(root: Path\) -> list\[str\]:.*?\n\ndef _archive_overlapping_state'
          new = r'def _archive_external_local_residue\(root: Path\) -> list\[str\]:.*?\n\ndef repair_project'
          if text.count(old) != 1:
              raise SystemExit('repair helper pattern marker mismatch')
          helper.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python .github/zero_footprint_migrate.py
          python - <<'PY'
          from pathlib import Path
          path = Path('src/ai_layer/core/repair.py')
          text = path.read_text(encoding='utf-8')
          old = 'from ai_layer.core.paths import project_config_path, project_local_path, project_mode\n'
          new = 'from ai_layer.core.paths import project_local_path, project_mode\n'
          if text.count(old) != 1:
              raise SystemExit('repair import marker mismatch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Format changed Python
        run: |
          python -m ruff format \
            src/ai_layer/core/paths.py \
            src/ai_layer/core/registry.py \
            src/ai_layer/core/service.py \
            src/ai_layer/core/repair.py \
            src/ai_layer/integrations/status.py \
            src/ai_layer/integrations/versioning.py \
            src/ai_layer/skills/native_sync.py \
            src/ai_layer/cli/commands/operations.py \
            tests/test_integrations.py \
            tests/test_privacy.py \
            tests/test_repair.py
      - name: Fast gate
        run: make fast-gate
      - name: Focused regressions
        run: python -m pytest -q tests/test_integrations.py tests/test_privacy.py tests/test_repair.py tests/test_cli.py
      - name: Refresh deterministic wheel and manifest
        run: |
          python scripts/build_release_wheel.py
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          manifest_path = Path("release/release-manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          wheel = Path(manifest["application_wheel"])
          manifest["application_wheel_sha256"] = hashlib.sha256(wheel.read_bytes()).hexdigest()
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(manifest["application_wheel_sha256"])
          PY
      - name: Canonical preflight in controlled PostgreSQL
        run: make preflight-ci
      - name: Refresh release archive
        run: python scripts/build_release_archive.py --output dist/ai-layer-release.zip
      - name: Diff check
        run: git diff --check
      - name: Commit verified change-set
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/ai_layer/core/paths.py \
            src/ai_layer/core/registry.py \
            src/ai_layer/core/service.py \
            src/ai_layer/core/repair.py \
            src/ai_layer/integrations/status.py \
            src/ai_layer/integrations/versioning.py \
            src/ai_layer/skills/native_sync.py \
            src/ai_layer/cli/commands/operations.py \
            tests/test_integrations.py \
            tests/test_privacy.py \
            tests/test_repair.py \
            PROJECT_CHARTER.md ARCHITECTURE.md README.md CURRENT_STATE.md \
            release/release-manifest.json \
            dist/local_ai_development_layer-0.14.0-py3-none-any.whl \
            dist/ai-layer-release.zip
          git commit -m "Make standard project attachment zero-footprint"
          git push origin HEAD:refactor/zero-footprint-standard-init
