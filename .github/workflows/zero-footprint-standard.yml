name: zero-footprint-standard-migration
on:
  pull_request:
  push:
    branches: [refactor/zero-footprint-standard-init]
permissions:
  contents: write
jobs:
  migrate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16@sha256:a132765ec351c65111b5b675928a3a0515a466a40f97277329db8b8209ad8bc9
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_layer_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AI_LAYER_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/ai_layer_gate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/zero-footprint-standard-init
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Apply bounded source and regression changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match in {path}, found {count}: {old[:100]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/ai_layer/core/paths.py",
              '''def project_meta_dir(root: str | Path) -> Path:\n    resolved = Path(root).expanduser().resolve()\n    item = get_registered_project(resolved)\n    if item and item.get("mode") in {"external", "strict-private"}:\n        project_id = str(item.get("project_id") or "").strip()\n        if not project_id:\n            raise RuntimeError(f"External-state project lacks registry project_id: {resolved}")\n        base = get_settings().home / "projects"\n        if base.is_symlink():\n            raise RuntimeError(f"Refusing symlinked AI Layer projects state root: {base}")\n        base.mkdir(parents=True, exist_ok=True)\n        return _safe_child(base, project_id)\n    return project_local_path(resolved, ".ai-layer")\n''',
              '''def project_meta_dir(root: str | Path) -> Path:\n    resolved = Path(root).expanduser().resolve()\n    item = get_registered_project(resolved)\n    if item:\n        project_id = str(item.get("project_id") or "").strip()\n        if project_id:\n            base = get_settings().home / "projects"\n            if base.is_symlink():\n                raise RuntimeError(f"Refusing symlinked AI Layer projects state root: {base}")\n            base.mkdir(parents=True, exist_ok=True)\n            return _safe_child(base, project_id)\n        if item.get("mode") in {"external", "strict-private"}:\n            raise RuntimeError(f"External-state project lacks registry project_id: {resolved}")\n    return project_local_path(resolved, ".ai-layer")\n''',
          )

          replace_once(
              "src/ai_layer/core/registry.py",
              '    """Recover external-state project authority if registry entries are lost."""\n',
              '    """Recover machine-side project authority if registry entries are lost."""\n',
          )
          replace_once(
              "src/ai_layer/core/registry.py",
              '        if mode not in {"external", "strict-private"}:\n            continue\n',
              '        if mode not in PROJECT_MODES:\n            continue\n',
          )

          replace_once(
              "src/ai_layer/skills/native_sync.py",
              '''from ai_layer.skills.native_files import (\n    GLOBAL_NATIVE_ROOT_PARTS,\n    PROJECT_NATIVE_ROOT_PARTS,\n    global_native_roots,\n    sync_native_root,\n)\n''',
              '''from ai_layer.skills.native_files import (\n    GLOBAL_NATIVE_ROOT_PARTS,\n    global_native_roots,\n    sync_native_root,\n)\n''',
          )
          replace_once(
              "src/ai_layer/skills/native_sync.py",
              '''def sync_project_native_skills(project_root: str | Path, *, home: Path | None = None) -> dict:\n    root = Path(project_root).expanduser().resolve()\n    mode = project_mode(root)\n    project_key = hashlib.sha256(str(root).encode("utf-8")).hexdigest()[:10]\n    if mode in {"external", "strict-private"}:\n        desired, validation = _project_skill_descriptors(root, external_scope=True)\n        home_root = (home or Path.home()).expanduser()\n        results = {\n            host: sync_native_root(\n                home_root, *parts, desired=desired, scope="project", project_key=project_key\n            )\n            for host, parts in GLOBAL_NATIVE_ROOT_PARTS.items()\n        }\n        return {\n            "mode": mode,\n            "repository_writes": False,\n            "scope": "namespaced-global-zero-footprint",\n            "descriptors": sorted(desired),\n            "activation_payload": "full-authoritative-skill",\n            "validation": validation,\n            "sync": results,\n        }\n    desired, validation = _project_skill_descriptors(root, external_scope=False)\n    agents_parts, claude_parts = PROJECT_NATIVE_ROOT_PARTS\n    shared_sync = sync_native_root(\n        root, *agents_parts, desired=desired, scope="project", project_key=project_key\n    )\n    claude_sync = sync_native_root(\n        root, *claude_parts, desired=desired, scope="project", project_key=project_key\n    )\n    return {\n        "mode": mode,\n        "repository_writes": bool(desired),\n        "scope": "workspace",\n        "descriptors": sorted(desired),\n        "activation_payload": "full-authoritative-skill",\n        "validation": validation,\n        # Preserve the historical primary sync shape for callers while exposing host-specific output.\n        "sync": shared_sync,\n        "host_sync": {\n            "cursor_codex": shared_sync,\n            "claude": claude_sync,\n        },\n    }\n''',
              '''def sync_project_native_skills(project_root: str | Path, *, home: Path | None = None) -> dict:\n    root = Path(project_root).expanduser().resolve()\n    mode = project_mode(root)\n    project_key = hashlib.sha256(str(root).encode("utf-8")).hexdigest()[:10]\n    desired, validation = _project_skill_descriptors(root, external_scope=True)\n    home_root = (home or Path.home()).expanduser()\n    results = {\n        host: sync_native_root(\n            home_root, *parts, desired=desired, scope="project", project_key=project_key\n        )\n        for host, parts in GLOBAL_NATIVE_ROOT_PARTS.items()\n    }\n    return {\n        "mode": mode,\n        "repository_writes": False,\n        "scope": "namespaced-global-zero-footprint",\n        "descriptors": sorted(desired),\n        "activation_payload": "full-authoritative-skill",\n        "validation": validation,\n        "sync": results,\n    }\n''',
          )

          replace_once(
              "src/ai_layer/core/service.py",
              '''from ai_layer.integrations.service import (\n    INTEGRATION_TEMPLATE_VERSION,\n    install_project_integrations,\n    preflight_project_integrations,\n    remove_project_integrations,\n)\n''',
              '''from ai_layer.integrations.service import (\n    INTEGRATION_TEMPLATE_VERSION,\n    remove_project_integrations,\n)\n''',
          )
          replace_once(
              "src/ai_layer/core/service.py",
              '''        if mode in {"external", "strict-private"}:\n            remove_project_integrations(path)\n            result = {\n                "template_version": INTEGRATION_TEMPLATE_VERSION,\n                "ai_layer_version": __version__,\n                "mode": mode,\n                "repository_writes": False,\n                "native_skills": sync_project_native_skills(path),\n            }\n            if mode == "strict-private":\n                guard = install_git_privacy_guard(path)\n                if not guard.get("ready", False):\n                    raise RuntimeError(\n                        f"Strict-private Git privacy guard is not ready: {guard.get('reason') or guard}"\n                    )\n                result["git_guard"] = guard\n            else:\n                remove_git_privacy_guard(path)\n        else:\n            result = install_project_integrations(path)\n''',
              '''        remove_project_integrations(path)\n        result = {\n            "template_version": INTEGRATION_TEMPLATE_VERSION,\n            "ai_layer_version": __version__,\n            "mode": mode,\n            "repository_writes": False,\n            "native_skills": sync_project_native_skills(path),\n        }\n        if mode == "strict-private":\n            guard = install_git_privacy_guard(path)\n            if not guard.get("ready", False):\n                raise RuntimeError(\n                    f"Strict-private Git privacy guard is not ready: {guard.get('reason') or guard}"\n                )\n            result["git_guard"] = guard\n        else:\n            remove_git_privacy_guard(path)\n''',
          )
          replace_once(
              "src/ai_layer/core/service.py",
              '''    # Reject deterministic integration/privacy conflicts before creating durable project identity.\n    # Later filesystem I/O can still fail, so PostgreSQL remains the recovery anchor after this gate.\n    if mode == "strict-private":\n        if not is_git_repository(path):\n            raise RuntimeError(\n                "Strict-private initialization requires an existing Git repository so privacy "\n                "enforcement can fail closed. Initialize Git first, then retry."\n            )\n    elif mode == "standard":\n        preflight_project_integrations(path)\n''',
              '''    # Strict-private alone needs a repository-level precondition because it installs a Git guard.\n    # Standard and external attachment are zero-footprint and have no repository integration targets.\n    if mode == "strict-private" and not is_git_repository(path):\n        raise RuntimeError(\n            "Strict-private initialization requires an existing Git repository so privacy "\n            "enforcement can fail closed. Initialize Git first, then retry."\n        )\n''',
          )
          replace_once(
              "src/ai_layer/core/service.py",
              '''    # Registry is the authority that selects local vs external state. Publish it before resolving\n    # project_meta_dir, then migrate any existing local state if this is a standard -> private move.\n''',
              '''    # Registry publishes durable project identity before resolving machine-side state. Existing\n    # repository-local state from older standard installs is copied out before repository cleanup.\n''',
          )
          replace_once(
              "src/ai_layer/core/service.py",
              '''    if (\n        mode in {"external", "strict-private"}\n        and local_meta.exists()\n        and local_meta.resolve() != meta.resolve()\n    ):\n''',
              '''    if local_meta.exists() and local_meta.resolve() != meta.resolve():\n''',
          )
          replace_once(
              "src/ai_layer/core/service.py",
              '''    if mode in {"external", "strict-private"}:\n        remove_project_integrations(path)\n        sync_project_native_skills(path)\n        if local_meta.exists() and local_meta.resolve() != meta.resolve():\n            shutil.rmtree(local_meta)\n        if mode == "strict-private":\n            guard = install_git_privacy_guard(path)\n            if not guard.get("ready", False):\n                raise RuntimeError(\n                    f"Strict-private Git privacy guard is not ready: {guard.get('reason') or guard}"\n                )\n        else:\n            remove_git_privacy_guard(path)\n    else:\n        install_project_integrations(path)\n''',
              '''    remove_project_integrations(path)\n    sync_project_native_skills(path)\n    if local_meta.exists() and local_meta.resolve() != meta.resolve():\n        shutil.rmtree(local_meta)\n    if mode == "strict-private":\n        guard = install_git_privacy_guard(path)\n        if not guard.get("ready", False):\n            raise RuntimeError(\n                f"Strict-private Git privacy guard is not ready: {guard.get('reason') or guard}"\n            )\n    else:\n        remove_git_privacy_guard(path)\n''',
          )

          replace_once(
              "src/ai_layer/core/repair.py",
              '''def _archive_external_local_residue(root: Path) -> list[str]:\n    """Move verified legacy local state out of an external-state repository."""\n    if project_mode(root) not in {"external", "strict-private"}:\n        return []\n    local_meta = project_local_path(root, ".ai-layer")\n    if not local_meta.exists() and not local_meta.is_symlink():\n        return []\n    project_id = _project_id(root)\n    if not _validated_owned_state(local_meta, root, project_id):\n        return []\n    # A strict-private project must already have its canonical external project.yaml before we\n    # move local residue. Otherwise automatic cleanup could remove the only usable project state.\n    canonical = project_config_path(root)\n    if not canonical.exists() or canonical.resolve() == (local_meta / "project.yaml").resolve():\n        raise RuntimeError(f"External project state is not ready; refusing to move {local_meta}")\n    recovery = _recovery_dir(root, project_id, "external-local-state")\n    return [_archive_dir(local_meta, recovery, "local-state")]\n''',
              '''def _migrate_legacy_local_state(root: Path) -> dict:\n    """Move verified legacy repository-local state to the canonical machine-side project directory."""\n    local_meta = project_local_path(root, ".ai-layer")\n    if not local_meta.exists() and not local_meta.is_symlink():\n        return {"migrated": False, "destination": None, "archived": []}\n    project_id = _project_id(root)\n    if not project_id:\n        raise RuntimeError(\n            f"Registered project lacks project_id; refusing to move legacy state: {root}"\n        )\n    if not _validated_owned_state(local_meta, root, project_id):\n        return {"migrated": False, "destination": None, "archived": []}\n\n    base = get_settings().projects_state_dir\n    if base.is_symlink():\n        raise RuntimeError(f"Refusing symlinked AI Layer projects state root: {base}")\n    destination = base / project_id\n    try:\n        destination.resolve().relative_to(base.expanduser().resolve())\n    except ValueError as exc:\n        raise RuntimeError(f"Unsafe external AI Layer project state path: {destination}") from exc\n\n    if destination.exists() or destination.is_symlink():\n        if not _validated_owned_state(destination, root, project_id):\n            raise RuntimeError(f"Canonical project state is not safely owned: {destination}")\n        recovery = _recovery_dir(root, project_id, "legacy-local-state")\n        archived = _archive_dir(local_meta, recovery, "local-state")\n        return {"migrated": False, "destination": str(destination), "archived": [archived]}\n\n    base.mkdir(parents=True, exist_ok=True)\n    shutil.move(str(local_meta), str(destination))\n    try:\n        os.chmod(destination, 0o700)\n    except OSError:\n        pass\n    return {"migrated": True, "destination": str(destination), "archived": []}\n''',
          )
          replace_once(
              "src/ai_layer/core/repair.py",
              '''        mode = project_mode(path)\n        if mode in {"external", "strict-private"}:\n            # External attachment never needs repository-local bridges or metadata.\n            remove_project_integrations(path)\n            result["actions"].append("removed external-mode repository bridge residue")\n            archived = _archive_external_local_residue(path)\n            if archived:\n                result["actions"].append("archived legacy local .ai-layer state")\n                result["archived_state"] = archived\n            if mode == "strict-private":\n                guard = install_git_privacy_guard(path)\n                result["git_guard"] = guard\n                if not guard.get("ready", False):\n                    result["manual"].append(\n                        f"Git privacy guard conflict: {guard.get('reason') or guard}"\n                    )\n            else:\n                remove_git_privacy_guard(path)\n        if sync:\n''',
              '''        mode = project_mode(path)\n        layout = _migrate_legacy_local_state(path)\n        if layout.get("migrated"):\n            result["actions"].append("migrated legacy local .ai-layer state to machine storage")\n            result["state_destination"] = layout.get("destination")\n        if layout.get("archived"):\n            result["actions"].append("archived duplicate legacy local .ai-layer state")\n            result["archived_state"] = layout["archived"]\n\n        remove_project_integrations(path)\n        result["actions"].append("removed repository-local AI Layer integration residue")\n        if mode == "strict-private":\n            guard = install_git_privacy_guard(path)\n            result["git_guard"] = guard\n            if not guard.get("ready", False):\n                result["manual"].append(\n                    f"Git privacy guard conflict: {guard.get('reason') or guard}"\n                )\n        else:\n            remove_git_privacy_guard(path)\n        if sync:\n''',
          )

          replace_once(
              "src/ai_layer/integrations/status.py",
              "def _external_status(\n",
              "def _global_project_status(\n",
          )
          replace_once(
              "src/ai_layer/integrations/status.py",
              '    if mode in {"external", "strict-private"}:\n        return _external_status(\n',
              '    if mode in {"standard", "external", "strict-private"}:\n        return _global_project_status(\n',
          )

          replace_once(
              "src/ai_layer/integrations/versioning.py",
              "INTEGRATION_TEMPLATE_VERSION = 23\n",
              "INTEGRATION_TEMPLATE_VERSION = 24\n",
          )

          replace_once(
              "src/ai_layer/cli/commands/operations.py",
              '        help="Use zero-footprint external state and forbid AI-development provenance.",\n',
              '        help="Use zero-footprint machine state and forbid AI-development provenance.",\n',
          )
          replace_once(
              "src/ai_layer/cli/commands/operations.py",
              '        help="Use zero-footprint external state without enabling provenance restrictions.",\n',
              '        help="Legacy explicit zero-footprint alias; standard init is already zero-footprint.",\n',
          )
          replace_once(
              "src/ai_layer/cli/commands/operations.py",
              '    """Register a project using standard adapters or zero-footprint external attachment."""\n',
              '    """Register a project with zero repository footprint; --private adds provenance guards."""\n',
          )
          replace_once(
              "src/ai_layer/cli/commands/operations.py",
              '            "provenance": project_provenance(root),\n            "integration_template_version": INTEGRATION_TEMPLATE_VERSION,\n',
              '            "provenance": project_provenance(root),\n            "repository_writes": False,\n            "integration_template_version": INTEGRATION_TEMPLATE_VERSION,\n',
          )

          replace_once(
              "PROJECT_CHARTER.md",
              "3. **Target projects** — user repositories. AI Layer implementation is never copied into them. Standard mode may install minimal generated host bridge/native-skill files. External and strict-private modes keep managed state machine-side according to their privacy contract.\n",
              "3. **Target projects** — user repositories. AI Layer implementation and managed state are not copied into them. Standard attachment is zero-footprint and uses global host integration plus machine-side project state; strict-private adds provenance restrictions and its Git privacy guard. The legacy `external` mode remains a compatibility spelling for the same zero-footprint attachment model.\n",
          )
          replace_once(
              "ARCHITECTURE.md",
              "`standard` mode writes only minimal generated/reversible host bridges plus project-native descriptors for explicit project skills under the shared `.agents/skills/` convention. Global AI Layer skills stay in user-level native catalogs. `external` keeps project-specific descriptors at machine/user level and removes repository bridges while preserving normal provenance policy. `strict-private` is external attachment plus provenance prohibition and Git privacy guard. Canonical workflow snapshots and Epic state are machine/DB state and do not add source-controlled AI Layer artifacts to target repositories.\n",
              "`standard` mode is a zero-footprint attachment: project metadata/rules live under the machine AI Layer home, MCP/bootstrap delivery is global, and project-specific native skills are namespaced into user-level host catalogs. The legacy `external` mode is retained as a compatibility spelling for the same repository-clean attachment behavior. `strict-private` uses the same machine-side layout plus provenance prohibition and a Git privacy guard. Upgrade/repair migrates verified legacy `.ai-layer` state out of older standard repositories and removes only AI Layer-owned project MCP/skill residue while preserving unrelated user configuration.\n",
          )
          replace_once(
              "README.md",
              "External/strict-private project modes keep project-specific AI Layer state and managed skill material outside repositories according to the privacy contract.\n",
              "Standard, external and strict-private project modes keep project-specific AI Layer state and managed skill material outside repositories; strict-private additionally enforces the provenance/privacy contract.\n",
          )
          replace_once(
              "README.md",
              "The supported flow remains the repository's one-command installer/updater and immutable machine runtime layout. Runtime state lives under the AI Layer machine home rather than being copied into target projects.\n\nUse the CLI health/update/install commands and generated host integrations rather than manually editing runtime internals. Strict-private/external projects should continue to use the zero-footprint path supported by the installer.\n",
              "The supported flow remains the repository's one-command installer/updater and immutable machine runtime layout. Runtime state lives under the AI Layer machine home rather than being copied into target projects. Standard `ai-layer init` is zero-footprint: it registers the project, stores project state machine-side, relies on global host MCP/bootstrap delivery, and publishes project skills through namespaced user-level native catalogs.\n\nUse the CLI health/update/install commands rather than manually editing runtime internals. Upgrading AI Layer repairs registered projects automatically: verified legacy `.ai-layer` state is moved to machine storage and AI Layer-owned project MCP/skill residue is removed. `--private` keeps the same zero-footprint layout and additionally enables provenance restrictions plus the Git privacy guard; `--external` remains a compatibility alias for explicit zero-footprint attachment.\n",
          )
          replace_once(
              "CURRENT_STATE.md",
              "## Project Map and search\n",
              '''## Target-project attachment\n\nStandard `ai-layer init` is zero-footprint. Registered project metadata/rules live under `~/.ai-layer/projects/<project-id>/`, supported hosts use the global MCP/bootstrap installation, and project-specific native skills are published into namespaced user-level host catalogs rather than `.agents/skills` / `.claude/skills` inside the repository. `--external` remains a compatibility spelling for the same repository-clean attachment model. `--private` uses the same layout but additionally forbids AI-development provenance and installs the strict Git privacy guard.\n\nMachine upgrade/repair migrates verified legacy standard `.ai-layer` state into the canonical machine-side directory, removes only AI Layer-owned project MCP/native-skill residue, and preserves unrelated user configuration. Integration template contract v24 records this physical-delivery change.\n\n## Project Map and search\n''',
          )

          replace_once(
              "tests/test_integrations.py",
              '    assert state["template_version"] == INTEGRATION_TEMPLATE_VERSION\n    assert all(provider["ready"] for provider in state["providers"].values())\n',
              '    assert state["template_version"] == INTEGRATION_TEMPLATE_VERSION\n    assert state["repository_writes"] is False\n    assert all(provider["ready"] for provider in state["providers"].values())\n',
          )
          replace_once(
              "tests/test_integrations.py",
              '''def test_codex_project_disabled_mcp_is_not_masked_by_global_config(tmp_path: Path, monkeypatch):\n    _home, project = _installed_health_fixture(tmp_path, monkeypatch)\n    config = project / ".codex" / "config.toml"\n    text = config.read_text(encoding="utf-8")\n    config.write_text(\n        text.replace("args = []\\n", "enabled = false\nargs = []\\n", 1), encoding="utf-8"\n    )\n\n    state = integration_status(project)\n    codex = state["providers"]["codex"]\n    assert codex["ready"] is False\n    assert codex["configuration_ready"] is False\n    assert codex["mcp_reason"] == "mcp_disabled"\n    assert codex["runtime_assurance"]["state"] == "blocked"\n    assert state["ready"] is False\n    get_settings.cache_clear()\n''',
              '''def test_codex_legacy_project_disabled_mcp_does_not_override_global_config(\n    tmp_path: Path, monkeypatch\n):\n    _home, project = _installed_health_fixture(tmp_path, monkeypatch)\n    config = project / ".codex" / "config.toml"\n    text = config.read_text(encoding="utf-8")\n    config.write_text(\n        text.replace("args = []\\n", "enabled = false\\nargs = []\\n", 1), encoding="utf-8"\n    )\n\n    state = integration_status(project)\n    codex = state["providers"]["codex"]\n    assert state["mode"] == "standard"\n    assert state["repository_writes"] is False\n    assert codex["ready"] is True\n    assert codex["configuration_ready"] is True\n    assert codex.get("mcp_reason") != "mcp_disabled"\n    assert state["ready"] is True\n    get_settings.cache_clear()\n''',
          )
          marker = '''def test_remove_project_integrations_preserves_user_content(tmp_path: Path):\n'''
          insertion = '''def test_standard_sync_removes_legacy_repository_bindings(\n    tmp_path: Path, monkeypatch\n):\n    from ai_layer.core import service as project_service\n    from ai_layer.core.registry import register_project\n\n    home = tmp_path / "home"\n    project = tmp_path / "standard-project"\n    home.mkdir()\n    project.mkdir()\n    monkeypatch.setenv("HOME", str(home))\n    monkeypatch.setenv("AI_LAYER_HOME", str(home / ".ai-layer"))\n    monkeypatch.setenv("AI_LAYER_MCP_EXECUTABLE", str(home / "bin" / "ai-layer-mcp"))\n    (home / "bin").mkdir()\n    (home / "bin" / "ai-layer-mcp").write_text("#!/bin/sh\\n", encoding="utf-8")\n    (home / "bin" / "ai-layer-mcp").chmod(0o755)\n    get_settings.cache_clear()\n    try:\n        register_project(project, "standard-id", "standard", mode="standard", provenance="allow")\n        state_dir = home / ".ai-layer" / "projects" / "standard-id"\n        state_dir.mkdir(parents=True)\n        (state_dir / "project.yaml").write_text(\n            "version: 2\\n"\n            "project_id: standard-id\\n"\n            "name: standard\\n"\n            f"root: {project.resolve()}\\n"\n            "mode: standard\\n"\n            "provenance: allow\\n",\n            encoding="utf-8",\n        )\n        install_global_integrations()\n        install_project_integrations(project)\n        assert (project / ".cursor" / "mcp.json").exists()\n        assert (project / ".mcp.json").exists()\n\n        monkeypatch.setattr(\n            project_service,\n            "sync_project_native_skills",\n            lambda _root: {"repository_writes": False, "scope": "namespaced-global-zero-footprint"},\n        )\n        synced = project_service.sync_project_integrations(project)\n\n        assert synced["mode"] == "standard"\n        assert synced["repository_writes"] is False\n        for rel in [".mcp.json", ".codex/config.toml", ".agents/mcp_config.json"]:\n            assert not (project / rel).exists(), rel\n        cursor = project / ".cursor" / "mcp.json"\n        if cursor.exists():\n            assert "ai-layer" not in json.loads(cursor.read_text(encoding="utf-8")).get(\n                "mcpServers", {}\n            )\n        state = integration_status(project)\n        assert state["mode"] == "standard"\n        assert state["repository_writes"] is False\n        assert state["ready"] is True\n    finally:\n        get_settings.cache_clear()\n\n\n'''
