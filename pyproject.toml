[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "local-ai-development-layer"
version = "0.11.4"
description = "Local AI Engineering Layer: project memory, skills, policies, sessions, FastAPI and MCP."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.115,<1",
  "fastembed>=0.7,<1",
  "mcp>=2.0,<3",
  "pgvector>=0.4,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.8,<3",
  "PyYAML>=6.0,<7",
  "sqlalchemy>=2.0,<3",
  "typer>=0.16,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff==0.16.2",
  "mypy>=1.17,<2",
]

[project.scripts]
ai-layer = "ai_layer.cli.app:main"
ai-layer-mcp = "ai_layer.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_layer"]
include = ["src/ai_layer/builtin_skills/*.md", "src/ai_layer/dashboard/static/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "postgres: requires a real PostgreSQL/pgvector database",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Ruff's formatter only best-effort wraps long lines, so E501 is intentionally excluded.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Typer intentionally uses Option/Argument descriptor calls in CLI function signatures.
"src/ai_layer/cli/commands/*.py" = ["B008"]
