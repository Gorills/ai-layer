<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>AI Layer Dashboard</title>
  <link rel="stylesheet" href="/dashboard-assets/css/tokens.css">
  <link rel="stylesheet" href="/dashboard-assets/css/app.css">
  <link rel="stylesheet" href="/dashboard-assets/css/components.css">
  <link rel="stylesheet" href="/dashboard-assets/css/epics.css">
  <link rel="stylesheet" href="/dashboard-assets/css/workspace.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">AI</div>
        <div>
          <div class="brand-title">AI Layer</div>
          <div class="brand-subtitle">Local workspace</div>
        </div>
      </div>

      <div class="scope-block">
        <label class="scope-label" for="project-scope">Рабочий проект</label>
        <select id="project-scope" class="scope-select" aria-label="Рабочий проект">
          <option value="">Все проекты</option>
        </select>
        <div class="scope-note">Контекст сохраняется при переходах</div>
      </div>

      <nav class="nav" aria-label="Основная навигация">
        <div class="nav-section">Workspace</div>
        <a class="nav-item" href="#/overview" data-route="overview">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg></span><span>Обзор</span>
        </a>
        <a id="project-home-nav" class="nav-item project-nav-home" href="#/overview" data-route="project" aria-disabled="true">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 20V8l8-5 8 5v12M8 20v-6h8v6"/></svg></span><span>Сводка проекта</span>
        </a>

        <div class="nav-section">Работа</div>
        <a class="nav-item" href="#/work" data-route="work">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 3h8v4H8zM5 7h14v14H5zM9 12h6M9 16h6"/></svg></span><span>Work</span>
        </a>
        <a class="nav-item" href="#/tasks" data-route="tasks">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg></span><span>Managed Tasks</span>
        </a>
        <a class="nav-item" href="#/epics" data-route="epics">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 7h16M6 4v6M18 4v6M5 12h14v8H5zM9 16h6"/></svg></span><span>Эпики</span>
        </a>

        <div class="nav-section">Знания</div>
        <a class="nav-item" href="#/knowledge" data-route="knowledge">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM8 4v16M11 8h5M11 12h5"/></svg></span><span>База знаний</span>
        </a>
        <a class="nav-item" href="#/skills" data-route="skills">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m12 3 3 5 6 1-4 4 .9 6L12 16l-5.9 3 .9-6-4-4 6-1z"/></svg></span><span>Скиллы</span>
        </a>
        <a class="nav-item" href="#/rules" data-route="rules">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 5h14M5 12h14M5 19h9"/></svg></span><span>Правила</span>
        </a>

        <div class="nav-section">История и система</div>
        <a class="nav-item" href="#/activity" data-route="activity">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 8v5l3 2M21 12a9 9 0 1 1-2.6-6.4M21 4v6h-6"/></svg></span><span>История</span>
        </a>
        <a class="nav-item" href="#/monitoring" data-route="monitoring">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 18V9M10 18V5M16 18v-7M22 18V3"/></svg></span><span>Мониторинг</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="connection-line">
          <span id="connection-dot" class="status-dot"></span>
          <span id="connection-label">Подключение…</span>
        </div>
        <div id="sidebar-version" class="sidebar-version">AI Layer</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-copy">
          <h1 id="page-title">Обзор</h1>
          <p id="page-subtitle">Проекты, текущая работа и то, что требует внимания</p>
        </div>
        <div class="topbar-actions">
          <span class="system-state"><span class="status-dot online"></span><span>Локально</span></span>
          <span id="updated-at" class="muted">—</span>
          <button id="refresh-button" type="button" class="button icon-button" aria-label="Обновить данные" title="Обновить">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6v5h-5M4 18v-5h5M6.2 9a7 7 0 0 1 11.3-2.4L20 11M4 13l2.5 4.4A7 7 0 0 0 17.8 15"/></svg>
          </button>
        </div>
      </header>
      <section id="app" class="content" aria-live="polite"></section>
    </main>
  </div>
  <script type="module" src="/dashboard-assets/js/app.js"></script>
</body>
</html>
